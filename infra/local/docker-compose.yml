# Local development stack — Postgres/PostGIS + MinIO
# Usage from repo root:
#   docker compose -f infra/local/docker-compose.yml up -d

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: gustale-postgres
    environment:
      POSTGRES_USER: gustale
      POSTGRES_PASSWORD: gustale
      POSTGRES_DB: gustale
    ports:
      - "5432:5432"
    volumes:
      - gustale_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gustale -d gustale"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: gustale-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gustale-minio
      MINIO_ROOT_PASSWORD: gustale-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gustale_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: gustale-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 gustale-minio gustale-minio-secret; do sleep 1; done;
      mc mb --ignore-existing local/gustale-public;
      mc mb --ignore-existing local/gustale-media;
      mc anonymous set download local/gustale-public;
      echo 'MinIO buckets ready';
      "

volumes:
  gustale_pgdata:
  gustale_minio:
