  - id: GUS-233
    title: "Create real entity tables for technique and tradition"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P1
    phase: 1
    status: todo
    depends_on: [GUS-014]
    approval: true
    acceptance:
      - "A technique ENTITY table exists, distinct from the dish_techniques vocabulary"
      - "A tradition ENTITY table exists, distinct from the dish_traditions vocabulary"
      - "ADR-002's subject_type set can be widened to include them"
      - "A statement can then carry a per-entity claim (the history of THIS technique, not of the word)"
    evidence:
      - "RAISED 2026-10-26 (Alejandro, during the ADR-002 Q3 review). ADR-002 Q3 was decided as option (iii): the pilot's subject set is dish + place ONLY, and real technique/tradition entity tables are SEPARATE WORK, to be done alongside the recipe and tradition subtrees rather than inside ADR-002."
      - "WHY IT CANNOT BE FUDGED: a statement whose subject is a VOCABULARY value cannot carry per-entity claims. A claim about the history of THIS braising technique is not the same claim as one about the word 'braising'. Pointing subject_type='technique' at dish_techniques would conflate them and make the entity tables a later refactor rather than a later addition."
      - "WHY IT IS SEPARATE WORK: technique and tradition entities are places to hang history, provenance, regional variation and community practice. That is the same shape of work as the recipes subtree (GUS-015/016) and the tradition work, and doing it inside the claims ADR would couple two independent subtrees."
