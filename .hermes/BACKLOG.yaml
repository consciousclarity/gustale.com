  - id: GUS-236
    title: "Create a person entity table for attribution claims"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P2
    phase: 1
    status: todo
    depends_on: []
    approval: false
    acceptance:
      - "A person entity table exists, so created_by can take an entity reference"
      - "The predicate table's created_by value_type is updated from the person_name literal to the person entity"
      - "Existing person_name literals are migrated, or left as marked exceptions with a stated reason"
    evidence:
      - "RAISED 2026-10-26 (Alejandro, during the ADR-002 Q4 review). Q4 decided that created_by takes a TYPED LITERAL of kind person_name - a MARKED EXCEPTION under Q1's free-text rule - because the catalog has no person entity to point at. A person entity table is the backlog item that removes the exception."
      - "WHY IT CANNOT BE JUST A STRING: a creator is a person with an identity that recurs across statements - a chef credited with three dishes, an author whose work is cited repeatedly. A literal name cannot be joined to, deduplicated, or linked to the works it produced, so the evidence chain for an attribution claim cannot be checked."
      - "RELATED: ADR-002 Q1 records that the source passage and locator live on the EVIDENCE LINK, not the claim. A person entity is what lets a creator be a subject as well as a value - the person who made something, and the person who documented it, are the same kind of thing."

  - id: GUS-237
    title: "Create the place_spans relation for places that span more than one country"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P2
    phase: 1
    status: todo
    depends_on: []
    approval: false
    acceptance:
      - "A place_spans table exists: place_id, country_id, note"
      - "Punjab is seeded as spanning India and Pakistan, with a note for each half"
      - "Validation does not treat a place with parent_id IS NULL as missing data"
      - "A place that genuinely has no parent is distinguished from a place whose parent was never recorded"
    evidence:
      - "RAISED 2026-10-26 (Alejandro, during the ADR-002 Q3 review). geo_entities.parent_id expresses CONTAINMENT - one parent. Some places are not contained in a single country: Punjab is a historical region spanning India and Pakistan (Wikipedia 'Punjab': Countries Pakistan + India, ~200M people, 115M Pakistan / 75M India; the Indian state and the Pakistani province are separate articles). Parent Punjab under India would assert a containment that is false for the Pakistani half."
      - "SO: Punjab is seeded with entity_type='region' and parent_id=NULL, and its two-country membership is an n:m relation rather than a hierarchy."
      - "parent_id IS NULL IS A MEANINGFUL STATE - 'not contained in a single parent' - and validation must not read it as a missing value."
      - "HISTORY (verified against Punjab, India: 'Formation 26 January 1950, 1 November 1966 (reorganisation)', 'Previously was East Punjab, PEPSU'): 1947 = the PARTITION of British Punjab between India and Pakistan; 1950 = the Indian state formed as East Punjab (PEPSU); 1966 = the REORGANISATION OF INDIAN PUNJAB (PEPSU -> Punjab, Haryana, Chandigarh). 1966 is not a partition of the region."

  - id: GUS-238
    title: "Deduplicate the 21 redundant source rows and add a unique constraint on normalised URL"
    epic: "EPIC 03 — Build the evidence and authenticity verification system"
    priority: P1
    phase: 1
    status: todo
    depends_on: [GUS-027]
    approval: true
    acceptance:
      - "sources.normalised_url exists and is populated for every row"
      - "No two source rows share a normalised URL"
      - "Every citation points at a surviving source row; no citation is lost"
      - "Merged rows are ARCHIVED with the surviving id recorded, not hard-deleted"
      - "A unique constraint on sources.normalised_url prevents recurrence"
      - "The report of which duplicates were referenced and which were orphaned is in the commit message"
    evidence:
      - "RAISED 2026-10-26 (Alejandro, during the ADR-002 Q6 review). Measured live: 142 source rows carry only 121 distinct URLs, and after normalisation there are 12 URLs with more than one row - 21 redundant rows. There is NO unique constraint on url, so the catalog keeps accumulating the same article under several names."
      - "REFERENCED vs ORPHANED (the question asked): 21 source rows carry ZERO citations. 20 of them are in a duplicate group; 1 has a unique URL - 'Tajine' (https://en.wikipedia.org/wiki/Tajine, id 4c9f4047) - and is orphaned on its own, which is a DIFFERENT defect (a registered source that was never used) and should be flagged, not merged. Only ONE group has more than one CITED row: Moussaka, where all three rows are cited - 'Moussaka' (id 00000000), 'Levantine Moussaka' (id 5efafd8e) and 'Musakka' (id 6b806037), one citation each. Those three are three different DISHES sharing one Wikipedia article, so they are not duplicates of each other in meaning - but the same URL cannot be three sources. 'pho' is two rows with NEITHER cited."
      - "WHY BEFORE THE PILOT, NOT DURING: the pilot's output is a CORROBORATION number, and GUS-026 section 5 is explicit that 'quantity is not independence'. With 21 duplicate rows, a claim cited by two rows pointing at the same article would count as TWO sources. Deduplicating first is what makes the number mean anything."
      - "PROCEDURE: (1) normalise the URL - lowercase host, strip m./en.m. prefixes, decode percent-encoding, collapse duplicate slashes, strip the trailing slash, drop the fragment, normalise the /wiki/<Title> path case - and store it in sources.normalised_url; (2) build an id map, keeping the cited row or the oldest as the survivor; (3) re-point every citations.source_id at the survivor; (4) ARCHIVE the merged rows with the surviving id recorded, so the merge is reversible; (5) add the unique constraint."
      - "NEEDS APPROVAL: this is a bulk data change. RULES.md requires approval for bulk overwrite; step 4 archives rather than deletes, which keeps it out of that category, but it is still a bulk change and is queued for Alejandro's go rather than done."
      - "ALSO: the sources table should distinguish REGISTERED sources from CITED ones, so an unused lead (like Tajine) is visible as a lead rather than looking like evidence with zero support."


  - id: GUS-239
    title: "Archive the 121 duplicate 'en' dish_translations rows that are byte-identical to dishes.short_description"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P2
    phase: 1
    status: todo
    depends_on: []
    approval: true
    acceptance:
      - "Every dish_translations row whose description is byte-identical to its dish's short_description is archived, not deleted"
      - "No translation row that is a genuine translation of a non-English locale is touched"
      - "The archived rows retain their ids and record the dish_id and the reason"
      - "No public page, API response or metric changes as a result - the 121 published dishes are unaffected"
      - "A check exists that reports any dish_translations row whose language is 'en' and whose description equals the canonical short_description"
    evidence:
      - "RAISED 2026-10-27 (Alejandro, during the ADR-002 Q9 review). MEASURED LIVE (read-only): dish_translations has 121 rows, ALL language='en', and the description is BYTE-IDENTICAL to dishes.short_description in all 121 (0 nulls, 0 differences). These are not translations - they are exact copies of the canonical English text, duplicated into a table whose purpose is to hold renderings of other languages. WHY IT MATTERS NOW: ADR-002 Q9 decided that the dishes columns ARE the canonical text and that dish_translations is NON-CANONICAL and therefore NOT a source of description_sentences. If these rows were treated as a sentence source, every fact would be anchored twice and coverage would double-count. Archiving them removes the ambiguity at the source. Separate work, deliberately not done under ADR-002. NOTE: this is a bulk data change - RULES.md requires approval; archiving rather than deleting keeps it reversible."
      - "RELATED: the 'en' rows also mean the dish_translations.language column currently has exactly one distinct value, so the table has never actually exercised a second locale. When a real translation arrives, the uniqueness constraint dish_translations_natural_key (dish_id, language) is what prevents a second 'en' row per dish - and with these 121 archived, that constraint starts doing real work."

  - id: GUS-240
    title: "Build the sentence-splitter boundary fixture set and a single shared splitter implementation"
    epic: "EPIC 03 — Build the evidence and authenticity verification system"
    priority: P1
    phase: 1
    status: todo
    depends_on: [GUS-028]
    approval: false
    acceptance:
      - "ONE splitter implementation exists and is used by both the population run and the concat check"
      - "A fixture set covers quotes, decimals, abbreviations, initials and ellipses, each with the expected split"
      - "The fixture set fails loudly if the splitter's behaviour changes"
      - "The concat check (reconstructed string == live column) is a separate gate and is not treated as evidence of correct boundaries"
      - "The 3 pilot dishes' sentences are reviewed by a human and the boundaries confirmed"
    evidence:
      - "RAISED 2026-10-27 (Alejandro, during the ADR-002 Q9 review). THE ROUND-TRIP PROVES NOTHING ABOUT BOUNDARIES: a zero-width split rejoins exactly BY CONSTRUCTION - it never removes a character, so it reconstructs the input whether the boundaries are right or wrong. Measured live: short_description 122/122 and long_description 22/22 round-trip exactly with regexp_split_to_array(text, '(?<=[.!?])(?=\\s)') rejoined with ''. That proves table-to-column agreement and NOTHING about where the sentences are. The boundaries need their own instrument."
      - "WHY THE FIXTURES EXIST RATHER THAN A REGEX CONSTANT: the live catalog happens to contain none of the risky cases - measured 0 decimals, 0 initials (A.), 0 abbreviations (Inc/Ltd/St/Dr/Mr/vs/etc) in either description column - so a naive splitter passes on today's data and would break when the content workstream brings richer prose. 11 of the 22 populated long_description rows DO contain a quoted passage of 10+ characters (e.g. '\"Babi\" means pig and \"panggang\" means grilled'). The splitter must therefore be a RULE WITH AN ESCAPE HATCH: a terminator that is not inside a quoted span, not between digits, not part of an abbreviation or initial, not part of an ellipsis, and is followed by whitespace."
      - "TWO TRAPS MEASURED IN POSTGRES, recorded so they are not re-introduced: (a) regexp_split_to_array(text, '(?<=[.!?])(\\s+)') rejoined with '' gives only 95/122 exact, because regexp_split_to_array DROPS A CAPTURED GROUP AT THE END OF THE STRING - the final separator is lost; (b) regexp_split_to_array(text, '(\\s+)(?<=[.!?])') rejoined with '' gives 122/122 exact BUT silently counts chicken-tikka-masala as 1 SENTENCE instead of 2, because the lookbehind is evaluated after the whitespace, so the pattern only matches whitespace FOLLOWED BY a terminator and never splits."
      - "ONE IMPLEMENTATION, USED TWICE: the check must not be able to pass against a different splitter than the one that wrote the rows. The fixtures and the population run both call the same function."
      - "HUMAN REVIEW IS NOT REPLACED BY THE FIXTURES: the fixture set proves the rule is implemented correctly on the cases it names; it cannot prove the rule is right. The 3 pilot dishes' sentences are read by a human and their boundaries confirmed."
      - "ALSO COVERS THE UNTESTED 'long' PATH: all 3 pilot dishes have an EMPTY long_description (measured), so the pilot cannot exercise the long path (166 sentences across 22 published dishes, 1-12 per dish). The fixtures must cover it before the content workstream populates long_description."


  - id: GUS-241
    title: "Add ~50 dishes from unexpected locations, and guarantee every dish has a well-fitting category"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P1
    phase: 2
    status: todo
    depends_on: [GUS-014, GUS-225]
    approval: false
    acceptance:
      - "50 new dishes are seeded, drawn from locations the catalog does not already cover well, with a written rationale for each location. The approved pool is 48 (pulaka and chicha de jora removed) plus the 10 non-English-article dishes in reserve for tranche 1"
      - "Every new dish has a dimension state for EVERY dimension - a controlled-vocabulary value, OR an explicit unset recorded in dish_dimension_unset WITH A REASON (disputed / no_evidence / not_applicable). An unset dimension is a recorded decision, not a gap"
      - "The 18 EXISTING cuisine gaps are also filled - the rule applies to the whole catalogue, not only to new dishes. The 19th (chicken-tikka-masala's cuisine) stays unset with reason 'disputed'"
      - "dish_cuisine holds NATIONAL cuisines only. Regional and transnational traditions (Levantine, Maghrebi, Central European, Minangkabau) go in dish_tradition - matching the existing rendang = indonesian + minangkabau pattern. A transnational dish gets cuisine unset(disputed) plus a tradition"
      - "15 new national cuisine values are added, each reviewed as an individual line against the national rule: Austrian, Brazilian, Canadian, Greek, Hungarian, Jordanian, Moroccan, Nigerian, Polish, Portuguese, Ukrainian, American - plus the 2 assignments from existing values (vindaloo -> Indian, khao-soi -> Thai). TUNISIAN, NEPALESE AND PUERTO RICAN ARE NOT CREATED - couscous, momo and tostones carry unset(disputed) instead"
      - "mansaf = jordanian + levantine; tagine = moroccan + maghrebi; couscous = unset(disputed) + maghrebi; momo = unset(disputed) + tibetan; tostones = unset(disputed) + caribbean; borscht = ukrainian, PROVISIONAL pending a non-Wikipedia source. The Tibetan and Caribbean tradition values are NEW - Levantine and Maghrebi already exist"
      - "3 new dish_family values are added: stiff-porridge (fufu, ugali, to, dhindo, ambuyat), porridge (ogi, canjica, + bubur-ayam), stuffed-vegetable (levengi, rocoto relleno, + dolma). stiff-porridge vs porridge is a TEXTURE distinction and needs a precedence rule stated, or the two will collide"
      - "3 new dish_technique values are added: pit-roasting (umu, pachamanca, curanto - the method IS the vessel), fermenting, curing"
      - "The ingredient values offal, leafy-greens and seafood are USED (all three already exist in the live vocabulary - this is a use decision, not a creation). seafood becomes a PARENT: Fish and Shellfish are re-parented under Seafood, and Shrimp and Octopus are added (neither exists today)"
      - "The rejected families are NOT created: leaf-stew, offal, seafood and raw/preserved. Their dishes are re-routed - leaf-stews -> stew + leafy-greens, offal dishes -> soup/stew/kebab + offal, seafood stews -> stew + seafood, raw/preserved -> the fermenting/curing techniques"
      - "A dish name never becomes a family unless at least 2 dishes in the catalogue would carry that family value"
      - "Every new dish has a place on the website - a published page at /dishes/<slug> rendering its description, dimensions and evidence panel"
      - "Each new dish is seeded DIRECTLY INTO THE CLAIMS MODEL, never the old one - it arrives with its place, description, dimensions AND source in one operation, and with at least 1 NON-WIKIPEDIA source for its origin claim"
      - "Each new dish's place is set from the source, not derived from the origin_location geometry - a geocode is not a citation"
      - "Every new dish's short_description is written in the catalogue's own words (never copied from Wikipedia), per the content rules"
      - "Seeding proceeds in tranches of 10 under pilot discipline (snapshot -> dry-run on a copy -> live -> verify), with Alejandro's review between tranches"
    evidence:
      - "RAISED 2026-10-27 (Alejandro): 'we need more dishes from different regions that do not fit in the usual common schema; we must find a place on the website for every dish; even the most difficult dish must have a category that fits well; we need like 50 dishes from the locations that would not be expected'. This is a CATALOG-BREADTH task, and it lands on a measured schema-capacity limit - see the audit below."
      - "CAPACITY AUDIT (measured read-only on live gustale, 2026-10-27) - WHERE THE CURRENT SCHEMA BREAKS: (1) CUISINE VOCABULARY COVERS 21 OF 36 ORIGIN COUNTRIES. dish_cuisines has 21 values; the catalogue's 121 published dishes are attributed to 36 countries; and 19 PUBLISHED DISHES HAVE NO dish_cuisines ROW AT ALL, across 18 countries. RECOUNT (Alejandro's correction, same day): of those 19, EIGHTEEN ARE GAPS and ONE (chicken-tikka-masala) IS UNSET BY DECISION - the Glasgow dispute (ADR-001 D1) - so the gap count is 18, not 19. The 18 gaps: Brazil acaraje + feijoada, Austria wiener-schnitzel, Canada poutine, Greece moussaka-greek, Hungary goulash-hungarian, India vindaloo, Jordan mansaf, Morocco tagine-moroccan, Nepal momo, Nigeria jollof-rice, Poland pierogi, Portugal bacalhau-a-bras, Puerto Rico tostones, Thailand khao-soi, Tunisia couscous, Ukraine borscht, United States hamburger-american. Every one of them has a FAMILY and a COURSE but no cuisine - so 'every dish has a category that fits well' IS CURRENTLY FALSE for 18 of 121 dishes, before any new dish is added. (2) dish_dish_cuisines IS SINGLE-VALUED BY SCHEMA (constraint dish_dish_cuisines_single, UNIQUE (dish_id)), so a dish cannot carry two cuisines - which is exactly why the REGIONAL/TRANSNATIONAL traditions go in dish_tradition (multi-valued) rather than dish_cuisine. (3) THE OTHER DIMENSIONS: dish_dish_courses and dish_dish_families also carry UNIQUE(dish_id); dish_dish_contexts, dish_dish_techniques, dish_dish_traditions and dish_dish_ingredient_categories are multi-valued (UNIQUE (dish_id, value_id)). (4) MEASURED GAPS ACROSS ALL 121 PUBLISHED DISHES: no_family_row 29, no_cuisine_row 19 (18 gaps + 1 deliberate unset), no_course_row 5, no_technique_row 4, no_category_at_all 0 - every dish has SOME category; the gap is WHICH category, not whether one exists. (5) THE VOCABULARIES: 25 families, 21 cuisines, 8 courses, 25 techniques, 36 traditions, 5 contexts, 53 ingredient categories. (6) NO DISH CURRENTLY HAS ITS canonical_name EQUAL TO A FAMILY NAME except moussaka-greek - so there is no precedent for the awkward case; the 50 new dishes WILL create that precedent, and the >=2-members rule (Alejandro) is what makes it safe."
      - "CORRECTED (Alejandro, 2026-10-27): THE COURSE VOCABULARY DOES NOT BREAK. An earlier version of this entry called the 8 course values 'the dimension most likely to need extension' - that was wrong. A dish eaten at breakfast AND bought as street food is course + context (ADR-001 D2 made dish_context a separate multi-valued dimension for exactly this), and a dish whose course depends on the meal is recorded by its PRIMARY ROLE (ADR-001 D3f). So the course vocabulary absorbs unfamiliar dishes unchanged. The dimension that DOES need extension is CUISINE (national values), and the rule that governs it is: dish_cuisine holds NATIONAL cuisines only; regional and transnational traditions go in dish_tradition (matching rendang = indonesian + minangkabau); new national values are added individually by decision (Q6's rule - never a blanket per-country sweep); Puerto Rico gets its own value. A transnational dish gets cuisine unset(disputed) + a tradition - which is exactly the chicken-tikka-masala case, whose traditions Glasgow Muslim and British National already exist in dish_traditions. This closes the ADR-001 section 4 follow-up on national-vs-regional cuisines."
      - "THE FAMILY RULE (Alejandro, 2026-10-27): A DISH NAME NEVER BECOMES A FAMILY UNLESS AT LEAST 2 DISHES WOULD CARRY THAT FAMILY VALUE. If only one dish in the catalogue would carry a value, that value is not a family - it is a description. This is what stops moussaka-greek from becoming the family 'Moussaka', and it is what makes the family vocabulary safe to extend: a new family value is admitted only once a second dish genuinely belongs to it."
      - "WHY THIS TASK AND THE ADR ARE RELATED: ADR-002 Q3 restricted the pilot's place hierarchy to 11 places for the 3 pilot dishes, and the breadth measurement showed geo_entities holds 36 COUNTRY ROWS AND NOTHING ELSE - no regions, no cities, no hierarchy, 0 wikidata_id. Adding 50 dishes from new locations multiplies that gap. The rule that every dish must have a well-fitting category is therefore a REQUIREMENT ON THE VOCABULARIES, not just on the data, and it is the same rule ADR-001 D3j and Q4 already enforce: a new predicate or value is added only by explicit decision, and a value is never forced where nothing fits."
      - "DEPENDENCY NOTE (CORRECTED by Alejandro, 2026-10-27): the 50 new dishes are SEEDED DIRECTLY INTO THE CLAIMS MODEL, NEVER THE OLD ONE - they arrive with place, description, dimensions AND source in one operation, and each needs >= 1 NON-WIKIPEDIA source for its origin claim. So they are sequenced AFTER the claims model lands (Q11's order: (a) cuisine gaps, (b) ADR-002 + pilot, (c) the 50 dishes). They therefore do NOT join the unevidenced population - they are the first content that starts life in the new model, and they set the precedent for how the other 118 will eventually be researched. Seeding proceeds in TRANCHES OF 10 under pilot discipline (snapshot -> dry-run on a copy -> live -> verify), with Alejandro's review between tranches. WHY NOT THE OLD WAY: the old model cannot express the content honestly (citations.claim_text is a whole description, 120 of 121), so a dish seeded the old way arrives with the over-broad proposition the ADR exists to dissolve."
      - "THE PLACE RULE: a new dish's place must come from its SOURCE, not from dishes.origin_location. That column is a geometry holding WKB hex (measured: 121 of 121 populated, only 8 have an origin_date) - so deriving a place from it is deriving it from a geocode, not from a citation. The place entity must be sourced and written like any other content."
      - "TRADITION BUG FOUND AND FIXED (Alejandro caught it: tradition no_evidence was 118, should be 115). THE CAUSE WAS NOT THE SLUG/DISPLAY-NAME BUG (bug 4) - that one had already been fixed and Shrimp and Octopus were inserting correctly. THE REAL CAUSE: the migration's step 3a VALUES LIST ONLY ASSIGNED TWO TRADITIONS - mansaf -> levantine and tagine-moroccan -> maghrebi. THE THREE DISPUTED DISHES' TRADITIONS WERE NEVER IN THE LIST: couscous -> maghrebi, momo -> tibetan, tostones -> caribbean. The insert reported '0 rows' for the missing three and NOTHING FAILED - the migration completed and the tradition count came out 118. THE LESSON: a missing VALUES row is indistinguishable from 'the WHERE clause matched nothing', and the migration had no assertion to tell them apart. FIXED: step 3a now assigns all five, with the comment that AN UNSET CUISINE DOES NOT MEAN THE DISH HAS NO TRADITION - the tradition is precisely what survives the dispute."
      - "THE 0-ROW-INSERT ASSERTION (Alejandro's requirement, now implemented as a PRE-FLIGHT ASSERTION BLOCK). The migration creates a temp table _g241_expected (label, expected, actual) and registers an expected count for every insert that is supposed to match rows: tradition assignments (5), cuisine assignments (15), disputed unset rows (4), new tradition values (2), new ingredient values (2), provisional cuisine rows (1), dimension tables with provenance+status (7), tradition unset cells (115). A final DO block compares each expected with each actual and RAISES, so ANY mismatch ABORTS THE WHOLE MIGRATION (it is in one transaction) with a message naming the label, the expected count and the actual. PROVEN TO WORK: with the fix reverted (the couscous -> maghrebi assignment removed, exactly the original bug) the migration aborted with 'GUS-241 PRE-FLIGHT ASSERTION FAILED (2 rows): tradition assignments: expected 5, got 4 / tradition unset cells: expected 115, got 116'. THE ASSERTION IS ALSO THE DOCUMENTATION - it states the expected numbers inline, so a future edit that breaks a count fails loudly instead of silently."
      - "Q1 (Alejandro): PROVENANCE + STATUS COLUMNS ADDED TO ALL SEVEN dish_dish_* TABLES, using the same narrow pair already on dish_dish_techniques (added by GUS-014's broadened-family-corrections migration): provenance text NOT NULL DEFAULT 'preparation' ('how the value was established') and status text NOT NULL DEFAULT 'active' ('active | provisional - a value inferred rather than evidenced, pending a claim'). The migration adds them idempotently and then VERIFIES all seven have both, raising if any is missing. BORSCHT IS INSERTED WITH status='provisional' pending a non-Wikipedia source - the assignment is made now and the row says so, and an assertion checks that exactly 1 provisional cuisine row exists."
      - "Q2 (Alejandro): THE statements FK ON dish_dimension_unset IS AN EXPLICIT ACCEPTANCE CRITERION ON GUS-027/028, not something this migration does - the statements table does not exist yet, so the migration creates statement_id as a plain uuid and adds the FK only if public.statements is present. The deferred FK is recorded as an acceptance criterion on the claims-model task so it cannot be forgotten."

      - "CUISINE BATCH APPROVED WITH LINE CHANGES 2026-10-27 (Alejandro). The 15 lines were approved as ONE BATCH with changes to 5: (1) mansaf = jordanian + levantine (the shared Levantine heritage rides in dish_tradition, where 'Levantine' ALREADY EXISTS); (2) tagine = moroccan + maghrebi (same shape; 'Maghrebi' ALREADY EXISTS); (3) couscous = UNSET(disputed) + maghrebi - UNESCO JOINT INSCRIPTION, THE CTM CASE - and THEREFORE 'TUNISIAN' IS NOT CREATED (0 members after the move, and a value with no members is not a value); (4) momo = unset(disputed) + tibetan/himalayan tradition - so the 'NEPALESE' CUISINE VALUE IS NOT CREATED for it; (5) tostones = unset(disputed) + caribbean tradition - so the 'PUERTO RICAN' CUISINE VALUE IS NOT CREATED for it. ALSO: borscht = ukrainian, PROVISIONAL pending a non-Wikipedia source; american = national value, APPROVED (the earlier 'needs a second look' flag is closed); vindaloo -> indian and khao-soi -> thai approved. THE FOUR DISPUTED CELLS, EACH WITH VERIFIED EVIDENCE (checked against the Wikipedia article leads, not assumed): chicken-tikka-masala/cuisine/disputed (Glasgow vs the subcontinent, ADR-001 D1); couscous/cuisine/disputed ('a staple food throughout the Maghrebi cuisines of Algeria, Tunisia, Mauritania, Morocco, and Libya' and 'In December 2020, Algeria, Mauritania, Morocco, and Tunisia obtained official recognition... on the Representative List of the Intangible Cultural Heritage of Humanity by UNESCO' - FOUR countries, one dish); momo/cuisine/disputed ('a type of steamed, filled dumpling in Nepalese and Tibetan cuisine' - two cuisines, one dish); tostones/cuisine/disputed ('commonly found in Latin American cuisine and Caribbean cuisine' - Puerto Rico vs the wider Caribbean). TWO NEW dish_tradition VALUES ARE NEEDED: Levantine and Maghrebi already exist, but TIBETAN and CARIBBEAN DO NOT. NOTE also that the 'Momo' English Wikipedia title is a DISAMBIGUATION page - the dish article is 'Momo (food)', which redirects from 'Momo (dumpling)' - so the citation must use the target."
      - "SEAFOOD HIERARCHY AS APPROVED (Alejandro): fish + shellfish UNDER seafood; shrimp UNDER shellfish (a crustacean); octopus DIRECTLY UNDER seafood (a mollusc). VERIFIED against the live ingredient_categories: Seafood, Fish and Shellfish all existed as ROOTS (parent_id IS NULL), and the only existing parent/child pairs were Coconut->Produce, Beef/Pork->Red meat, Chicken->White meat. So the change is: re-parent Fish and Shellfish under Seafood, and INSERT Shrimp and Octopus (neither existed). ingredient_categories.parent_id ALREADY EXISTS, so this uses a column already there."
      - "THE TWO SEPARATE CALLS RESOLVED: svid = family unset(not_applicable), technique boiling, ingredient offal; chhurpi = A CHEESE = A PRODUCT, NOT A DISH -> RESERVE (not a candidate). NOTE 'cheese' as an ingredient_category value already exists in the live vocabulary, so chhurpi would have had an ingredient without a dish form - which is precisely why it is a product and not a dish."
      - "THE (a) MIGRATION IS APPROVED AND DRY-RUN ON A COPY (RULES.md approval given; Alejandro's standard discipline: snapshot -> dry-run on copy -> live -> verify). Migration: db/migrations/gus-241-taxonomy-and-unset-dimensions.sql. Trigger tests: scripts/hermes/gus-241-trigger-tests.sh. WHAT THE DRY-RUN FOUND AND FIXED (all caught on the COPY, never live): (1) the FK to statements FAILED because the statements table does not exist yet (the claims model has not landed) - the migration now creates statement_id as a plain uuid and adds the FK ONLY IF public.statements exists, so it can run BEFORE the claims model and a later migration adds the constraint; (2) the both-directions trigger USED A DYNAMIC TABLE NAME built from the dimension name, which produced 'dish_dish_cuisine' (singular) and does not exist - the dimension name and the table suffix differ for 'cuisine' and 'ingredient_category', so the function now maps the seven dimensions to their tables EXPLICITLY; (3) THE TRIGGER CAUGHT THE MIGRATION'S OWN ORDERING BUG - the backfill marked tradition cells as unset and then the same transaction tried to add the Levantine/Maghrebi traditions, which the trigger correctly rejected - so the gap-filling step now runs BEFORE the backfill; (4) Shrimp and Octopus were NOT INSERTED because the parent lookup used the display names ('Seafood', 'Shellfish') while the live table stores LOWERCASE slugs ('seafood', 'shellfish') - so the join matched nothing and the insert silently reported 0 rows. All four are fixed and the dry-run re-run clean. DRY-RUN RESULT ON THE COPY: 3 families + 3 techniques + 14 cuisines + 2 traditions + 2 ingredient values inserted, 2 re-parented; 386 dish_dimension_unset rows (4 disputed + 382 no_evidence + 0 not_applicable); THE GUS-231 CHECK: missing_both=0, has_both=0, value_only=461, unset_only=386. The migration is FULLY IDEMPOTENT - a second run reports INSERT 0 0 for every statement and identical counts. ALL 8 TRIGGER TESTS PASS, including BOTH DIRECTIONS: a value into a cell recorded as unset is REJECTED, and an unset for a cell that already has a value is REJECTED; plus the CHECK on reason, the CHECK on dimension, the UNIQUE on (dish, dimension), and the legitimate unset for a cell with neither state. TWO OF THE EIGHT TESTS INITIALLY 'PASSED' WRONGLY AND THE FAULT WAS THE TEST, NOT THE TRIGGER: one used a cuisine value that had deliberately not been created (nepalese, because momo's cuisine is unset), and one used a dish with no technique row at all (moqueca, one of the 4 technique-gap dishes); both were corrected and then correctly rejected. Live database confirmed UNTOUCHED - dish_dimension_unset does not exist there."
      - "THE BACKFILL, per Alejandro: EVERY existing empty cell becomes an explicit unset BEFORE the GUS-231 check - default reason no_evidence; disputed EXPLICITLY for the four named dishes (chicken-tikka-masala, couscous, momo, tostones); not_applicable ONLY where it is genuinely true. MEASURED, THE 403 EMPTY CELLS ACROSS 121 PUBLISHED DISHES ARE: tradition 120, ingredient_category 118, context 108, family 29, cuisine 19, course 5, technique 4. AFTER THE 15 CUISINE ASSIGNMENTS, 386 CELLS REMAIN: tradition 118, ingredient_category 118, context 108, family 29, course 5, technique 4, and cuisine 4 (the disputed ones). not_applicable COUNT IS 0 - because NO published dish genuinely has an inapplicable dimension; the case exists for future dishes and the migration carries a hook for it. The per-reason counts are reported by the migration itself, as Alejandro asked."

      - "TAXONOMY EXTENSION DECISIONS 2026-10-27 (Alejandro, against the 50-dish shortlist). FAMILIES ADMITTED (3): 'stiff-porridge' (fufu, ugali, to, dhindo, ambuyat - a stiff, sliceable or cake-like starch eaten with a soup or sauce), 'porridge' (ogi, canjica, + bubur-ayam - a soft, pourable grain porridge), 'stuffed-vegetable' (levengi, rocoto relleno, + dolma - a vegetable or leaf stuffed with a filling). stiff-porridge vs porridge IS A TEXTURE DISTINCTION and that is what makes them two families rather than one - a stiff porridge holds a shape and is eaten in pieces, a soft porridge is spooned. NOTE: both need a PRECEDENCE RULE stated, or they will collide - the same kind of decision ADR-001 D3i made for stew vs soup. TECHNIQUES ADMITTED (3): 'pit-roasting' (umu, pachamanca, curanto - dishes whose METHOD IS THE VESSEL; none of them is 'Roasting', and both 'Roasting' and 'Spit-roasting' already exist and neither covers a stone-heated pit), 'fermenting' (injera, lahpet, ogi, skyr, mishti doi, kiviak, hakarl), 'curing' (kilishi, chicharron, chhurpi, kiviak, hakarl, svid). INGREDIENT VALUES: offal, leafy-greens and seafood ADMITTED - AND A FINDING: ALL THREE ALREADY EXIST in the live ingredient_categories vocabulary (53 rows, including all three plus 'Fish' and 'Shellfish'), so this is a USE decision, not a creation - the values were there and unused. 'seafood' AS A PARENT REQUIRES A HIERARCHY CHANGE: measured, Seafood, Fish and Shellfish are all ROOTS (parent_id IS NULL), and the only existing parent/child pairs are Coconut->Produce, Beef/Pork->Red meat, Chicken->White meat. To make seafood a parent leaving shrimp, octopus, fish: re-parent Fish and Shellfish under Seafood, and INSERT Shrimp and Octopus (which do NOT exist today - verified against the live 53-row vocabulary). ingredient_categories.parent_id ALREADY EXISTS, so this is using a column that is already there, exactly as Q3 did with geo_entities.parent_id."
      - "FOUR FAMILIES REJECTED, WITH THEIR RE-ROUTING (recorded because WHY a family was refused is what stops the same proposal returning): leaf-stew REJECTED - the leaf is an INGREDIENT not the dish's form -> family 'stew' + ingredient 'leafy-greens' (romazava, matapa, muamba); offal REJECTED - the animal part is an ingredient and the form is already covered -> khash and paya -> family 'soup', nihari and tripas a moda do Porto -> family 'stew', anticucho -> family 'kebab', all + ingredient 'offal'; seafood REJECTED - same reason as offal -> bobó de camarão and polvo a lagareiro -> family 'stew' + ingredient 'seafood'; raw/preserved REJECTED - it is a TECHNIQUE not a form -> the fermenting/curing techniques carry it (kitfo, kokoda, hakarl, svid, chhurpi). TWO DISHES STILL NEED A SEPARATE CALL, AS FLAGGED: svid (cured lamb) and chhurpi (dried yak cheese) have an ingredient and a technique but NO FAMILY YET - because a cured or dried food is a STATE, not a FORM, and there is no family for that. They are NOT in the first 50 until that call is made."
      - "THREE REMOVALS FROM THE SHORTLIST, FOR STATED REASONS: 'pulaka' is A CROP (taro), NOT A DISH - dropped unless a specific dish is named; 'murtabak'/'mutabbaq' are THE DIASPORA CASE - martabak is currently ONE row in the catalogue and the split into martabak-manis/martabak-telur is GUS-230'S TO MAKE (not done yet), so seeding a third spelling here would duplicate an existing decision - OFF THE LIST; DRINKS (chicha de jora) are a DRINK, not eaten as food - out of scope unless eaten as food, so moved to RESERVE. THE 10 NON-ENGLISH-ARTICLE DISHES GO TO RESERVE FOR TRANCHE 1 (not dropped): they need a non-English Wikipedia title with the citation language recorded, and tranche 1 is where that source-hunting happens anyway. NET EFFECT ON THE POOL: 50 -> 48 (pulaka and chicha de jora removed)."
      - "THE unset_reason MECHANISM (Alejandro's design): A SEPARATE TABLE, not a column on the seven join tables. dish_dimension_unset (id, dish_id -> dishes ON DELETE CASCADE, dimension enum('family','cuisine','course','technique','ingredient_category','tradition','context'), reason enum('disputed','no_evidence','not_applicable'), note text, statement_id uuid REFERENCES statements(id) NULL, created_at, updated_at, UNIQUE NULLS NOT DISTINCT (dish_id, dimension)). WHY A SEPARATE TABLE: a column would have to be added to SEVEN tables, nullable and reason-typed in each - seven copies of the same vocabulary, seven places for the 'value and unset never coexist' rule to live, and seven places for a CHECK constraint to be forgotten. One table means ONE enum, ONE uniqueness constraint, ONE trigger. THE TRIGGER FIRES IN BOTH DIRECTIONS: on all seven dish_dish_* tables (AFTER INSERT OR UPDATE, reject a value for a (dish, dimension) that has an unset row) AND on dish_dimension_unset (AFTER INSERT OR UPDATE, reject an unset for a (dish, dimension) that has a value row) - both are needed, because a one-sided trigger leaves a hole (value inserted first, unset second, and the unset lands). A PAIR WITH BOTH IS UNREACHABLE, NOT MERELY DISCOURAGED. THE GUS-231 CHECK IS NOW EXACTLY EXPRESSIBLE: every published dish x 7 dimensions has exactly one of {a value row, an unset row} - a single FULL OUTER JOIN query over two tables, failing loudly on a dimension with NEITHER, which is the actual defect. NOTE the statement_id column is nullable and NULL until researched, so an unset dimension can carry the statement that will eventually resolve it, and Q10's rule (statements are independent entities, the subject is the only link) is respected - the unset row points at a statement ABOUT THAT DISH, and the consistency check applies as it does to a value row."

      - "THE 15 NEW NATIONAL CUISINE VALUES - ONE REVIEW, 15 INDIVIDUAL LINES (Alejandro, 2026-10-27), each checked against the NATIONAL rule (is this a national food culture, or a regional/transnational tradition that belongs in dish_tradition?). (1) AUSTRIAN (Austria) - fills wiener-schnitzel. NATIONAL: Austria has a distinct national food culture (wiener schnitzel, tafel spitz, kaiserschmarrn, apfelstrudel). No shortlist dish yet, but the value has >=1 member now and more Austrian dishes would follow. (2) BRAZILIAN (Brazil) - fills acaraje, feijoada. NATIONAL: Brazil has one of the most distinctive national cuisines in the world. ALSO IN SHORTLIST: acaraje, bobó de camarão, canjica, coxinha, farofa, moqueca, pão de queijo - so the value has SEVEN shortlist members, making it one of the best-supported additions. (3) CANADIAN (Canada) - fills poutine. NATIONAL but REGIONALLY CONCENTRATED: poutine is Québécois; the rest of Canada has no single national dish. DECISION: 'Canadian' is still correct as the national value (Canada does have a distinct food culture - the Maritime, the Prairies and Quebec each with their own) and the QUEBECERNESS is a dish_tradition, not a reason to refuse the cuisine. (4) GREEK (Greece) - fills moussaka-greek. NATIONAL, with a caveat: Greek cuisine spans mainland and island traditions, but the national frame is correct and the islands are traditions. ALSO IN SHORTLIST: bougatsa. (5) HUNGARIAN (Hungary) - fills goulash-hungarian. NATIONAL, and one of Europe's most distinct. (6) JORDANIAN (Jordan) - fills mansaf. NATIONAL (mansaf is THE Jordanian national dish), BUT PARTLY TRANSNATIONAL - the Levantine/Bedouin culinary identity is shared with Palestine, Syria and Lebanon. DECISION: the NATIONAL value stays national (Jordanian cuisine is distinct) and the SHARED heritage lives in dish_tradition, where 'Levantine' ALREADY EXISTS. SAME SHAPE AS chicken-tikka-masala: cuisine unset(disputed) + tradition. (7) MOROCCAN (Morocco) - fills tagine-moroccan. NATIONAL. The Maghrebi element is shared with Tunisia, Algeria and Libya, so 'Maghrebi' already in dish_traditions carries that, not the cuisine. (8) NEPALESE (Nepal) - fills momo. NATIONAL. ALSO IN SHORTLIST: chhurpi, dhindo, pitha, sel roti - four members. (9) NIGERIAN (Nigeria) - fills jollof-rice. NATIONAL, and one of the best-supported: ALSO IN SHORTLIST chin chin, dan wake, kilishi, kuli-kuli, ogi, puff-puff, suya, tuwon masara, tuwon shinkafa - NINE members. (10) POLISH (Poland) - fills pierogi. NATIONAL. (11) PORTUGUESE (Portugal) - fills bacalhau-a-bras. NATIONAL. ALSO IN SHORTLIST: bacalhau a brás, cozido, francesinha, pastel de nata, polvo a lagareiro, tripas a moda do Porto - six members. (12) PUERTO RICAN (Puerto Rico) - fills tostones. ALEJANDRO'S RULE: ITS OWN VALUE, not folded into 'American'. Puerto Rico has a distinct national food culture (mofongo, tostones, pasteles, asopao, arroz con gandules) and collapsing it into 'American' would erase it - which is ALSO why 'United States' cannot simply absorb it. ALSO IN SHORTLIST: mofongo. (13) TUNISIAN (Tunisia) - fills couscous. NATIONAL, and the strongest test of the rule: couscous is genuinely SHARED across the Maghreb, and Tunisia and Morocco do not have a clean single-dish claim on it. DECISION: the national value stays national (Tunisian cuisine IS distinct - harissa, brik, baksawa, lablabi) and the SHARED dish heritage is carried by dish_tradition, where 'Maghrebi' already exists. The dish is national-by-habit even where the dish is shared. (14) UKRAINIAN (Ukraine) - fills borscht. NATIONAL, and borscht is genuinely contested with Russia and Poland - the national value is correct and the shared heritage is a tradition. (15) AMERICAN (United States) - fills hamburger-american. THE ONE THAT NEEDS A SECOND LOOK, FLAGGED NOT DECIDED: the US has no single national food culture in the way Brazil or Thailand do - it is a multi-region immigrant cuisine, and 'American' as a food culture is arguably a REGIONAL (North American) frame rather than a national one. NOTE the slug is 'hamburger-american' rather than 'hamburger', which suggests the catalogue already treats 'American' as a cuisine value. ALTERNATIVE: carry it as a tradition instead. NO SHORTLIST DISH IS AMERICAN, so this value has exactly one member today - which is worth noting against the >=2 rule (that rule governs FAMILIES, not cuisines, so it does not block the value, but it does mean 'American' is currently a thin national category)."
      - "AND 2 ASSIGNMENTS FROM EXISTING VALUES (no new value needed): 'Indian' -> vindaloo (dish_cuisines already has 'Indian' and 'South Indian'; vindaloo is unassigned and ADR-001's 13 broader-family proposals are still open, so this is an ASSIGNMENT decision, not a vocabulary extension) and 'Thai' -> khao-soi (dish_cuisines already has 'Thai'; khao-soi is simply unassigned). THE FULL 18-GAP SET: 15 new national values + 2 assignments + 1 deliberate unset (chicken-tikka-masala's cuisine, the Glasgow dispute, ADR-001 D1) = 18."

      - "SHORTLIST DELIVERED 2026-10-27: .hermes/REPORTS/GUS-241-candidate-shortlist.md - 50 SELECTED candidates plus 69 VERIFIED RESERVE, with the machine-readable verification state in .hermes/REPORTS/GUS-241-shortlist-verified-titles.json. SELECTION: 50 dishes across 32 COUNTRIES and 9 regions (Latin America 11, South Asia 9, West Africa 7, Southeast Asia 6, Mediterranean/Iberia/Atlantic islands 5, East Africa/Horn 4, North Africa/Middle East/Central Asia 3, Arctic/sub-Arctic 3, East Asia/Pacific 2), covering 6 courses (Main course 32, Snack 5, Dessert 5, Appetizer 4, Breakfast 3, Drink 1). Every one of the 50 HAS A VERIFIED ENGLISH WIKIPEDIA ARTICLE. VERIFICATION METHOD: action API via curl -4 with 1.6-2.2s pacing (the MediaWiki API rate-limits aggressively - 429s forced a backoff, and a REST-summary fallback was tried and abandoned because it returns Internal error for several titles). A TITLE-EXISTENCE CHECK ALONE IS NOT ENOUGH, because several titles are REDIRECTS to a differently-named article - and the citation must use the TARGET, not the requested title: Kelewele -> Fried plantain, Alloco -> Fried plantain, Mutabbaq -> Murtabak, Firfir -> Fit-fit, Doro wat -> Wat (food), Achu soup -> Achu (soup), Cozido -> Cocido, Bobolo -> Chikwangue, Foufou -> Fufu, Mafe -> Peanut stew, Banga soup -> Palm nut soup. The redirect targets are recorded in the JSON so the citation and the excerpt fetch both use them. ALSO RECORDED: 10 candidates with NO confirmed English article (Nkui, Poulet DG, Sopa de mani, Ota ika, Palakata, Kuy teav, Bai sach chrouk, Nom banh chok, Sadza, Mofofo) - for these, a NON-ENGLISH Wikipedia title is required (the subagent confirmed fr/pt/es/uz/ha/sw titles for several) and the citation language must be recorded with the source. Each of the 50 also needs >= 1 NON-WIKIPEDIA source for its origin claim (GUS-241 acceptance), which the Wikipedia article does NOT satisfy - so the Wikipedia title here is the DISCOVERY lead (GUS-026 S6 = discovery and terminology only), not the evidence."
      - "THE SHORTLIST'S VALUE IS THE CLASSIFICATION DIFFICULTY COLUMN, and it is where the vocabulary decisions come from. Tag counts across the 50: NO-FAMILY 11, NO-TECHNIQUE 7, COURSE-VARIABLE 4, VESSEL 4, DIASPORA 3, DISH+DRINK 2, MULTI-COMPONENT the rest. THE VOCABULARY EXTENSIONS THE 50 WOULD FORCE, grouped by cause: (a) A STARCHY-STAPLE FAMILY - fufu, ogi, to, ugali, dhindo, ambuyat, pulaka, canjica are eight starchy staples with NO family (the taxonomy has no 'starchy staple' slot; each is a starch eaten with a soup, so the soup is arguably the dish). This is the single strongest case for one new family, and it satisfies the >=2-members rule eight times over. (b) A LEAF-STEW FAMILY - romazava, matapa, muamba are three leaf-stews (cassava leaves); again >=2 members. (c) OFFAL - kiviak, khash, paya, nihari, tripas a moda do Porto, anticucho are six offal dishes with no family. (d) SEAFOOD - polvo a lagareiro, bobó de camarão, antibuo and the Peruvian pair are seafood dishes and the taxonomy has NO seafood family at all. (e) AN EARTH-OVEN TECHNIQUE - umu, pachamanca, curanto (and palov's kazan pot) are dishes whose METHOD is the vessel; the technique vocabulary has no earth-oven value. (f) A STUFFED-VEGETABLE family - levengi, rocoto relleno. (g) A RAW/PRESERVED family - kitfo, kokoda, hakarl, svið, chhurpi are raw or preserved foods with no family. EACH IS A DECISION, and each family listed here has >=2 members - so they satisfy the family rule and are admissible; what is NOT decided is whether to admit them."
      - "TWO DISHES IN THE SHORTLIST ARE FLAGGED AS PROBLEMS RATHER THAN CANDIDATES: 'murtabak' and 'mutabbaq' are the SAME preparation across diaspora (Acehnese savory, Malaysian sweet) and the project's own history records that martabak was ALREADY SPLIT into martabak-manis and martabak-telur under GUS-230 - so seeding a third spelling would duplicate an existing decision. 'acaraje' is ALREADY a published dish in the catalogue with a cuisine gap - so it is a FIX (part of the 18 cuisine gaps), not a new dish. 'bacalhau a bras' is likewise already published. These three are excluded from the 50 and listed separately."
      - "NOT DONE: no dish seeded, no vocabulary value added, no schema change. The shortlist is for Alejandro's review; the 50 are seeded in tranches of 10 under pilot discipline AFTER the claims model lands (Q11 order (c)), each with its place, description, dimensions and >= 1 non-Wikipedia origin source."


  - id: GUS-242
    title: "Seed the global reference data: all places, all national cuisines, the tradition list, and the designed vocabularies"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P1
    phase: 2
    status: todo
    depends_on: [GUS-231, GUS-232]
    approval: true
    acceptance:
      - "All 249 ISO 3166-1 countries are seeded as geo_entities rows with entity_type='country', their wikidata_id, their iso_code and a parent_id of NULL"
      - "First-level administrative regions are seeded per the agreed depth, each with entity_type='region' and a parent_id pointing at its country"
      - "Places are sourced from Wikidata, NOT from the ISO data files - iso.org and the ISO OBP return HTTP 403 to this host and ISO 3166 is a licensed standard; Wikidata is CC0 and already carries P297/P300/P17/P131/P150"
      - "geo_entities gains UNIQUE (wikidata_id) and UNIQUE (iso_code) BEFORE the bulk seed - without them a 3,590-row seed will accumulate duplicates exactly the way sources accumulated 21 duplicate URLs (GUS-238)"
      - "One national dish_cuisine value exists per country, named as a bare demonym to match the 21 existing values"
      - "The full tradition list exists as dish_traditions values, sized as Alejandro decides"
      - "The dish_family, dish_technique and dish_ingredient_category vocabularies are designed once and cross-checked against FoodOn and Wikidata P279"
      - "Every vocabulary extension is recorded with the source it was cross-checked against"
    evidence:
      - "RAISED 2026-10-27 (Alejandro): DIRECTION CHANGE - GLOBAL FROM DAY ONE. 'Structure/reference data is seeded for the whole world now; only the evidenced label is gated by sources, not dish entry.' AND: 'my earlier >=1 non-Wikipedia source per new dish is WITHDRAWN'. A dish enters the catalogue CLASSIFIED BUT UNEVIDENCED; a non-Wikipedia source is required only for a STATEMENT to count as evidenced. The full plan with every measured number, the source per dataset, the estimated sizes, the order of work and the six open decisions is in .hermes/REPORTS/GUS-242-global-reference-plan.md."
      - "THREE IDENTIFIER CORRECTIONS (measured live, 2026-10-27) - ANY QUERY RUN WITH THE WRONG IDS RETURNS 0 AND LOOKS LIKE 'NO DATA': dish is NOT Q1259274 (that is Sechelt, a town in British Columbia) but Q746549; country of origin is NOT P17 (that is 'country') but P495; cuisine is NOT P4952 (that is 'safety classification and labelling', a chemical-hazard property) but P2012. The research subagent hit the same trap independently, which is good corroboration."
      - "PLACES, MEASURED: ISO 3166-1 = 249 officially assigned countries (iso-codes 4.20.1). ISO 3166-2 = 5,046 subdivision records, of which 3,590 are FIRST-LEVEL and 1,456 second-level (level inferred from the presence of a 'parent' key - the file has no explicit level field; verified that all 214 distinct parent values resolve to existing codes), spanning 200 countries; 49 countries have no first-level subdivisions. Largest first-level sets: Slovenia 212, Russia 83, Turkiye 81, North Macedonia 80, Thailand 78, Vietnam 63, US 57, India 36, China 34, Mexico 32, Brazil 27, Japan 47, Philippines 17, Indonesia 7. Wikidata: 261 items carry P297, 5,458 carry P300, 33 carry both, 93,088 items have P131 pointing at a country."
      - "LICENSING, STATED PLAINLY: ISO 3166 IS NOT FREELY REDISTRIBUTABLE - ISO sells it as a priced standard, the OBP is a paid viewing service, and iso.org returned HTTP 403 to this host. The iso-codes Debian package redistributes ISO-derived data under LGPL-2.1-or-later but that covers the PACKAGE, not the underlying standard, and it is not an official ISO channel. RECOMMENDATION: seed from Wikidata (CC0) and never vendor the ISO files. The ISO counts are for SIZING the work, not for populating it."
      - "FOLDING IN GUS-232 AND GUS-237: GUS-232 (populate wikidata_id) becomes part of the same Wikidata pass, so it stops being a separate 36-row task - every seeded place gets its Q-id in the same run. GUS-237 (place_spans, the n:m for Punjab spanning India and Pakistan) becomes derivable rather than a new table: with P17 (country) and P131 (located in) both available, a transnational place is one place with two countries, and place_spans is a VIEW. RECOMMENDATION: reduce GUS-237 to a view or drop it."
      - "CUISINES, MEASURED: English Wikipedia ALREADY HAS EXACTLY THE DESIRED TAXONOMY. 'Category:Cuisine by country' has 212 direct subcategories, of which 191 are NATIONAL-CUISINE branches and 21 are by-axis branches (Breads by country, Condiments, Dairy products, Desserts, Drinks, Egg dishes, Food preparation utensils, Herbs and spices, Legume dishes, Meat dishes, Noodles, Pasta dishes, Restaurants, Rice dishes, Sandwiches, Sausages, Seafood dishes, Soups and stews, Soups, Vegetable dishes, Vegetarian cuisine). The national branches include ones no food publication would list: Beninese, Burkinabe, Chadian, Cape Verdean, Bhutanese, Malawian, Sao Tomean, Saint Lucian, Belizean, Angolan, Libyan, Maltese, Bahraini - that is the 'not expected' coverage, already written. Dish articles under the 191 national branches: ~9,236 (extrapolated from a paced 25-branch sample whose own total was 1,209). Wikidata's P2012 is too sparse to seed from - only 1,213 of 3,318 dishes have it - so the Wikipedia category names are the seed list and Wikidata is the cross-check. The 0-MEMBERS RULE IS DROPPED for cuisines (it stays for families): a country with no dish in the catalogue yet still has a cuisine, so Tunisian, Nepalese and Puerto Rican are created."
      - "TRADITIONS, MEASURED: Wikidata has 1,265 cuisine items (instances/subclasses of Q1778821) and 6,336 items carry P2012. A SINGLE COUNT OF 'REGIONAL TRADITIONS' IS NOT WELL-DEFINED because the examples span three granularities - supranational (Levantine, Maghrebi), regional-national (Cantonese, Andalusian), subnational-regional (Kerala, Hunan, Sichuan), and diaspora (Creole, Ottoman, Punjabi, Mughlai). RECOMMENDATION: a TWO-TIER model, not a flat list - Tier 1 national cuisine (~200), Tier 2 regional/ethnic/religious tradition (target 400-600, expandable to the 1,265 Wikidata ceiling). UNESCO intangible-heritage food inscriptions were NOT counted - a separate pass over ich.unesco.org."
      - "FOODON, MEASURED: release 2026-09-20, 45,594 owl:Class declarations, 29,175 with an English label, food material branch 20,148 descendants, food product branch 12,342 descendants, licence CC BY-SA 2.5 (from the ontology's own dcterms:rightsHolder). Download: purl.obolibrary.org/obo/foodon.owl (40,779,019 bytes) - the LOWERCASE url; the capitalised FOODON is 404. WHAT IT IS GOOD FOR: dish_technique (STRONG - 'food process' is a first-class branch covering curing, fermenting, roasting, frying) and dish_ingredient_category (STRONG - 'food material' is the largest branch and carries the EFSA FOodex2 food-group hierarchy, so the 53 existing ingredient_categories can be cross-checked against it directly). WHAT IT IS NOT: dish_family (WEAK - its 'food product hierarchy' is GENERIC food product categories like 'a can of kidney beans', explicitly not named preparations) and cuisine/tradition (ABSENT - FoodOn does not model cuisine). SO THE HONEST ANSWER TO 'is there an existing dish-family vocabulary?' IS NO - IT MUST BE DESIGNED. Estimated target sizes: family 25 -> ~120-180, technique 25 -> ~60-90, ingredient_category 53 -> ~250-400."
      - "DISCOVERY POOL, MEASURED: 3,318 Wikidata items with P31=dish, 8,110 including subclasses, 13,274 total subclasses of dish. Dishes with P495 (country of origin) 2,168 (65%); with P17 or P495 3,192 (96%); with P2012 (cuisine) only 1,213 (37%); with an English Wikipedia article 1,127; with P495 + P279 + English Wikipedia article 901. Wikidata P279 subclasses in use: 524 distinct (the raw material for the family vocabulary). Top dish countries by P495: Indonesia 523, Spain 82, Nigeria 76, Italy 40, Japan 23, Algeria 17, Mexico 13, France 12, United States 11, Taiwan 11, Germany 10, Brazil 10, Senegal 10, Belgium 9, China 8. SPARQL PERFORMANCE: aggregate counts 0.2-2.2s, a P31/P279* closure 1.1s; a bare unindexed COUNT timed out at 60s, so always constrain on wdt:P31 or wdt:P279 first. POLITE-POOL ETIQUETTE: descriptive UA with contact info, one query at a time per client, stay under ~60s runtime, avoid peak hours. Observed fast times mean the endpoint was NOT under load - best case, not a capacity guarantee."
      - "A RISK FLAGGED, NOT A QUESTION: the discovery pool and the classification effort are NOT the same size. ~9,236 Wikipedia dish articles exist but only ~1,000 are reachable through Wikidata's typed pipeline - roughly 8,000 Wikipedia dish articles have NO Wikidata type. Classifying those means the agent proposes dimensions from the article's own text, which is exactly the 'description-derived' provenance case - defensible, but it IS inference, and status='provisional' on the dimension row is where that honesty lives. IF WE WANT PROVENANCE TO MEAN SOMETHING, 'description-derived' SHOULD BE THE MAJORITY PROVENANCE, NOT A MINORITY."

      - "REVIEW TIERS (Alejandro, item 6): the AUTOMATED tier is already measured and working - the GUS-231 check (every published dish x 7 dimensions has exactly one state) is a SINGLE query and currently passes with missing_both=0, has_both=0; the GUS-241 pre-flight assertion block is a second automated tier and it caught a real bug that no amount of eyeballing would have, because the expected counts were written down inline. NOT YET RESEARCHED, and deliberately not guessed: Wikidata reference-quality distributions and the Scholia / Wikidata quality-report dashboards; Wikipedia 'citation needed' dynamics at scale; A REALISTIC HUMAN-REVIEW THROUGHPUT (dishes/hour) - I have no measured basis for a number and will not invent one; the standard sampling-based QA pattern for large dataset curation (ANSI/ASQ Z1.4 acceptance sampling is the usual reference, but it has not been read against this case). THE HUMAN TIER SHOULD BE RESERVED FOR THE CASES WHERE JUDGEMENT IS GENUINELY REQUIRED: disputed dimensions, plus a random sample for drift detection. A SPECIFIC RISK THE SAMPLE TIER SHOULD WATCH: a dish whose dimension is ASSIGNED but WRONG passes every automated check - that is the failure mode a sample exists to catch."
