      - "PILOT SPEC WRITTEN 2026-10-26: .hermes/REPORTS/GUS-014-pilot-spec.md - the exact expected end state for all 3 pilot dishes across ALL 7 DIMENSIONS (21 dimension cells), with explicit 'unset' where empty, plus 7 controlled vocabularies declared inline (dish_family 33, dish_cuisine 32, dish_course 9, dish_technique 25, ingredient_category 46, dish_tradition 36, dish_context 5 values), 17 integrity checks (I1-I17) and 5 pre-flight gates (V1-V5). Key spec points: rendang = family curry / cuisine indonesian / course main-course / technique braising / ingredient_category unset / tradition minangkabau / context home+festival/ceremonial+restaurant (8 values); chicken-tikka-masala = family curry / cuisine UNSET (Glasgow dispute must not be resolved) / course main-course / technique grilling+simmering / ingredient_category unset / tradition unset / context restaurant (5 values); tacos-al-pastor = family taco / cuisine mexican / course main-course / technique spit-roasting / ingredient_category unset / tradition unset / context street-food (5 values) + one derived-from relation to shawarma. Coverage/corroboration are null for all 3 (all have empty longDescription) - a reported 0% would be a FAIL. Validator scripts/hermes/validate-pilot-spec.py written and PASSING (exit 0, 21/21 cells checked). Still to do before the pilot runs: V3 snapshot (restorable), V4 tested rollback, V5 Alejandro's explicit go."
      - "AMENDMENT 2026-10-26 (Alejandro, 3rd round): (1) ingredient_category FILLED FROM THE D6 CLAIMS - rendang = beef, red-meat, coconut; chicken-tikka-masala = chicken, poultry, dairy; tacos-al-pastor = pork, red-meat. Controlled vocabulary EXTENDED verbatim with red-meat, beef, pork, chicken, coconut (47 -> 52 values); the generic meat/poultry/dairy values remain for dishes whose claims establish only the broad class. New spec section 3.4 records the D6 claim -> ingredient_category mapping and the rule that only ingredient/protein/medium claims contribute - origin/family/technique/duration/context claims contribute NOTHING, and a DISPUTED claim contributes nothing. (2) I15 REWORDED: the other 119 non-pilot dishes must be unchanged, where unchanged = byte-identical content digest OR changed with every change explained by an edit_history row written INSIDE the pilot window (window opens at the snapshot's edit_history high-water mark). Bot writes are NOT paused - checked 2026-10-26: hermes cron list shows no scheduled jobs, crontab is empty, no content-bot process is running, the only timers are gustale-rebuild-web (reads the live API, read-only for the DB) and gustale-backup (dumps the DB, read-only for the DB), and the last edit_history write was 2026-10-17 05:36 (9 days before the window). There is no bot write to pause, and the edit_history-window approach is STRONGER than pausing because it detects a write that starts before a pause and lands after it. An UNEXPLAINED change is still a hard FAIL. (3) V4 ROLLBACK TESTED ON A DB COPY, NEVER LIVE."
      - "PILOT SPEC UPDATED 2026-10-26 (round 3): all 21 dimension cells now specified with ingredient_category filled. Counts: rendang 7/7 dims assigned, 0 unset, 11 values; chicken-tikka-masala 5/7 assigned, 2 unset, 8 values; tacos-al-pastor 6/7 assigned, 1 unset, 7 values. Total 26 dimension values across 3 dishes. Claims required: rendang 6, CTM 4, tacos 1 = 11 claims."
      - "CRITICAL FINDING 2026-10-26 (ADR D4a) - coverage is MEASURABLE, not null. The earlier spec said coverage=null for all 3 because it followed the ADR's 'longDescription is empty' framing, but the live schema has TWO description columns: dishes.short_description (POPULATED for all 3 pilot dishes, 149-206 chars) and dishes.long_description (empty for all 3, and empty for 100 of 122 catalog-wide). short_description is the prose the claims anchor to. Rendang's short_description is VERBATIM the D6 worked example: 'A West Sumatran dry curry of beef slow-cooked for hours in coconut milk and a paste of ginger, galangal, turmeric, chili, lemongrass, garlic, and shallots until the sauce fully reduces and the meat darkens.' - D6 decomposes it into 6 claims. Therefore each pilot dish has >=1 factual sentence, coverage is measurable, and the honest expected value is 0% (no claim rows exist yet - claims are GUS-027/028) - NOT null. 0% = measurable-and-unsourced, null = not-measurable. This is consistent with GUS-011's catalog-wide finding that 121/121 dishes are Wikipedia-only, so 0% corroboration across the board is the true baseline rather than a defect to hide. The ADR's earlier statement that all three have empty longDescription remains TRUE and is not contradicted."
      - "ADR D3g 2026-10-26 - relation types use the EXISTING vocabulary. dish_relations.relation_type is free text (no CHECK constraint), which makes one-off types easy. The pilot uses 'ancestor' for shawarma -> al pastor, NOT a new 'derived-from'. Live precedent: bacalhau-a-bras -> vindaloo is 'ancestor' (strength 5). Note shawarma -> hamburger-american is 'diaspora' (strength 2) - a DIFFERENT relation, so the pilot must not copy that precedent by mistake. Direction convention verified live: ancestry rows read DESCENDANT -> ANCESTOR, so the pilot writes tacos-al-pastor -> shawarma, relation_type=ancestor, strength=4. New relation types require an explicit decision, never opportunistic."
      - "V3 SNAPSHOT DONE 2026-10-26: scripts/hermes/gus-014-pilot-snapshot.sh (snapshot|restore|verify). Created .hermes/snapshots/gus-014/20261026T040610Z/ containing db.dump (472K pg_dump -Fc, the restore source), schema.sql, pilot-baseline.tsv (3 pilot dishes, full column detail), catalog-baseline.tsv (all 122 dishes, md5 content digest over categories + both description columns + translations + citations + ingredients + relations), edit-history-max-created-at.txt (window anchor), SHA256SUMS and MANIFEST.txt."
      - "V4 ROLLBACK TESTED 2026-10-26: scripts/hermes/gus-014-rollback-test.sh - restore into a throwaway copy -> verify IDENTICAL -> MUTATE (add category, change descriptions, add relation) -> verify DIVERGES -> restore -> verify IDENTICAL -> confirm live untouched -> drop the copy. The mutation-observability step is what makes the test meaningful; without it the final identity check could pass simply because the mutation never landed. The test actually CAUGHT a real bug during development: the mutation heredoc was missing 'docker exec -i', so stdin never reached psql and the mutation silently no-oped - the test failed correctly, the fix was applied, and the mutation is now also asserted explicitly (3 descriptions + 1 relation row) rather than trusting the exit code."
      - "SAFETY GUARD 2026-10-26: restore refuses the live database, PostgreSQL system DBs (postgres/template0/template1), and any production-looking name; it only accepts targets containing _pilot/_test/_staging/_copy/_rollback. 11 passing guard tests in scripts/hermes/test-restore-guard.sh. verify is READ-ONLY (SELECTs only) and may target live for comparison. The live DB was verified identical to the snapshot baseline after all testing, and every throwaway test database was dropped."
      - "I15 CHECKER 2026-10-26: scripts/hermes/gus-014-check-other-dishes.py - compares the 119 non-pilot dishes' content digests against the snapshot baseline, and for any change requires an edit_history row inside the window. scripts/hermes/test-i15-checker.sh has 4 passing tests proving it (a) passes on an unmodified copy, (b) FAILS on a change with NO edit_history row, (c) passes on a change WITH one, (d) leaves live untouched. A checker that cannot fail proves nothing."
      - "STOPPED AT V5 2026-10-26: gates V1 (spec validator), V3 (snapshot), V4 (tested rollback) are DONE; V2 (exact end state written) done. V5 = Alejandro's explicit go for the pilot is PENDING. No migration has been written or run. The live database has not been modified."
      - "PILOT RUN ON LIVE 2026-10-26 (Alejandro's go). Migration db/migrations/gus-014-pilot-dimensions.sql applied to the live `gustale` DB after a pre-flight verify confirmed the live DB still matched the V3 snapshot baseline (catalog digest IDENTICAL, 122 dishes). Result: 51/51 pilot checks PASS, 0 FAIL. I15: 118 dishes unchanged, 1 changed-and-explained (shawarma), 0 unexplained. Live API smoke: api.gustale.com/health 200, gustale.com/dishes 200, /api/dishes/rendang 200. V4 rollback re-verified post-migration: still PASS."
      - "ALEXANDRO'S 4TH-ROUND AMENDMENTS APPLIED 2026-10-26: (1) ingredient_category stores LEAVES ONLY - beef, chicken, pork, coconut, dairy. Parents (red-meat, white-meat, produce) are seeded in ingredient_categories with parent_id so they can be DERIVED at query time, and are NEVER assigned to a dish. Rationale recorded in ADR D3h: storing both a leaf and its parent double-counts (a 'red meat' query returns the dish under two rows; 'how many categories does this dish have' is inflated). Pilot recount: rendang 10 values, CTM 7, tacos 6 = 23 total. (2) Every pilot write logs an edit_history row with comment exactly 'GUS-014 pilot' AND bumps dishes.updated_at - 4 rows (3 pilot dishes + shawarma), 4 updated_at bumps. (3) ancestor direction CORRECTED - from_dish_id IS THE ANCESTOR (shawarma -> tacos-al-pastor). An earlier draft asserting 'descendant -> ancestor' was WRONG and is corrected in ADR D3g; the live rows' own reason text settles it ('bacalhau-a-bras -> vindaloo' has reason '...is the direct ancestor of vindaloo'). The relation is also written as a BIDIRECTIONAL PAIR, matching the live catalog where all 190 rows are paired (95 pairs, zero unpaired) and paired rows carry the same reason string."
      - "SHAWARMA SIDE-EFFECT - CAUGHT BY THE I15 CHECKER ON THE DRY-RUN 2026-10-26: the pilot writes a relation whose from_dish_id is shawarma, and a relation is part of a dish's content digest, so shawarma's digest changes. shawarma is not one of the 3 pilot dishes, so the I15 checker correctly FAILED with 'unexplained change'. Resolution: shawarma gets its own 'GUS-014 pilot' edit_history row and updated_at bump - the pilot touches 4 dishes and all 4 are logged. Weakening I15 to accept an unexplained change would have defeated the check. The other 118 dishes remain completely untouched."
      - "FOLLOW-UPS RAISED TO BACKLOG 2026-10-26 (non-blocking, per Alejandro): GUS-224 audit all dish_relations before the 118-dish run (the bacalhau-a-bras <-> vindaloo and shawarma <-> hamburger pairs both carry a shared reason string that may describe the wrong direction; also relation_type is free text with no CHECK constraint and the bidirectional-pairing convention may itself be a bulk-insert artifact); GUS-225 fix the D6 example claim count (rendang's short_description also asserts the aromatic paste and the reduction outcome, so the stated 6 is likely an undercount); GUS-226 define coverage scope = short_description + long_description, canonical language only (translations not counted; decide whether per-language coverage is a separate informational metric)."
      - "ADR: .hermes/REPORTS/ADR-001-canonical-entity-model.md (2026-10-25, DRAFT -> CLOSED 2026-10-26)"
      - "Live-catalog findings that motivate the ADR: 152 categories, only 43 in use, 109 orphans (71.7%); the live set mixes dimensions (course `main-course` 97 dishes + cuisine `indonesian-cuisine` 16 + family `curry` 8 + technique `kebab` 8 in ONE table)"
      - "Reference-dish check (live API 2026-10-25): all three have empty longDescription, ZERO ingredients, ZERO recipe steps, exactly ONE Wikipedia source, no claim-level granularity. rendang has no variants despite strong regional variation; tacos-al-pastor has ZERO dish_relations despite a textbook shawarma lineage and carries main-course + street-snack simultaneously (a dimension the single `categories` join cannot type-check)."
      - "Key finding: the Glasgow dispute (ROADMAP's designated test case) is UNREPRESENTABLE today — a `disputed` origin claim with competing place objects needs a claim row, not a dish-level citation. That makes `claims` the keystone of EPIC 02, and argues for building it before `recipes`."
      - "Proposed sequencing: (1) claims + citations.claim_id, (2) recipes subtree, (3) dimensions + resolve the 109 orphans, (4) traditions/variants/events."
