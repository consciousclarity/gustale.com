  - id: GUS-224
    title: "Audit all dish_relations before the 118-dish dimension run"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P1
    phase: 1
    status: todo
    depends_on: [GUS-014]
    approval: false
    acceptance:
      - "Every one of the 190 existing dish_relations rows is reviewed for correct direction and relation_type"
      - "Rows whose direction contradicts the source=ancestor convention are corrected with Alejandro's OK"
      - "Rows whose reason text contradicts the stored direction are corrected"
    evidence:
      - "RAISED 2026-10-26 (Alejandro, pilot go-ahead). NOT BLOCKING for the GUS-014 pilot, but MUST be done BEFORE the 118-dish dimension run."
      - "AUDIT COMPLETED 2026-10-26 (READ-ONLY, no fixes applied - awaiting Alejandro review). Tool: scripts/hermes/gus-014-audit-relations.py. Report: .hermes/REPORTS/GUS-224-relations-audit.md. Scope: 192 rows = 96 pairs. D3g CONSISTENCY CHECK PASSED: every one of the 96 pairs has the SAME relation_type in both directions (0 type-inconsistent pairs), so the bidirectional pairing does NOT contradict D3g. Type mix: family 52, regional-cousin 15, shared-method 14, similar-serving 7, ancestor 3, shared-ingredient 3, diaspora 2."
      - "FACTUAL STATUS OF THE 5 DIRECTIONAL PAIRS (researched against Wikipedia 2026-10-26): 2 SOURCED, 3 LIKELY WRONG. (a) shawarma <-> tacos-al-pastor = SOURCED - Wikipedia Al pastor: The method of preparing and cooking al pastor is based on the lamb shawarma brought by Lebanese immigrants to the region; The Levantine version, called shawarma, was brought to Mexico in the late 19th and early 20th centuries by a wave of Lebanese immigrants. (b) tonkatsu <-> wiener-schnitzel = SOURCED - Wikipedia Tonkatsu: Tonkatsu originated in Japan during the Meiji era, derived from a French dish known as cote de veau; the pork version was created in 1899 at Rengatei in Tokyo; katsuretsu is a loanword from French cotelette. (c) shawarma <-> hamburger-american = LIKELY WRONG (wiring) - the CLAIM is correct (Wikipedia Doner kebab: The modern sandwich variant of doner kebab originated and was popularized in 1970s West Berlin by Turkish immigrants) but the relation connects shawarma; doner-kebab EXISTS as a dish and has ZERO relations. (d) bacalhau-a-bras <-> vindaloo = LIKELY WRONG (source dish) - the vindaloo <- carne de vinha d alhos derivation IS well sourced (Wikipedia Vindaloo, a Good Article citing Collingham Curry: The Food That Took Over the World and BBC Food; Wikipedia Carne de vinha d alhos citing Conde Nast Traveller, The Hindu, Visit Madeira) BUT carne de vinha d alhos is PORK in garlic wine vinegar and bacalhau a bras is SALT COD - unrelated dishes. The reason names the correct ancestor; the relation points at the wrong one. (e) biryani-hyderabadi <-> jollof-rice = LIKELY WRONG (unsourced) - Wikipedia Jollof rice attributes the origin to the Wolof/Jolof Empire and thieboudienne in Senegal (McCann, Osseo-Asare, Dufumier); no biryani -> jollof derivation appears in the article."
      - "THE OTHER 91 PAIRS ARE UNSOURCED, NOT WRONG. family/regional-cousin/shared-method/similar-serving/shared-ingredient have descriptive (non-directional) reasons, so direction carries no meaning for them. But 0 of 192 rows have any source and dish_relations has NO source column and there are 0 relation-level citations - so every relation claim is unsourced BY CONSTRUCTION, and the current schema offers no way to change that. This is a blind spot in the GUS-011 finding 121/121 dishes are Wikipedia-only: the relation graph has zero evidence."
      - "RECOMMENDATION (Option B - single directed row + derived inverse, plus 2 structural fixes): (1) store ONE directed row per relation (96 instead of 192) and derive the inverse in a view - a wrong direction is currently doubled across two rows with nothing distinguishing the authoritative one, and 96 of the rows are derived data posing as facts (which would double any future evidence metric). (2) Add a CHECK constraint on relation_type - it is free text today, which is how a one-off type like derived-from would have slipped in; the live vocabulary is 7 values. (3) Add a source/claim link to dish_relations - under ADR-001, relations must point at claims like everything else, and a single directed row maps 1:1 onto a claim while a bidirectional pair cannot carry two verdicts. Migration shape (for approval, not execution): decide canonical direction for all 96 (for symmetric types pick a deterministic one, e.g. lower id, and treat the inverse as purely derived), delete the 96 reverse rows, add a dish_relations_symmetric view, add the CHECK and the source/claim link, re-point consumers at the view."
      - "BLOCKING FOR THE 118-DISH RUN (recommended): fix the 3 likely-wrong pairs first - shawarma<->hamburger-american (should be doner-kebab<->hamburger-american), bacalhau-a-bras<->vindaloo (should reference carne de vinha d alhos, which is not in the catalog), biryani-hyderabadi<->jollof-rice (unsupported). Fix them under the evidence model as claims with sources, NOT as hand-edited rows - the current schema cannot record why a relation is true."
  - id: GUS-225
    title: "Fix the D6 example claim count in ADR-001"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P2
    phase: 1
    status: todo
    depends_on: [GUS-014]
    approval: false
    acceptance:
      - "The D6 worked example's claim list and count are consistent with the actual sentence and with the one-assertable-fact rule"
      - "The corrected count is recorded in ADR-001 and in the GUS-014 pilot spec"
    evidence:
      - "RAISED 2026-10-26 (Alejandro, pilot go-ahead). Non-blocking. ADR-001 D6 gives rendang as 6 claims (origin, family, protein, technique, medium, duration) and the pilot spec's section 3.4 repeats that 6-claim decomposition of rendang's short_description. But the live short_description also asserts the AROMATIC PASTE ('a paste of ginger, galangal, turmeric, chili, lemongrass, garlic, and shallots') and the REDUCTION outcome ('until the sauce fully reduces and the meat darkens'), which are further separable assertable facts under the D6 rule (one subject-predicate-value statement independently supportable by one source). The stated count of 6 is therefore likely an undercount - the sentence supports more than 6 independently-sourced claims. Resolve by either expanding the list with the paste and reduction claims or by recording the rule that the example is illustrative rather than exhaustive, and make the pilot spec's claim total agree with whatever is decided."
  - id: GUS-226
    title: "Define the coverage scope: short_description + long_description, canonical language only"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
