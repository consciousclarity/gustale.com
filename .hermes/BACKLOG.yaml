  - id: GUS-014
    title: "Establish canonical culinary entity types. Distinguish dishes, recipe variants, ingredients, cooking techniques, places, communities, culinary traditions, historical events, and sources"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P0
    phase: 1
    first15_order: 5
    status: in_progress
    depends_on: [GUS-001]
    approval: true
    notes: "ADR CLOSED 2026-10-26 after Alejandro decided all 7 questions (D1-D7) (.hermes/REPORTS/ADR-001-canonical-entity-model.md). DOCS ONLY — no migration written, no schema changed. Awaiting final decision-list review, then pilot on the 3 reference dishes. The ADR proposes: split `categories` into typed dimensions (dish_families / dish_cuisines / dish_courses / ingredient_categories / dish_traditions / dish_contexts), add a `recipes` subtree, and add `claims` as the evidence atom with `citations.claim_id`. Checked against the three reference dishes."
    acceptance:
      - "ADR drafted and reviewed by Alejandro (docs only, no migration yet)"
      - "The ADR maps the current tables to the proposed entity types"
      - "The ADR is checked against the three reference dishes (rendang, chicken-tikka-masala, tacos-al-pastor)"
      - "Open questions are listed for Alejandro's decision"
    evidence:
      - "ADR-002 Q3 FURTHER FIX 2026-10-26 (Alejandro): the Punjab partition/reorganisation history is DROPPED from the ADR entirely. It had been wrong twice (the earlier '1966 partition' phrasing, then a corrected chronology that was also off - PEPSU is not East Punjab, PEPSU merged in 1956 and was gone by 1966, and 1966 was the Punjab/Haryana split with the hill districts going to Himachal and Chandigarh becoming a UT). All the decision needs is ONE distinction: A HISTORICAL REGION IS NOT A MODERN STATE - which is why Punjab is seeded as a region with parent_id NULL rather than as the Indian state. The region's history belongs in the encyclopedia article for Punjab itself, sourced and written like any other content, NOT in a schema ADR where it would be unsourced prose."

      - "ADR-002 Q6 AMENDMENT 1 2026-10-26 (Alejandro): classification is by URL DOMAIN, each domain classified INDIVIDUALLY, never a blanket rule. Measured live: ALL 142 sources are en.wikipedia.org - there are NO other domains at all, so the rule resolves to every row being S6, and the catalog has no source diversity to classify. The rule is recorded so the FIRST non-Wikipedia source is classified individually rather than swept into an assumption. CAVEAT recorded: *.wikipedia.org covers the whole Wikimedia family, so a /wiki/File:... or a wikidata.org/wiki/Q... URL matches the domain but is NOT a Wikipedia article and must be classified by PATH. No such rows exist today."

      - "ADR-002 Q6 AMENDMENT 2 2026-10-26 (Alejandro): DEDUPE BEFORE THE PILOT (GUS-238). Measured: 142 rows, 121 distinct URLs, 12 normalised URLs carrying more than one row = 21 redundant rows. No unique constraint on url. THE REFERENCED-vs-ORPHANED REPORT ASKED FOR: 21 source rows carry ZERO citations - 20 in duplicate groups and 1 with a unique URL ('Tajine', id 4c9f4047, https://en.wikipedia.org/wiki/Tajine) which is a DIFFERENT defect (a registered source never used) and should be flagged, not merged. Only ONE group has more than one CITED row: Moussaka, where all three rows are cited ('Moussaka' id 00000000, 'Levantine Moussaka' id 5efafd8e, 'Musakka' id 6b806037, one citation each) - three different DISHES sharing one article, so not duplicates of each other in meaning, but the same URL cannot be three sources. 'pho' has two rows with NEITHER cited. PROCEDURE: normalise the URL (lowercase host, strip m./en.m., decode percent-encoding, collapse slashes, strip trailing slash, drop the fragment, normalise /wiki/<Title> case) into sources.normalised_url; build an id map keeping the cited row or the oldest; re-point every citations.source_id at the survivor; ARCHIVE the merged rows with the surviving id recorded; add a unique constraint on normalised_url. WHY BEFORE THE PILOT: the pilot's output is a CORROBORATION number and GUS-026 section 5 says 'quantity is not independence' - with 21 duplicate rows a claim cited by two rows pointing at the same article would count as TWO sources. NEEDS APPROVAL (RULES.md: bulk overwrite); archiving rather than deleting keeps it out of that category but it is still a bulk change and is queued for Alejandro's go, not done."

      - "ADR-002 Q11 DECIDED 2026-10-27 (Alejandro): OPTION (iii) - neither (i) nor (ii). THE 118 PUBLISHED DISHES OUTSIDE THE PILOT GET NO STATEMENTS UNTIL RESEARCH SUPPLIES A REAL SOURCE; their dimension rows stay statement_id IS NULL = UNEVIDENCED (Q3's honest state). NO COUNTRY-LEVEL STATEMENTS ARE DERIVED FROM origin_location OR FROM EXISTING DIMENSION ROWS - A GEOCODE IS NOT A CITATION. PLACES ARE SEEDED ON DEMAND, PER RESEARCHED DISH, not speculatively for all 36 countries. WHY (i) FAILS: it manufactures claims from a geocode - origin_location is a geometry column holding WKB hex, the country came from a MAP not a SOURCE, and the resulting rows would be INDISTINGUISHABLE IN THE DATABASE FROM RESEARCHED ONES while having NO claim_citations AT ALL - which in the model is precisely 'unsupported'. That is the 'two truths' failure ADR-002 exists to remove, arrived at through the back door. WHY (ii) FAILS: it needs a place hierarchy for 36 countries plus a non-Wikipedia source per dish, and would land BEFORE the model that records any of it exists - the research would have nowhere to go. (iii) IS THE ONLY ONE THAT KEEPS THE EVIDENCE MODEL MEANINGFUL. The 118's archived citations rows remain THE RECORD THAT RESEARCH IS OUTSTANDING - the archive is a work queue, not a graveyard - and when a dish is researched its old citation is either re-read (Q7's re-reading, fresh revision id) or superseded. FIVE RULES THAT MAKE (iii) SAFE: (1) NO STATEMENT IS CREATED WITHOUT A SOURCE - the trigger is research, not a dimension row that needs one; (2) NO DERIVATION FROM origin_location - the geometry may SUGGEST a place to research but may never be the EVIDENCE for one, and the place entity comes from the source's text; (3) NO DERIVATION FROM AN EXISTING DIMENSION ROW - turning 'dish_family = curry' into a statement would LAUNDER A TYPED VALUE INTO AN EVIDENCED CLAIM, the exact failure Q3 named when it made the row the INDEX and the statement the EVIDENCE; (4) PLACES SEEDED ON DEMAND - this is what stops the model acquiring a 36-country place hierarchy of unverifiable rows, which is exactly the food_regions=0 / geo_entities=36-countries-only state the catalog is in, and which the geography audit showed to be THIN rather than wrong; (5) THE citations TABLE KEEPS THE 118 ARCHIVED. CONSEQUENCE STATED PLAINLY: THE CATALOG'S HEADLINE COVERAGE BECOMES DEFINED AND NEAR-ZERO (today it is undefined) - a defined 0% reads as 'not yet researched' rather than 'not measured'; the 118 DO NOT GET WORSE, THEY GET CORRECTLY LABELLED. THE RESEARCH BAR IS PER-CLAIM, NOT PER-DISH: a non-origin claim needs a class-sufficient source (S1-S5; S6 may accompany but not stand alone); an ORIGIN claim with claim_class documented/disputed needs >= 1 S1/S2/S3/S5 source (GUS-026 section 3.1); a transnational dish's origin needs sources FOR EACH COMPETING POSITION, not one source that mentions the dispute. So the research bar is not 'find a Wikipedia article' - it already has one (every one of the 121 has exactly one Wikipedia citation, GUS-011); THE BAR IS FINDING THE SECOND, NON-WIKIPEDIA SOURCE THE POLICY REQUIRES, which is exactly the work Q8's Amendment 4 specifies for the pilot's rendang origin claim (2 real non-Wikipedia sources, S1-S5, explicitly assessed independent). AND A DISH THAT CANNOT BE RESEARCHED TO THAT BAR STAYS UNEVIDENCED PERMANENTLY - no rule says every dish must eventually be corroborated, and GUS-026 section 6's 'unsupported' class exists precisely so a dish can be in the catalog with an honest, unevidenced dimension. ORDER OF WORK: (a) FIX THE CUISINE GAPS NOW - DIMENSIONS ONLY (15 new national cuisine values + 2 assignments + the unset_reason mechanism), no statements, no citations, no claims, so it does not wait for the claims model; (b) FINISH ADR-002 AND RUN THE PILOT; (c) THE 50 NEW DISHES ARE SEEDED DIRECTLY INTO THE CLAIMS MODEL, NEVER THE OLD ONE - each arriving with place, description, dimensions AND source in one operation, each needing >= 1 NON-WIKIPEDIA SOURCE FOR ITS ORIGIN CLAIM, in tranches of 10 under pilot discipline with Alejandro's review between tranches. Why (c) is not seeded the old way: the old model CANNOT express the content honestly (citations.claim_text is a whole description, 120 of 121), so a new dish seeded the old way arrives with the over-broad proposition the ADR exists to dissolve - THE 50 DISHES ARE THE FIRST CONTENT THAT STARTS LIFE IN THE NEW MODEL. Deferred: the order of the 118; whether an unresearchable dish is hidden or badged (a Q13 display question); the exact unset_reason mechanism (a schema choice - the reason must be queryable per (dish, dimension) and must not be able to conflict with an assigned value); and whether dish_tradition's multi-value suffices for the transnational case (Q5's generalised rule is written for single-valued dimensions)."

      - "ADR-002 CORRECTIONS 2026-10-27 (Alejandro, on the taxonomy-capacity audit): (1) THE GUS-231 CHECK IS NOT 'ALL 7 ROWS'. It is 'every dimension is either ASSIGNED a controlled-vocabulary value, or EXPLICITLY UNSET WITH A REASON (disputed / no_evidence / not_applicable)' - the pilot spec's own D3e rule. 'Every published dish has all 7 dimension rows' WOULD CONTRADICT ADR-001: chicken-tikka-masala's cuisine is DELIBERATELY UNSET (the Glasgow dispute, ADR-001 D1) and that is CORRECT, not a defect - a check demanding all 7 rows would flag the catalog's most deliberate editorial decision as an error. An unset dimension is a RECORDED DECISION, not a gap. For 'explicit unset with a reason' to be falsifiable the reason needs somewhere to live (a nullable unset_reason column on the dimension join tables or equivalent) and must not be able to conflict with an assigned value - that is a SCHEMA CHANGE and is part of the work, not an afterthought. (2) RECOUNT: 19 published dishes have no dish_cuisines row, across 18 countries - EIGHTEEN ARE GAPS and ONE (chicken-tikka-masala) IS UNSET BY DECISION. The earlier ADR text said '19 gaps' and then listed 18 names with a '+1 Indian and 1 Thai dish' row covering 2 dishes; the count of 19 was correct but the PRESENTATION was misleading. The gap count is 18. (3) THE COURSE VOCABULARY DOES NOT BREAK. An earlier ADR passage said the 8 course values were 'the dimension most likely to break first' - that was wrong and is now corrected: a dish eaten at breakfast AND bought as street food is COURSE + CONTEXT (ADR-001 D2 made dish_context a separate multi-valued dimension for exactly this), and a dish whose course depends on the meal is recorded by its PRIMARY ROLE (ADR-001 D3f: 'dish_course = the dish's PRIMARY meal role; secondary/situational uses go to dish_context'). So the course vocabulary absorbs unfamiliar dishes unchanged; the dimension that DOES need extension is CUISINE. RULE ADDED: A DISH NAME NEVER BECOMES A FAMILY UNLESS AT LEAST 2 DISHES WOULD CARRY THAT FAMILY VALUE - if only one dish would carry a value, that value is not a family, it is a description. This is what stops moussaka-greek from becoming the family 'Moussaka' and it makes the family vocabulary safe to extend."

      - "ADR-002 CUISINE CONVENTION DECIDED 2026-10-27 (Alejandro): dish_cuisine holds NATIONAL CUISINES ONLY. Regional and transnational traditions (Levantine, Maghrebi, Central European, and Minangkabau already) go in dish_tradition - matching the existing rendang = indonesian + minangkabau pattern. A transnational dish gets dish_cuisine UNSET with reason 'disputed' plus a dish_tradition. New national cuisine values are added INDIVIDUALLY BY DECISION, never by a blanket per-country rule (Q6's rule applies: each value classified on its own merits); PUERTO RICO GETS ITS OWN VALUE. WHY THIS IS THE RIGHT SPLIT: a cuisine answers 'which national food culture is this dish part of?' - a single answer, and dish_cuisines is single-valued (UNIQUE (dish_id)); a tradition answers 'which regional, ethnic or religious community's version is this?' - inherently multi-answerable (rendang is Minangkabau AND Sundanese AND Indonesian-national AND Eid-associated), and dish_traditions is already multi-valued with 36 values including exactly these. THE TWO DIMENSIONS HAVE DIFFERENT CARDINALITIES AND THE SCHEMA ALREADY ENCODES THAT. Putting Levantine in dish_cuisines would force it to be single-valued when it is not. THIS CLOSES THE ADR-001 SECTION 4 FOLLOW-UP on national-vs-regional cuisines, which was recorded there as an open follow-up with four questions and a note that 'the pilot uses the flat vocabulary, Minangkabau specificity is carried by origin(place) and claims, NOT by inventing a cuisine row' - the flat vocabulary was the pilot's expedient; this decision replaces it with a rule. CONSEQUENCE FOR THE 18 GAPS: they need 15 new national cuisine values (Austrian, Brazilian, Canadian, Greek, Hungarian, Jordanian, Moroccan, Nepalese, Nigerian, Polish, Portuguese, Puerto Rican, Tunisian, Ukrainian, American) plus 2 assignments from existing values (vindaloo -> Indian, khao-soi -> Thai). EACH IS A DECISION, per Q1's 'the vocabulary grows deliberately'. And it does NOT require a new dimension, a new predicate, or a schema change to the taxonomy - the values go in the existing dish_cuisines table and the traditions already exist. That is why it can be done NOW, before the claims model lands. The chicken-tikka-masala case is the archetype: cuisine unset(disputed), traditions Glasgow Muslim + British National - BOTH ALREADY EXIST in dish_traditions."

      - "ADR-002 CATALOG BREADTH MEASURED 2026-10-27 (Alejandro's question: 'aren't there more dishes from other locations'): the pilot is 3 of 121 PUBLISHED dishes, and the other 118 are NOT a homogeneous remainder - the catalog spans 36 COUNTRIES. Measured read-only on live gustale. PUBLISHED DISHES 121 (+1 archived fixture); DISTINCT ORIGIN COUNTRIES 36; dishes with a citation 121 of 121 (every published dish); distinct sources cited 121. ORIGIN DISTRIBUTION: Indonesia 16, India 11, Japan 10, China 9, Lebanon 8, Turkey 7, Philippines 5, Italy 5, Argentina 4, Peru 4, Mexico 4, Israel 3, Thailand 3, South Korea 3, then Spain/Brazil/Singapore/Ethiopia/Colombia/France/Vietnam 2 each, and 16 countries with 1 each (Puerto Rico, Ukraine, Morocco, Nigeria, United States, Portugal, Canada, Austria, Nepal, Poland, Jordan, UNITED KINGDOM, Hungary, Tunisia, Greece). DIMENSION COVERAGE across all 121: technique 117, cuisine 102, family 92, long_description 21, context 13, ingredient_category 3, tradition 1. geo_entities holds 36 COUNTRY ROWS AND NOTHING ELSE (no regions, no cities, no hierarchy, 0 wikidata_id); food_regions 0 rows; dish_locations 0 rows. TWO THINGS THE 3-DISH PILOT FRAMING HID. (a) THE PILOT IS AN OUTLIER IN THREE SPECIFIC WAYS: measured for the pilot dishes - rendang (Indonesia, 1 technique, 1 cuisine, 1 family, NO origin date), tacos-al-pastor (Mexico, 1/1/1, NO origin date), chicken-tikka-masala (United Kingdom, 2 techniques, 0 CUISINES, 1 family, origin 1960-1970). Two of three carry no origin_date, and only 8 of 121 catalog-wide have one - so the pilot exercises the originated_at predicate twice out of 121 dishes. CTM has zero cuisine rows - it is the Glasgow-dispute dish, deliberately left unset (ADR-001 D1), which is the right choice for testing the single-valued/competing-statement machinery, but it means the pilot's cuisine coverage is 1 of 2 pilot dishes, not 2 of 2. The pilot's three countries are 3 of the 36, and Indonesia is the single largest cluster at 16 dishes - the pilot touches 1 of those 16. (b) THE GEOGRAPHIC MODEL IS FAR THINNER THAN THE CATALOG: Q3's place plan seeds 11 places (Indonesia, Mexico, United Kingdom, India, West Sumatra, Scotland, Punjab, Glasgow, Delhi, Mexico City, Puebla), but the catalog's 121 dishes are attributed to 36 countries and geo_entities has country rows only. So originated_in - the predicate GUS-026 section 3.1's Wikipedia rule is written about, and the one that NEEDS a non-S6 source - has a COUNTRY-LEVEL target for all 121 dishes but a place hierarchy for only the 3 pilot dishes' countries. Every non-pilot dish's origin statement would have to point at a bare country row. WHAT THIS DOES NOT CHANGE: Q7, Q8 and Q9's population scope all say the 3 pilot dishes, and that is not in question - the pilot validates the MODEL, and 3 dishes with a real dispute, a real origin date and a real cross-subject anchor (Puebla) is the right test set. WHAT IT CHANGES IS WHAT Q11 MUST DECIDE: whether the other 118 ever get statements, and if so at what PLACE GRANULARITY - a country-only originated_in is a much weaker claim than a city-level one, and the pilot's place hierarchy was built for exactly that reason. DATA-SHAPE NOTE recorded because it would bite the implementation: dishes.origin_location is a GEOMETRY COLUMN HOLDING WKB HEX, not a text place name - 121 of 121 have it populated while only 8 have an origin_date. So 'the dish's location' in today's data is a POINT and 'the dish's place' in the model is a REFERENCED ENTITY; any migration deriving a place from origin_location is deriving it from a point, which is a GEOCODE not a CITATION, and the place entity must come from the source rather than the geometry."

      - "ADR-002 Q10 DECIDED 2026-10-27 (Alejandro): statements are INDEPENDENT ENTITIES WITH NO OWNER COLUMN. SCHEMA: statements (id, subject_type enum('dish','place') for the pilot, subject_id, predicate_id -> predicates, value_type, value_ref, value_literal, qualifiers jsonb, claim_class enum(6 from GUS-026 section 4), status enum(7 from GUS-026 section 6), created_at, updated_at, UNIQUE (subject_type, subject_id, predicate_id, value_type, value_ref, value_literal, qualifier_hash)). FOUR AMENDMENTS. (1) NO OWNER COLUMN - no owner_id, no dish_id, no owner FK; THE SUBJECT FK IS THE ONLY LINK. 'A dish's statements' = SELECT * FROM statements WHERE subject_type='dish' AND subject_id=$1. WHY: an owner column makes EVIDENCE DUPLICATION the schema's default - 'rendang uses coconut milk' and 'nasi lemak uses coconut milk' are ONE fact about one ingredient, and per-dish ownership would hide cross-dish corroboration (Q8) and duplicate the research per dish. COST STATED PLAINLY: a statement's subject is a SINGLE entity, so a statement cannot natively be 'about two dishes'; a genuinely multi-dish fact is TWO statements sharing evidence, or a statement about the ingredient - the model expresses shared facts by SHARING THE SUBJECT, not by widening the subject. TWO DIFFERENT SETS, NOT TO BE CONFLATED: 'statements about this dish' (subject query) vs 'statements this dish's text asserts' (join through description_sentences -> sentence_claims, which includes statements about OTHER subjects). (2) A SENTENCE MAY ANCHOR A STATEMENT ABOUT A DIFFERENT SUBJECT - a tacos-al-pastor sentence may anchor a statement whose subject is place -> Puebla, and that is CORRECT AND REQUIRED, because the sentence is where the claim is made and the claim is about whatever it is about. DISH COVERAGE IS COMPUTED OVER ITS OWN SENTENCES, REGARDLESS OF STATEMENT SUBJECT: coverage(dish) = anchored sentences of this dish / total sentences of this dish. NOT 'statements whose subject is this dish' - that would measure the wrong thing and would score tacos-al-pastor 0%, while D4b actually asks 'is every fact asserted in this prose anchored?', which is a question about the PROSE, not the subject distribution. COROLLARY: EVIDENCE IS PER-STATEMENT, ANCHORING IS PER-SENTENCE - the same statement about coconut milk can be anchored in rendang's sentence and nasi lemak's sentence with ONE evidence chain and TWO anchors; conflating those would either duplicate evidence chains or lose anchors. (3) DEDUPE - ONE FACT IS ONE STATEMENT, unique on (subject, predicate, value, canonical qualifier hash); otherwise a claim corroborated by two sources looks like two uncorroborated claims and the EVIDENCE SPLITS. The qualifier hash is in the key because SCOPE IS PART OF THE FACT'S IDENTITY: the Glasgow case is exactly this - 'CTM originated in Glasgow' scoped by one period and 'CTM originated in the subcontinent' scoped by the same period are competing statements about one proposition but NOT the same statement. Measured on live Postgres 16.4: jsonb equality is KEY-ORDER-INDEPENDENT and WHITESPACE-INSENSITIVE but ABSENT IS NOT EQUAL TO NULL - so absent qualifiers must be OMITTED, NOT stored as null, or the hash diverges and dedupe silently fails (the exact failure the key exists to prevent). The hash is of the CANONICALISED set (keys sorted, values canonical, absent omitted), not of arbitrary JSON bytes. The qualifiers stay readable in the jsonb column; the hash is a KEY not a storage format, and must be wide enough that a collision is not practical (a truncated hash would merge two different facts). WORKFLOW: find-or-create the statement, then attach the citation - inserting the same fact twice is the constraint saying 'this fact already exists; attach your evidence to the existing statement'. (4) NO CASCADE DELETES and RETRACTION IS A STATUS CHANGE - deleting a statement would delete its evidence chain (Q7's claim_citations with excerpts, revision ids and retrieval timestamps), which is the most expensive thing in the catalog to produce, and would make the research UNREPEATABLE. A retracted statement keeps its evidence, its anchors and its place in history. Concretely: description_sentences -> sentence_claims CASCADES (a link deletion, not an evidence deletion); statements -> claim_citations DOES NOT CASCADE; dishes -> description_sentences DOES NOT CASCADE; a dangling anchor is MARKED 'missing' (the Q9 validity enum) rather than silently left; dishes.status='archived' is the existing non-delete mechanism (GUS-231). THE CONSISTENCY CHECK: A DIMENSION ROW'S statement_id MUST REFERENCE A STATEMENT WHOSE SUBJECT IS THAT DISH - catches wrong-subject anchors (a family row for rendang pointing at a statement about West Sumatra) and cross-dish mis-assignment. Crucially THE PUEBLA CASE IS CORRECTLY NOT FLAGGED: the sentence-to-statement relation is deliberately allowed to cross subjects, but the dimension-row-to-statement relation is NOT, because a dimension row asserts something ABOUT THAT DISH. A dimension row with statement_id IS NULL is NOT A VIOLATION - it is the honest UNEVIDENCED state (91 dishes have a family assignment and no statement). DEFERRED, NAMED RATHER THAN GLOSSED: (a) the exact qualifier canonicalisation - a data-format decision where a wrong choice SILENTLY BREAKS DEDUPE, so it belongs with the first implementation reviewed against real qualifier sets rather than decided in the abstract; (b) whether the hash is stored or computed - a GENERATED column is safer because it cannot desync from the qualifiers; (c) whether subject_type='place' statements can ever be dimension-row targets."

      - "ADR-002 Q9 AMENDMENTS 2026-10-27 (Alejandro): TWO CORRECTIONS TO THE Q9 DECISION. (a) THE SELF-CORRECTION NOTE IS REWRITTEN: the ADR's Amendment 2 previously said 'the earlier draft said seven findings but listed five' - but flags 6 and 7 were ALEJANDRO'S AMENDMENTS, NOT FINDINGS FROM MY DRAFT. THE DRAFT LISTED FIVE. The ADR now says exactly that, and the two amendments are labelled Amendment 2a (the validity axis on sentence_claims.status: ok/missing/retracted/unpublished/contradicting) and Amendment 2b (the dishes columns are canonical by definition; dish_translations is non-canonical), with the origin of each stated so the history is not misread. The draft's five findings are now enumerated as draft findings 1-5 in Amendment 3. (b) THE sentence_managed TRIGGER GAINS TWO DUTIES. AMENDMENT 3a - EVERY sentence_managed CHANGE IS LOGGED IN edit_history: the flag is a WRITE-PATH CONTROL, not a cosmetic attribute, so a change to it must be auditable; the established pattern is the GUS-014 pilot's (target_type='dish', target_id, action='update', diff jsonb, comment), and the TRIGGER writes the row in the SAME TRANSACTION as the flag change so a caller cannot skip the log. AMENDMENT 3a ALSO - UNSETTING THE FLAG MUST RE-SYNC OR BE REJECTED, because otherwise the flag IS A BYPASS: it would disable the trigger AND leave the table and column desynced. Two acceptable behaviours and ONE must hold: re-sync on unset, or reject the unset when the table and column are inconsistent. THE STRONGER CHOICE IS RECORDED - VERIFY-THEN-CLEAR: re-sync on unset can silently overwrite an edited column with a stale reconstruction and LOSE PROSE, whereas verify-then-clear preserves both properties (the flag cannot smuggle in a desynced state, and it cannot destroy content). So the trigger has TWO duties on the flag transition: false->true logs and requires the sentences to exist and be consistent; true->false logs and requires consistency or it raises. CONSISTENCY MEANS THE CONCAT CHECK PASSES - the reconstructed string equals the live column - so the trigger calls the SAME check the migration and the verifier use: ONE definition of consistency, used by all three. AMENDMENT 3b - THE API CHANGE LANDS BEFORE THE TRIGGER, and this is an ORDERING CONSTRAINT, not a preference: if the trigger is applied first, every PATCH /api/dishes/:slug that sets shortDescription on a flagged dish FAILS, because apps/api/src/routes/dishes-write.ts still writes the column directly, so the trigger rejects a request that used to succeed - a user-visible regression on the pilot dishes caused purely by ordering. SEQUENCE: (1) ship the API change - the PATCH path writes THROUGH the sentence table for flagged dishes and keeps the direct write for unflagged ones; (2) then apply the migration - the sentence_managed column, the trigger and the edit_history logging. The migration is a schema change to a live table and needs approval under RULES.md; the API change is code and does not. The code lands first because it is also the CHEAPER ORDER to revert - a code change that breaks nothing can be reverted without a migration. CONSEQUENCE STATED: after the trigger is live, a PATCH that sets shortDescription on a flagged dish returns an ERROR rather than silently desyncing - intended behaviour, a loud failure instead of a quiet one, and it should be covered by an API test."

      - "ADR-002 Q9 DECIDED 2026-10-27 (Alejandro): the anchor is a STRUCTURED SENTENCE TABLE. SCHEMA: description_sentences (id, dish_id -> dishes ON DELETE CASCADE, field enum('short','long'), locale, position int, text, anchor_status enum('full','partial','none') default 'none', created_at, updated_at, UNIQUE NULLS NOT DISTINCT (dish_id, field, locale, position)) + sentence_claims (sentence_id -> description_sentences ON DELETE CASCADE, statement_id -> statements, status enum('ok','missing','retracted','unpublished','contradicting') default 'ok', note, PK (sentence_id, statement_id)). RULES: (1) short_description is rendered from the sentences and the CONCATENATION MUST EQUAL THE LIVE COLUMN EXACTLY; (2) a sentence text edit sets its anchors to needs_review (Q2's stale mechanism); (3) anchors are recorded on the CANONICAL text only; (4) the splitter is A RULE PLUS A FIXTURE SET with ONE implementation used for both population and check; (5) a sentence_managed flag plus a TRIGGER rejects direct short_description writes for flagged dishes. AMENDMENT 1 - THE CONCAT CHECK IS A GATE, NOT A BOUNDARY TEST: a zero-width split rejoins exactly BY CONSTRUCTION - it never removes a character, so it reconstructs the input whether the boundaries are right or wrong. It proves table-to-column agreement and NOTHING about boundaries. Boundaries get their own instrument: a FIXTURE SET covering quotes ('\"Babi\" means pig...'), decimals (1.5 hours), abbreviations (St. Louis, Inc., vs., etc.), initials (J. R. R. Tolkien, A. USDA grade) and ellipses (...), each with expected splits, PLUS HUMAN REVIEW of the pilot sentences - the fixtures narrow the review to a known set of risks, they do not replace it. THE RULE, STATED AS A RULE: a sentence ends at a terminator that is (a) not inside a quoted span, (b) not between digits, (c) not part of an abbreviation or initial, (d) not part of an ellipsis, and is followed by whitespace. The live catalog has NONE of these cases today (measured 0 decimals, 0 initials, 0 abbreviations in either column) - a property of today's data, not a guarantee. AMENDMENT 2 - VALIDITY IS ITS OWN AXIS on sentence_claims.status (ok/missing/retracted/unpublished/contradicting), separate from anchor_status's COVERAGE: a sentence is 'full' only if EVERY anchor is 'ok'; 'unpublished' is the agent boundary (GUS-026 section 10) in anchor form; the vocabulary is Q3's, reused. FLAGS 6 AND 7 (the two the earlier draft said but did not list): Flag 6 = the validity axis, above. Flag 7 = THE DISHES COLUMNS ARE CANONICAL BY DEFINITION - no locale column is needed; dish_translations is NON-CANONICAL and its 121 'en' rows are byte-identical duplicates of short_description (measured 121/121 identical, 0 nulls, 0 diffs), so translations are NOT a source of sentences (else every fact is anchored twice and coverage double-counts); ARCHIVING THE 121 DUPLICATES IS BACKLOGGED AS GUS-239. This retires GUS-226 as a blocker for Q9 - the canonical source of sentences is settled by definition, so 'canonical locale only' needs no new column. AMENDMENT 3 - flags 2, 3, 4 accepted as stated: flag 2 (many-to-many) -> GUS-225 (rendang's single sentence asserts 7+ facts, confirming the undercount); flag 3 resolved by the canonical-by-definition rule; flag 4 -> GUS-231, because dishes.status has a CHECK constraint restricting it to draft/published/archived and the fixture is 'archived', so gating population on status='published' EXCLUDES IT BY CONSTRUCTION with no special-case list. AMENDMENT 4 - POPULATION = THE 3 PILOT DISHES ONLY (rendang, chicken-tikka-masala, tacos-al-pastor), following Q7's precedent; 'long' IS MOOT for the pilot because MEASURED all 3 pilot long_description are EMPTY (long_len=0 each), and that gap is RECORDED RATHER THAN HIDDEN - the long path (166 sentences across 22 published dishes, 1-12 per dish) is untested by the pilot, so the field enum must NOT be narrowed to 'short' and the splitter fixtures must cover the long path before the content workstream populates it. AMENDMENT 5 - THE sentence_managed FLAG AND TRIGGER: ALTER TABLE dishes ADD COLUMN sentence_managed boolean NOT NULL DEFAULT false, plus a BEFORE UPDATE trigger that raises when NEW.sentence_managed AND NEW.short_description IS DISTINCT FROM OLD.short_description, with ERRCODE integrity_constraint_violation. WHY: the concat check only DETECTS divergence; a PATCH to /api/dishes/:slug that sets shortDescription (apps/api/src/routes/dishes-write.ts sets it directly today) would SILENTLY DESYNC the table and the column, and the desync would not surface until the next check. The trigger makes the managed column unwritable except through the sentence table, so the check becomes a backstop rather than the primary defence. This is the same trigger pattern the project already uses in db/migrations/gus-224-relations-option-b.sql. TWO CONSEQUENCES DECIDED TOGETHER: (a) the API PATCH path must write THROUGH the sentence table for flagged dishes, or it will start erroring - the trigger becomes the enforcement point for the route's contract; (b) THE FLAG IS WHAT MAKES THE TRIGGER NARROW - without it the trigger would reject every description write in the catalog, so only the 3 pilot dishes are flagged initially and the other 118 keep free-text edits. The flag is not a lock on the whole row: long_description, canonical_name and every other column stay writable. ONE DECISION MADE RATHER THAN ASKED: position is DENSE and 1-BASED per (dish, field, locale), and the check reconstructs the string and compares it to the live column - reconstructing and comparing is what makes it a gate; a spot-check is not. NEW BACKLOG ITEMS RAISED: GUS-239 (archive the 121 duplicate 'en' dish_translations rows - a bulk change needing approval, archiving not deleting) and GUS-240 (build the boundary fixture set and the single shared splitter implementation). MEASUREMENT NOTE: all figures are from READ-ONLY SELECT queries against live gustale on 2026-10-27; no schema was created or altered on the live database, and no files were copied into the shared-postgres container - per Alejandro's instruction, schema experiments belong on a copy/test DB from now on and psql -c / stdin is used instead."

      - "ADR-002 Q8 FOLLOW-UP 2026-10-27 (Alejandro): citation_independence rows are written ONLY for class-sufficient 'supports' pairs on the SAME statement. NO ROW = UNASSESSED, and an unassessed pair contributes ZERO. This closes the workload policy that the Q8 decision flagged as open: the table is not populated exhaustively for every source pair - it is populated only where the pair is worth adjudicating, i.e. where both sources are class-sufficient supports for the same statement and independence therefore affects a corroboration count. A pair that is not worth adjudicating simply has no row, which is exactly the 'unassessed' state, and absence of a row is not evidence of independence."

      - "ADR-002 Q9 DRAFTED 2026-10-27 (Alejandro's position, measured against live data): a STRUCTURED SENTENCE TABLE, not inline markers. REASONING: inline markers would leak into the public column and break translations, and offsets break on edit. SCHEMA: description_sentences (id, dish_id, field enum('short','long'), locale, position int, text, anchor_status enum('full','partial','none') default 'none', created_at, updated_at, UNIQUE NULLS NOT DISTINCT (dish_id, field, locale, position)) + sentence_claims (sentence_id -> description_sentences ON DELETE CASCADE, statement_id -> statements, PK (sentence_id, statement_id)). RULES: short_description is rendered from the sentences and the CONCATENATION MUST EQUAL THE LIVE COLUMN EXACTLY; a sentence text edit sets its anchors to needs_review (same stale mechanism as Q2); anchors on the CANONICAL LOCALE ONLY (GUS-226). LIVE FINDING 1 - THE TRANSITION CHECK IS FEASIBLE, BUT THE EXACT SPLITTER HAD TO BE FOUND: 4 attempts measured, and two obvious regexes fail. 'regexp_split_to_array(text, \\'.\\')' + rejoin ' ' gives 121/122 (drops the terminator, cannot reconstruct); '(?<=[.!?])(\\s+)' + rejoin '' gives ONLY 95/122 because regexp_split_to_array DROPS A CAPTURED GROUP AT THE END OF THE STRING (the final separator is lost); '(\\s+)(?<=[.!?])' + rejoin '' gives 122/122 BUT COUNTS CTM AS 1 SENTENCE because the lookbehind is evaluated AFTER the whitespace, so it only matches whitespace FOLLOWED BY a terminator and never splits; the CHOSEN splitter is the ZERO-WIDTH LOOKAHEAD '(?<=[.!?])(?=\\s)' + rejoin '' - it consumes no characters (asserts a terminator behind, whitespace ahead, splits at that point), so the whitespace is never removed and stays inside the parts, rejoining byte-exactly. It is the only form satisfying BOTH exact reconstruction AND correct sentence boundaries. VERIFIED: short_description 122/122 EXACT, 149 sentences (95 dishes x 1, 27 dishes x 2); long_description 22/22 EXACT, 166 sentences (1-12 per dish); TOTAL 315 anchorable sentences. LIVE FINDING 2 - long_description is where a naive check would fail: 12 of its 22 populated rows contain a BLANK-LINE PARAGRAPH BREAK, and a whitespace-normalising splitter collapses those newlines (failing by 1-3 chars per row); the zero-width splitter preserves them exactly, so the same check works for both columns. LIVE FINDING 3 (FLAG) - anchor_status full/partial/none describes COVERAGE, but ADR-001 D4's check is about VALIDITY: a sentence can be 'full' and still invalid if an anchored statement is missing/retracted/contradicting/unpublished. RECOMMENDATION: keep anchor_status exactly as specified and carry the validity axis on the sentence_claims side as a per-anchor status, reusing Q3's vocabulary (missing / retracted / contradicting / unevidenced). LIVE FINDING 4 (FLAG) - SENTENCE != CLAIM, and the relationship is genuinely MANY-TO-MANY: the 27 two-sentence short_descriptions prove a sentence is not a claim, and the harder case is one sentence asserting several facts - CTM's first sentence asserts at least three (is-a-dish, protein chicken, technique roasting), and rendang's single sentence asserts origin, family, protein, technique, medium, aromatics and duration = 7+, CONFIRMING GUS-225's UNDERCOUNT (D6's '6 claims for rendang' is wrong). So one sentence -> many statements AND one statement -> many sentences (the same fact may be asserted in both a short and a long description); the latter is why 'field' exists - coverage is per field, and a fact anchored in long but not short is a real reportable gap. LIVE FINDING 5 (FLAG) - dish_translations has 121 rows ALL language='en', and its description is BYTE-IDENTICAL to dishes.short_description in all 121 (0 nulls, 0 diffs) - so it currently holds an exact DUPLICATE of the canonical English text, not a translation. Hence anchors live on the canonical dishes text and dish_translations is NOT a source of sentences (otherwise every fact is anchored twice and coverage double-counts). ALSO: there is NO canonical_locale column anywhere today (dishes has no locale; dish_translations.language is free text with one value) and GUS-226 is still status todo - so 'canonical locale only' is unambiguous in practice but has no column to point at, and GUS-226 SHOULD LAND FIRST. ALSO: language values are not BCP-47-normalised (en vs en-GB vs english is a real risk when a 2nd locale arrives). LIVE FINDING 6 (FLAG) - test-dish-7c (the known archived fixture) has short_description 'Updated via PATCH - phase 7c is alive' with NO terminal punctuation and NO dish_translations row (the only dish without one); it still round-trips exactly so it does not break the transition check, but it must be excluded explicitly from population as it already is from metric denominators. LIVE FINDING 7 (FLAG) - 11 of the 22 long_descriptions contain a quoted passage of 10+ chars (e.g. '\"Babi\" means pig and \"panggang\" means grilled'); the chosen splitter is safe ONLY because the catalog currently has NO decimals, NO initials (A.) and NO abbreviations (Inc/Ltd/St/Dr/Mr/vs/etc) - checked, 0 in both columns - and that is a property of today's data, not a guarantee. So the splitter must be specified as a RULE WITH AN ESCAPE HATCH (a terminator inside a quoted span does not end a sentence), not as a regex constant; this is the one place where the exact round-trip check would still pass while the sentence BOUNDARIES were wrong. LEFT OPEN, FLAGGED NOT ASKED: (1) the per-anchor validity axis; (2) whether long_description sentences are populated in the same migration as short (GUS-226's scope decision); (3) whether description_sentences is populated for all 122 dishes or only the 3 pilot dishes - Q7's migration precedent (3 pilot dishes only) argues for the pilot, GUS-226's scope argues for all; (4) the canonical locale column and BCP-47 enforcement. ONE RECOMMENDATION MADE RATHER THAN ASKED: position should be DENSE and 1-BASED per (dish, field, locale), and the transition check should compare the RECONSTRUCTED STRING against the live column - reconstructing and comparing is what makes it a real gate; checking a sample does not. MEASUREMENT NOTE: all figures above are from READ-ONLY SELECT queries against live gustale on 2026-10-27; no schema was created or altered on the live database - per Alejandro's instruction that schema experiments belong on a copy/test DB from now on."

      - "ADR-002 Q8 DECIDED 2026-10-27 (Alejandro): independence. STORE IT, with FOUR AMENDMENTS. (1) CORROBORATION COUNTS ONLY CLASS-SUFFICIENT SUPPORTS LINKS, AND S6 NEVER COUNTS. The rule: Corroborated = >= 2 'supports' links on the statement, from sources whose source_class is sufficient for that claim's predicate and claim_class, counted pairwise as independent. This is the conjunction of three rules already in GUS-026 made into one check: class sufficiency (S6 = discovery and terminology only, S7 = nothing, section 3), the Wikipedia rule (section 3.1 - a documented/disputed origin claim needs >= 1 S1/S2/S3/S5 source; S6 may accompany but not stand alone), and 'quantity is not independence' (section 5 - five websites repeating the same unsourced assertion is one assertion). CONSEQUENCE: THE PILOT'S CORROBORATION IS 0 BY POLICY - all 142 catalog sources are en.wikipedia.org so all are S6, and S6 counts for nothing. This is NOT a gap to be closed by recording Wikipedia derivations - it is the policy working, and NO WIKIPEDIA DERIVATION WORK IS NEEDED OR QUEUED. The alternative would have produced a non-zero number meaning 'Wikipedia's article agrees with itself', which is exactly what section 5 forbids. CONSEQUENCE STATED PLAINLY: with S6 counting for nothing, the pilot cannot demonstrate a corroborated claim using catalog sources at all - corroboration can only be demonstrated with sources that do not exist yet, which is why the pilot must ACQUIRE real non-Wikipedia sources rather than measure the number. (2) INDEPENDENCE IS TRI-STATE WITH NO DEFAULT: relation enum('independent','derived','unassessed') - only 'independent' counts; 'derived' does not; 'unassessed' DOES NOT and is NOT a synonym for independent. The draft's default ('a source with no derivation is independent of every other source') is REJECTED - that default is what made the draft's conclusion inevitable, and it encodes an ABSENCE OF EVIDENCE AS EVIDENCE OF ABSENCE, the same error the rest of the ADR removes. The tri-state matters because it separates 'we checked and they are independent' from 'we never checked'; collapsing them into a boolean would let an unexamined pair accumulate corroboration credit merely by being present. A PAIR THAT HAS NOT BEEN ASSESSED CONTRIBUTES ZERO, so an incomplete assessment UNDERSTATES rather than inflates - the safe direction to err in. The pilot's number is therefore not 'how many sources agree' but 'how many pairs have been EXPLICITLY JUDGED independent, among sources whose class suffices' - both conditions must hold. (3) TWO LEVELS. LEVEL 1 source_derivations = whole-source derivation, i.e. two sources that are the same document (translation, edition, reprint, mirror) - a property of the sources themselves holding for EVERY claim both cite. LEVEL 2 citation_independence = per-citation, claim-specific judgement: two entirely distinct documents can still not be independent for one particular claim (a book quoting a newspaper for one fact while being independent for everything else). LEVEL 1 IS A HARD BLOCK CHECKED FIRST - if two sources are in a derivation chain they are the same source and the pair is 'derived' for every claim, and no per-citation judgement can override that, because a translation of a source cannot independently corroborate it. Level 2 is where the real editorial work lives: level 1 answers 'are these the same document?', level 2 answers 'are these independent FOR THIS FACT?', which is GUS-026 section 5's actual test. (4) THE PILOT MUST EXERCISE THE PATH, IN BOTH DIRECTIONS. POSITIVE: one rendang statement (the origin claim) carries 2 REAL non-Wikipedia sources, both fetched and recorded with excerpts and revision anchors (Q7), both classified S1-S5 so they are class-sufficient (amendment 1), and the pair EXPLICITLY ASSESSED 'independent' (amendment 2). NEGATIVE: a 'derived' pair is constructed and verified to NOT corroborate - if the two rendang sources share an upstream reference the pair is assessed 'derived' and the statement does not corroborate; THE DERIVED-PAIR CASE IS BUILT IN THE TEST DATABASE, NOT LIVE, as a fixture proving the 'derived' path returns 0 corroboration credit. WHY THE NEGATIVE CASE MUST BE BUILT, NOT JUST SPECIFIED: a check that has only ever seen 'independent' has not been shown to reject anything, and the 'derived' path is the one that has to be right because it is the path that stops a claim being published on the strength of one source twice. And the pilot's own number is 0 until the non-Wikipedia sources exist - the pilot's corroboration number becomes non-zero only once those sources are in place and assessed independent. FLAGGED, NOT DECIDED: whether citation_independence rows are written for EVERY pair of sources on a statement or only for pairs a reviewer is asked to adjudicate - exhaustive is expensive, the second is a workflow choice, and the workload policy is GUS-029's to set once the pilot shows what the work actually costs. FLAGGED: source_derivations.relation_type covers the document-identity relations (mirror, translation, edition, reprint) plus 'other' so an unusual case is recordable rather than forced into a wrong bucket. VERIFIED ON THE LIVE SERVER (Postgres 16.4) before recording: same pair assessed twice REJECTED with unique_violation (one judgement per statement+source+compared_source); same pair with a different statement ACCEPTED (level 2 is per claim); 'unassessed' ACCEPTED as an explicit state (not NULL, not a default); counting only relation='independent' gave tally independent=1 derived=1 unassessed=1 - derived and unassessed excluded. ALSO FOUND AND RECORDED: Postgres has NO inline enum on a column, so both enums need NAMED TYPES (CREATE TYPE independence_relation / derivation_relation) - the ADR schema now shows them."

      - "ADR-002 Q7 DECIDED 2026-10-27 (Alejandro): the evidence link. A claim_citations table, one row per (statement_id, source_id, revision_id, locator). FIVE AMENDMENTS. (1) UNIQUENESS KEY is (statement_id, source_id, revision_id, locator) - the draft's (statement_id, source_id, stance) is REPLACED, because it forbids two passages from the same article (a common case: one paragraph for the origin, another for the technique) and forbids re-reading the same passage on a later revision (which is how drift is detected). revision_id is NULLABLE, and in Postgres NULL never equals NULL in a unique index - so the key would silently not apply to non-versioned sources. CHOSEN FORM: UNIQUE NULLS NOT DISTINCT (statement_id, source_id, revision_id, locator) - available from Postgres 15, and this project runs POSTGRES 16 (verified live: shared-postgres is postgis/postgis:16-3.4, server_version 16.4; devcontainer uses the same 16-3.4 image), so no COALESCE wrapper or expression index is needed. VERIFIED ON THE LIVE SERVER before recording it, with a temporary table carrying this exact constraint: (a) duplicate NULL-revision row REJECTED with unique_violation - the case a plain UNIQUE would have got wrong, letting a non-versioned source accumulate unlimited duplicates for the same locator; (b) same passage on two different revisions ACCEPTED - history kept; (c) same statement+source+revision with two different locators ACCEPTED - two passages from one article. stance is NOT in the key. HISTORY IS KEPT: a re-read on a new revision is a NEW row and the old row is RETAINED with its own revision_id and retrieved_at, so 'what did the article say when we cited it' and 'is this still supported' are both answerable. (2) ONE TIMESTAMP: retrieved_at timestamptz NOT NULL; accessed_at is DROPPED (two columns for one event, two types date vs timestamptz, two names for the same meaning). timestamptz not date, so a 09:14 read and a 16:40 re-read on the same day are distinguishable - which is exactly the question the revision id alone cannot answer. NOT NULL because an evidence link without a retrieval time is an unread citation, the exact defect the table exists to fix. (3) stance='context' COUNTS AS NEITHER SUPPORT NOR REFUTATION - excluded from COVERAGE and from CORROBORATION, recorded as an ADR rule and not left to each consumer's judgement, because letting a passing context passage inflate a corroboration count is the failure GUS-026 section 5 warns about. context is FOR: recording that the source was read, discusses the subject, and did NOT settle the proposition - it is why a proposition is research_pending rather than unsupported, and it is the honest record of a lead that did not pan out. CONSEQUENCES: a context-only statement is UNSUPPORTED, not disputed (disputed requires at least one refutes - sources conflicting - and triggers the Q5 competing-statements machinery, which unsupported does not); a refutes link does NOT make a statement evidenced (refutation is not support; a statement whose only links are refutes is unsupported, and in the CTM case the other statement of the competing pair holds the support). CORROBORATION RULE recorded: count >= 2 independent 'supports' links on one statement. (4) EXCERPT = the MINIMAL passage carrying the fact (1-2 sentences), QUOTED VERBATIM - not a paragraph, not a summary, not a paraphrase - and VALIDATED AS A SUBSTRING OF THE STATED REVISION'S TEXT (enforceable: for a Wikipedia source with revision_id R the text of revision R is fetchable at https://en.wikipedia.org/w/index.php?oldid=R&action=raw, so the check is a substring test against that exact text, at write time). WHY IT IS A RULE: a paraphrased excerpt is a second unauditable claim about the source - the citations.claim_text failure one level down; an excerpt that is not a substring of the stated revision is mis-transcribed or comes from a different revision than the one recorded, and both make the citation a lie. WHY MINIMAL: a longer quote does not show the reader what supports the fact, and minimality is what makes the excerpt/locator split meaningful - the locator says WHERE, the excerpt says WHAT. PUBLIC DISPLAY REQUIRES ATTRIBUTION: source and license shown with the excerpt; all current sources are Wikipedia CC BY-SA 4.0, so a public Wikipedia excerpt is shown WITH attribution under CC BY-SA. License/attribution-block implementation detail deferred to GUS-028, but the REQUIREMENT is recorded now because it changes what the excerpt column is for. (5) MIGRATION OVERRIDDEN - the draft's migrate-all-121 recommendation is overridden: ONLY THE 3 PILOT DISHES MIGRATE (rendang, chicken-tikka-masala, tacos-al-pastor), as stance='supports' with excerpt FETCHED from the source's current text and revision_id recorded - a RE-READING, recorded as such, not a reconstruction of a reading that never happened. VERIFICATION STATE IS 'unverified' UNTIL REVIEWED: GUS-026 section 10 is explicit that an agent may not move a claim to verified and may not publish, so the migration (agent-performed) yields rows that exist with real checkable excerpts but NO pilot statement published by this ADR; a human reviews and moves them - the same boundary Q2 set for readings (a bot-drafted reading stays draft). THE OTHER 118 STAY IN THE ARCHIVED citations TABLE until their statements exist, and NO STATEMENTS ARE CREATED IN ORDER TO RECEIVE THEM - that is the point: creating 118 statements so the citations have somewhere to live manufactures claims to fit the evidence rather than deriving claims from the evidence, and a statement created for a citation takes its granularity from whatever prose happened to be in citations.claim_text, which is the old model restated. Statements are derived from the research; citations attach to statements that exist. CONSEQUENCE STATED: the pilot's coverage/corroboration numbers are computed over 3 curated dishes with agent re-readings while 118 dishes have no statement at all, so ANY catalog-wide coverage percentage in this state is MEANINGLESS - the pilot's numbers are a VALIDATION OF THE MODEL, not a measurement of the catalog, and must be labelled as such wherever reported."

      - "ADR-002 Q7 DRAFTED 2026-10-26: the evidence link. A claim_citations table - one row per (statement, source) - carrying stance (supports/refutes/context, which is what makes a dispute representable), locator, the EXACT excerpt, and the RETRIEVAL ANCHOR. Each covers a different failure: without the excerpt nobody can see what the source said; without the locator the passage cannot be re-found; without the REVISION ID the citation silently drifts, because a Wikipedia article cited in March is a different document from the same article cited in October and the link still resolves while the claim it supported may no longer appear in it. Verified live: the MediaWiki API returns revid=1381860136 with timestamp 2026-10-25T07:01:26Z for Rendang, and https://en.wikipedia.org/w/index.php?oldid=<revid> is a PERMANENT permalink to that exact revision. So the link must carry the Wikipedia revision id, OR a retrieval date for sources that are not versioned - both, because revision_id answers WHICH VERSION and retrieved_at answers WHEN it was read. The existing 121 citations have a location but NO excerpt, NO revision id and NO retrieval date, and their claim_text is the whole short_description (120 of 121) - the thing being fixed. Recommendation: migrate as stance='supports' with the excerpt FETCHED from the source's current text at the cited locator, AND record the revision id of the revision that was read - that makes the migrated citation honest about what it is (the passage as it stands on a specific recorded revision) rather than pretending it was captured in March. It is a RE-READING, recorded as such, not a reconstruction of a reading that never happened. The old citations table is NOT dropped - it is archived, because citations.target_type/target_id is a dish-level link the new model does not replace."

      - "ADR-002 Q3 FURTHER FIX 2026-10-26 (Alejandro): Punjab gets parent_id = NULL, not India. Punjab is not 'in India' in the geographic sense parent_id expresses - it spans India AND Pakistan, so parenting it under India asserts a containment that is false for the Pakistani half, and a place row has one parent_id. The two-country membership is a separate n:m relation, backlogged as GUS-237 (place_spans: place_id, country_id, note) with Punjab -> India and Punjab -> Pakistan. parent_id IS NULL IS A MEANINGFUL STATE - 'not contained in a single parent' - and validation must not read it as missing data."

      - "ADR-002 HISTORY CORRECTED 2026-10-26 (Alejandro): 1947 = the PARTITION of British Punjab between India and Pakistan; 1950 = the Indian state formed as East Punjab (PEPSU); 1966 = the REORGANISATION OF INDIAN PUNJAB (PEPSU -> Punjab, Haryana, Chandigarh). Verified against Wikipedia 'Punjab, India': 'Formation 26 January 1950, 1 November 1966 (reorganisation)', 'Previously was East Punjab, PEPSU'. The earlier ADR phrasing - 'the Indian state of Punjab is a 1966 administrative partition of it' - was wrong twice over: the partition was 1947, and 1966 was a reorganisation of the Indian state, not a division of the region."

      - "ADR-002 Q4 FIX 2026-10-26 (Alejandro): rendang's medium is contains_ingredient(rendang, coconut) with role=medium - the value is 'coconut', NOT 'coconut-milk', because coconut-milk is not in the controlled vocabulary (ingredient_categories has 'coconut') and inventing a value would be a vocabulary extension. After GUS-233 creates the real ingredient entities the value becomes the coconut-milk entity, with role=medium unchanged. This is the point of role being a qualifier: a new role is DATA, so the one-predicate-per-dimension rule holds."

      - "ADR-002 Q5 DECIDED 2026-10-26 (Alejandro): Option A - one statement per (subject, predicate, VALUE) pair. Under Option B a source documenting two of three techniques either overstates its support for the whole proposition or supports a part the schema cannot express; under Option A it supports exactly the one technique it mentions. Matches Q1's granularity and Q3's 'the row is the index, the statement is the evidence'. Rendang alone has 6 statements, exactly as ADR-001 D6's worked example has it."

      - "ADR-002 Q5 SINGLE-VALUED RULE GENERALISED 2026-10-26 (Alejandro): for a SINGLE-VALUED dimension, multiple COMPETING statements are allowed; EXACTLY ONE is ACCEPTED; the dimension row points to the accepted statement; the others remain visible as disputed/alternative. This is the D1 CUISINE RULE GENERALISED - ADR-001 D1 already left chicken-tikka-masala's cuisine unset because the Glasgow origin is contested, with the dispute in competing claims. The consistency check flags a row whose statement_id is not the accepted statement. TWO CORRECTIONS recorded: (1) the earlier draft's example was wrong - chole-bhature was curry-vs-BREAD, not stew-vs-curry (the stew-vs-curry case was goulash-hungarian and kimchi-jjigae, Stew + Soup); (2) the proposed remedy was also wrong - dish_relations is DISH-TO-DISH and therefore CANNOT carry family membership at all. A relation between two dishes says 'these dishes are related'; it cannot say 'this dish is also a member of that family'. The is_a case is handled by the generalised rule: a dish plausibly in two families gets two is_a statements, one accepted, the other visible as an alternative, and the dimension stays single-valued."

