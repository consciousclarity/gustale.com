      - "ADR-002 Q4 DECIDED 2026-10-26 (Alejandro): EXACTLY ONE PREDICATE PER DIMENSION, derived from the seven dimensions rather than assembled opportunistically. The seven: is_a (family), belongs_to_cuisine (cuisine), served_as_course (course), cooked_by (technique), contains_ingredient (ingredient_category), part_of_tradition (tradition), eaten_in_context (context). is_a no longer covers cuisine, and the COURSE and TRADITION predicates that the earlier draft was missing are now present - so any dimension without a predicate is a visible gap in the vocabulary. AMENDMENTS: (1) contains_ingredient's value is a VOCABULARY REF to ingredient_categories for the pilot (dish_ingredients has only 4 rows catalog-wide, so pointing at an ingredient entity would point at almost nothing; the 53-row vocabulary is real and populated), becoming an entity ref after GUS-233. (2) created_by takes a TYPED LITERAL person_name - a MARKED EXCEPTION under Q1 - with a person entity table backlogged as GUS-236. (3) literal types pinned: originated_at = date/period, has_duration = duration (a duration is an interval, so the type carries the unit). FLAGS: is_a statements are SUPPORTED, NOT REQUIRED - a dimension row with statement_id IS NULL is simply unevidenced, which is the honest state of a taxonomic assignment nobody has sourced; making it mandatory would report a wall of errors that says nothing true. (4) A FIFTH QUALIFIER TYPE, role: Medium is a ROLE, not a kind of thing, so rendang's medium is recorded as contains_ingredient(rendang, coconut-milk) with role=medium rather than inventing a has_medium predicate - which keeps the one-predicate-per-dimension rule intact, because a new role is DATA, not a new predicate. The qualifier set is now five: place (entity ref), period (literal), variant (entity or vocabulary), occasion (vocabulary), role (vocabulary)."

      - "ADR-002 Q5 DRAFTED 2026-10-26: the object shape. Q4's decision narrows it sharply - six of the seven dimension predicates take a VOCABULARY value, and three dimensions are single-valued (ADR-001 D7b). So the real question is not 'several objects per statement' but 'how does a multi-valued dimension relate to the statements that evidence it'. Option A: one statement per (subject, predicate, VALUE) pair. Option B: one statement per (subject, predicate) with several values. RECOMMENDATION: Option A - because under Option B a source documenting only two of three techniques either overstates its support for the whole or supports a part the schema cannot express, while under Option A it supports exactly the one technique it mentions. It also matches Q1's granularity and Q3's principle that the row is the index and the statement is the evidence. The dimension rows then become an exact index. One sub-decision flagged: is_a is single-valued but its vocabulary is not - a stew that is also a curry (the chole-bhature case in the broader-family review) is TWO is_a statements, with the second membership expressed through a dish_relations row rather than a second dimension value, because the taxonomy's single-valuedness is a product decision this ADR implements rather than reopens - but the statement records the second membership so the evidence is not lost."

      - "ADR-002 Q3 DECIDED 2026-10-26 (Alejandro, option (iii)): the subject is an ENTITY, never a vocabulary value; for the pilot the subject set is DISH + PLACE only, and real technique/tradition entity tables are separate work (GUS-233). AMENDMENT 1 - places need a hierarchy country > region > city BEFORE the pilot, via parent_id; the good news is geo_entities ALREADY HAS parent_id (unused - all 36 rows are entity_type='country' with no parent), so this is not a schema change but using an existing column plus seeding the levels. entity_type becomes country | region | city. Seed ONLY the pilot places: countries Indonesia, United Kingdom, India, Mexico (all 4 exist); regions West Sumatra (parent Indonesia), Scotland (parent United Kingdom), Punjab (parent India); cities Glasgow (parent Scotland), Delhi (parent Punjab), Mexico City + Puebla (parent Mexico). MINANGKABU IS A TRADITION VALUE, NOT A PLACE - it is already in dish_traditions (36 rows) and must not be seeded into geo_entities."

      - "ADR-002 Q3 AMENDMENT 2 - dimension and relation rows get a nullable statement_id pointing at the supporting statement. THE ROW IS THE INDEX, THE STATEMENT IS THE EVIDENCE: a dimension row answers 'what is this dish's family?' and must stay fast and denormalised; the statement answers 'why do we believe that, and on whose authority?' and carries predicate, qualifiers, sources, class and status. The FK lives on the row because 91 dishes have a family assignment and NO statement - the statement is added later as evidence accumulates, and one statement can support several dimension rows simultaneously. A consistency check flags rows whose statement is missing, retracted (status needs_revision/disputed) or contradicting (claim_class disputed/unsupported); statement_id IS NULL is flagged UNEVIDENCED - not an error, but the honest state of a value someone typed. This is what makes the coverage number meaningful: a value with no statement is typed, a value with a documented statement is a fact, and today the two are indistinguishable."

