    priority: P0
    phase: 1
    first15_order: 7
    status: in_progress
    depends_on: []
    approval: false
    notes: "Policy draft written 2026-10-25 (.hermes/REPORTS/GUS-026-evidence-policy-draft.md). DOCS ONLY — a draft for Alejandro's review, not enforced, no data changed."
    acceptance:
      - "Policy draft written for Alejandro's review (docs only)"
      - "Defines source classes with an explicit bar for what each may support"
      - "Defines claim classes and the verification states"
      - "States the independence test so corroboration is computable"
      - "States what an agent may and may not do"
      - "Open questions are listed for Alejandro's decision"
    evidence:
      - "Draft: .hermes/REPORTS/GUS-026-evidence-policy-draft.md (2026-10-25, DRAFT)"
      - "Motivating number: 121/121 published dishes (100%) cite Wikipedia and nothing else. The ROADMAP's own rule ('Wikipedia must never be the sole basis for a contested historical origin claim') is therefore ALREADY violated across the whole catalog."
      - "Policy content: 7 source classes (S1 primary historical .. S7 unverified) with a per-class bar; 6 claim classes (documented / scholarly_interpretation / oral_tradition / disputed / hypothesis / unsupported); 7 verification states; 11 testable rules (R1-R11) mapped to GUS-027..GUS-036 and to RULES.md; an independence test ('if this source were deleted, would the other still say the same thing?'); explicit agent boundaries."
      - "Tightened the ROADMAP's Wikipedia rule into something checkable: an origin/date/person claim classed documented or disputed must have at least one non-S6 source; S6 (Wikipedia/Wikidata) may accompany but never be the sole basis."
      - "Migration estimate: the 121 existing dish-level Wikipedia citations become roughly 300-500 claim rows (2-5 assertable facts per typical short description), of which ~121 are origin claims that immediately fail the policy bar and must be researched, downgraded, or reclassified."
      - "Open questions flagged: staleness interval (24 months proposed), whether practitioner/oral testimony may ever support an origin claim, claim granularity (sentence vs assertable fact), whether R1 applies to short descriptions or only long ones, minimum bar for `published`, and how prominent `disputed` must be."
