      - "ADR-002 Q4 DRAFTED 2026-10-26: the predicate vocabulary. The pilot's 3 dishes need 9 distinct predicates - originated_in, is_a, contains_ingredient, cooked_by, served_as, has_duration for rendang/CTM/tacos, plus the 4 origin predicates GUS-026 already assumes (originated_in, originated_at, created_by, named_after). Recommendation: a 'predicates' TABLE rather than an enum, because the per-predicate VALUE SHAPE is metadata the schema must enforce - originated_in must take a place, is_a a vocabulary value, contains_ingredient an ingredient, cooked_by a technique, has_duration a duration literal - and a table puts that rule in the data where a review can see it, whereas an enum pushes it into application code where it drifts. Seeded with exactly what the pilot needs plus the origin predicates GUS-026's Wikipedia rule names (a rule referencing a non-existent predicate is unenforceable). Two open points flagged: whether the taxonomic predicate is_a should require a statement at all (recommend yes), and whether coconut milk's 'medium' role is a separate predicate or a qualifier on contains_ingredient (recommend a qualifier - 'medium' is a role an ingredient plays, not a distinct kind of thing, and a separate predicate would let a dish have both a medium and no ingredients without contradiction."

      - "ADR-002 Q2 DECIDED 2026-10-26 (Alejandro). A statement stores NO authoritative text; readings exist only for claim display. (1) The default reading is a DETERMINISTIC template per predicate per locale, with a fallback of 'subject . predicate . value' when no template exists - so a reading exists for every statement in every locale by construction. (2) Editorial readings store the statement version/hash; on a statement change the reading becomes STALE, is HIDDEN, and the template is shown until a human re-confirms it. (3) Reading kinds are 'template' and 'editorial' only; a bot-drafted reading stays 'draft' and is NOT DISPLAYED until a human confirms it - there is no 'bot' kind, so an agent draft is an editorial reading in draft state. (4) SCOPE: readings are for claim display (evidence panel / editor) ONLY, never a substitute for the D4 authored description. A fact that exists only in a reading does not exist in the model."

      - "ADR-002 Q3 DRAFTED 2026-10-26: the subject model. Grounded in what the catalog can actually reference (measured live): geo_entities 36 rows, all entity_type='country', with a wikidata_id COLUMN but 0 rows populating it; food_regions EMPTY; dish_ingredients only 4 rows; the dimension tables are VOCABULARIES (dish_families 25, dish_cuisines 21, dish_courses 8, dish_techniques 25, dish_traditions 36, dish_contexts 5, ingredient_categories 53) rather than entity tables. The recommendation: the SUBJECT is always an ENTITY (dish / ingredient / a specific place) and never a vocabulary value, while the QUALIFIERS mix entity references (place, variant) with vocabulary values (occasion) and typed literals (period). For the pilot the subject set should be limited to what exists richly today - dish and place - because a statement whose subject is a vocabulary value cannot carry per-entity claims, and real technique/tradition entity tables belong with the recipe and tradition subtrees rather than inside ADR-002."

      - "ADR-002 Q1 DECIDED 2026-10-26 (Alejandro): a claim is a STATEMENT in the Wikidata model - (subject, predicate, value) + qualifiers (place, period, variant, occasion) + references. Predicates come from a controlled vocabulary taken VERBATIM; new predicates only by explicit decision. Values are TYPED - an entity reference (dish / vocabulary value / place) or a typed literal; free text only as a MARKED EXCEPTION. The exact source passage and locator live on the EVIDENCE LINK, not on the claim - the shape of that link is a later question. The list is frozen from here. The consequence recorded explicitly: because predicates are controlled and values typed, most statements cannot be free prose - that is what stops a claim row quietly becoming prose again, the failure mode of citations.claim_text."

