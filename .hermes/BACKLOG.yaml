  - id: GUS-003
    title: "Add database transaction safety. Ensure related changes are committed atomically, especially changes involving dishes, sources, regions, and lineages"
    epic: "EPIC 01 — Stabilize the technical foundation"
    priority: P0
    phase: 0
    status: done
    depends_on: []
    approval: false
    notes: "Audit found 9 handlers doing multi-statement writes with NO transaction: 6 in apps/api/src/routes/dishes-write.ts and 3 in apps/api/src/routes/admin-dishes.ts (27 write statements total). Only dishes-media.ts had one (the cover-demotion + insert). Worst cases: PATCH /api/dishes/:slug DELETE-then-INSERT on categories and tags (a failure between them leaves the dish with no categories); PATCH .../variants/:id DELETE variant then write audit (a failure leaves the variant gone with no trace); POST /api/admin/dishes/:slug/sources did source insert + citation insert + audit across 3 tables (the evidence path — a partial failure leaves an orphaned source or a citation with no audit trail). FIXED 2026-10-25 in PR #110."
    acceptance:
      - "Every multi-statement write handler runs inside a single db.transaction"
      - "No bare db.insert/update/delete remains outside a transaction in the write paths"
      - "A regression test proves the atomicity: a mid-transaction failure rolls back the earlier writes"
      - "Full test suite + typecheck + biome + astro build green"
    evidence:
      - "PR #110 (9cdbc8c) MERGED 2026-10-25 — all 10 multi-statement write handlers now atomic (9 handlers, 27 write statements, 0 bare db.insert/update/delete remaining in the two write files). Live deploy verified."
      - "Regression test apps/api/test/dishes-atomicity.test.ts proves the guarantee: PATCHes with a category id that violates the FK so the INSERT fails INSIDE the transaction after the DELETE has already run; asserts the original category survived, the column update rolled back, and no edit_history row was written."
      - "Confirmed the test is a real guard: reverting dishes-write.ts to the pre-transaction version makes it fail with 'expected [] to deeply equal [ Array(1) ]' (the dish lost its category); it passes again with the fix in place."
      - "Local CI mirror (postgis 16-3.4 + committed migration chain + seeds + vitest + astro build): typecheck OK, biome OK, 9 test files / 63 passed / 3 skipped, 22 pages built, exit 0."
