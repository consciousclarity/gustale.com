      - "Cluster 2 (Astro chain) — MERGED in #108 (96b23fb): @astrojs/react 5.0.7 -> 7.1.1. This is a PARENT bump, not a transitive override, because overriding the transitives individually breaks the build: astro 7.4.2 needs vite's `transformWithOxc` export which only exists in vite 8.x, but @astrojs/react 5.0.7 pins `vite ^7.3.2`. Forcing vite 7.3.7 (the advisory's patch target) makes `astro build` fail with \"The requested module 'vite' does not provide an export named 'transformWithOxc'\". Bumping @astrojs/react to 7.1.1 resolves vite 8.3.5 (not vulnerable) + devalue 6.0.3 (fixed) and drops js-yaml and browserslist out of the tree entirely (0 occurrences in the lockfile)."
