      - "Each cluster lands as its own PR with green CI and a live check"
      - "The CI `pnpm audit --audit-level=critical` gate is promoted to blocking once criticals reach 0 (already true) and extended to high once HIGHs reach 0"
    evidence:
      - "Cluster 1 (Fastify chain) — MERGED in #107 (abc5b832): pnpm.overrides for fast-uri 3.1.2 -> 3.1.9, find-my-way 9.6.0 -> 9.10.0, @fastify/busboy 3.2.0 -> 3.2.4. Closed 10 of the 20 HIGHs. All three are in-range patch/minor bumps (ajv wants fast-uri ^3.0.1, fastify wants find-my-way ^9.6.0, @fastify/multipart wants @fastify/busboy ^3.0.0) so no parent package needs a major bump and no API surface changes."
