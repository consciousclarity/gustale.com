  - id: GUS-224
    title: "Audit all dish_relations before the 118-dish dimension run"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P1
    phase: 1
    status: done
    depends_on: [GUS-014]
    approval: false
    acceptance:
      - "Every one of the 190 existing dish_relations rows is reviewed for correct direction and relation_type"
      - "Rows whose direction contradicts the source=ancestor convention are corrected with Alejandro's OK"
      - "Rows whose reason text contradicts the stored direction are corrected"
    evidence:
      - "RAISED 2026-10-26 (Alejandro, pilot go-ahead). GUS-224 is NOT BLOCKING for the 118-dish run - the 118-run writes DIMENSIONS ONLY, no relations."
      - "AUDIT (read-only) + 4 REVIEW CORRECTIONS. Tool: scripts/hermes/gus-014-audit-relations.py. Audit report: .hermes/REPORTS/GUS-224-relations-audit.md. Plan: .hermes/REPORTS/GUS-224-option-b-plan.md. Scope: 192 rows = 96 pairs (5 directional, 91 symmetric). CORRECTION 1: identical relation_type on both rows IS the contradiction for a DIRECTIONAL type - the pair asserts A->B AND B->A, mutually exclusive. All 5 directional pairs were self-contradicting, INCLUDING the pair the GUS-014 pilot wrote. CORRECTION 2: tonkatsu<->wiener-schnitzel is LIKELY WRONG - the quote supports the French cote de veau, not schnitzel (Wikipedia Wiener schnitzel traces Nuremberg 1691, 19th-century designation, Radetzky 1857 which Pohl says concerns veal Milanese). LIKELY WRONG IS 4 OF 5. CORRECTION 3: sourced -> single_tertiary_source; the pilot relation is NOT independently corroborated. CORRECTION 4: shawarma<->hamburger-american is QUARANTINE ONLY - rewiring to doner-kebab would be a NEW CLAIM, not a correction."
      - "PRE-CHECK (Q3): all 96 pairs have IDENTICAL strength and reason on both rows - 0 mismatches, so collapsing a pair to one row loses no information. 91 symmetric pairs have exactly one row in each direction, so the canonical rule (keep the row where from_dish_id < to_dish_id) is well-defined for all 91."
      - "DECISIONS (Alejandro, 2026-10-26): OPTION B - one directed row per relation, inverse derived. relation_type VOCABULARY TABLE with a symmetric flag (NOT a CHECK enum - the flag is metadata and a vocab table extends without a schema migration). Directional pairs keep the row matching the reason text. Source/claim link SEQUENCED INTO GUS-027/028. The 4 likely-wrong pairs QUARANTINED (unverified, excluded from the public view) with NO HAND EDITS - reason/from_dish_id/to_dish_id left intact as the audit trail. Q1 the pilot relation stays LIVE, flagged single_tertiary_source. Q2 status column only, plus quarantine_note. Q3 lower id, with the mismatch pre-check above. Q4 admins see quarantined with a label, public filtered. ORDER: Option B before the 118-run."
      - "APPLIED TO LIVE 2026-10-26: db/migrations/gus-224-relations-option-b.sql. Dry-run first on a restored copy (22/22 gates), then live (22/22 gates). dish_relations 192 -> 96 rows; 96 dropped inverses MOVED to dish_relations_archive with their ORIGINAL ids (no hard delete); new relation_types vocab table (7 rows, is_symmetric); dish_relations gains relation_type_id/is_symmetric/status/quarantine_note with the legacy relation_type text kept as a trigger-synced mirror so existing readers and the UNIQUE(from,to,relation_type) constraint keep working. THREE VIEWS: dish_relations_symmetric (inverse for SYMMETRIC types only - emitting it for directional types would recreate the contradiction), dish_relations_public (quarantined excluded), dish_relations_admin (quarantined visible with the note). TWO TRIGGERS: a directional relation may not have its inverse present, and a symmetric relation must satisfy from_dish_id < to_dish_id. Self-contradicting pairs 5 -> 0."
      - "THE 5 DIRECTIONAL KEEP-ROWS (explicit ids, no auto-parsing): b7e468e0-16c5-4499-8bd4-ab2ecb95d677 shawarma -> tacos-al-pastor (ancestor, 4, ACTIVE - flagged single tertiary source); 0afcdf4e-e05f-5315-8b24-67e3b8a15aa0 bacalhau-a-bras -> vindaloo (ancestor, 5, QUARANTINED); 7109f0e7-9d99-5858-9ee2-78e3a6fe1c90 biryani-hyderabadi -> jollof-rice (ancestor, 4, QUARANTINED); 27b97221-f85c-532c-9264-7899f34399b7 shawarma -> hamburger-american (diaspora, 2, QUARANTINED); c212c598-0297-4597-aefa-6dc4bfc9e3a6 tonkatsu -> wiener-schnitzel (diaspora, 4, QUARANTINED)."
      - "VERIFICATION: scripts/hermes/gus-014-verify-relations-option-b.py - 22 gates (96 rows active+quarantined, 0 self-contradicting, 0 symmetric mismatches, 4 quarantined each collapsed to 1 row, the 5 explicit keep-ids present with the right direction/type/status, 96 archived with original ids, symmetric rows satisfy from<to, the view emits no inverse for directional types, the public view excludes quarantined, the pilot relation is active). scripts/hermes/test-relations-option-b-triggers.sh - 9 tests proving both triggers actually REJECT (a trigger that does not reject is not a trigger). I15 checker on live: 48 unchanged, 71 changed-but-explained by an edit_history row with comment GUS-224 relations Option B, 0 UNEXPLAINED."
      - "API READ PATH UPDATED: the public route (GET /api/dishes/:slug/relations) now reads dish_relations_public; the admin route (GET /api/admin/dishes/:slug) reads dish_relations_admin and returns relationStatus + quarantineNote so curators can see what was pulled and why. Drizzle schema updated with relationTypes, dishRelationsArchive and the three views."
      - "NOTE ON SNAPSHOTS: the GUS-014 V3 snapshot (20261026T040610Z) predates the GUS-014 pilot and holds 190 relations, not 192. Dry-runs and live pre-flights MUST use a fresh snapshot of the current database - a dry-run against the stale snapshot yields 95 rows and 4 keep-rows because the pilot pair is absent. A fresh snapshot was taken (20261026T053645Z) and used for this migration."
      - "STILL OPEN (not blocking): dish_relations has NO source column and there are 0 relation-level citations, so every relation claim is still unverified by construction. The source/claim link is sequenced into GUS-027 (source registry) and GUS-028 (claim-level citations). The 4 quarantined relations need new claims under that work - they are quarantined, not fixed. The 91 symmetric relations carry 0 percent corroboration and will need claims too."
  - id: GUS-225
    title: "Fix the D6 example claim count in ADR-001"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P2
    phase: 1
    status: todo
    depends_on: [GUS-014]
    approval: false
    acceptance:
      - "The D6 worked example's claim list and count are consistent with the actual sentence and with the one-assertable-fact rule"
      - "The corrected count is recorded in ADR-001 and in the GUS-014 pilot spec"
    evidence:
      - "RAISED 2026-10-26 (Alejandro, pilot go-ahead). Non-blocking. ADR-001 D6 gives rendang as 6 claims (origin, family, protein, technique, medium, duration) and the pilot spec's section 3.4 repeats that 6-claim decomposition of rendang's short_description. But the live short_description also asserts the AROMATIC PASTE ('a paste of ginger, galangal, turmeric, chili, lemongrass, garlic, and shallots') and the REDUCTION outcome ('until the sauce fully reduces and the meat darkens'), which are further separable assertable facts under the D6 rule (one subject-predicate-value statement independently supportable by one source). The stated count of 6 is therefore likely an undercount - the sentence supports more than 6 independently-sourced claims. Resolve by either expanding the list with the paste and reduction claims or by recording the rule that the example is illustrative rather than exhaustive, and make the pilot spec's claim total agree with whatever is decided."
  - id: GUS-226
    title: "Define the coverage scope: short_description + long_description, canonical language only"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P1
    phase: 1
    status: todo
    depends_on: [GUS-026, GUS-028]
    approval: false
    acceptance:
      - "The evidence-coverage metric has a written scope definition covering both description columns"
      - "Translations are excluded from the metric, or a separate per-language metric is defined"
      - "The coverage and corroboration queries implement the definition"
    evidence:
      - "RAISED 2026-10-26 (Alejandro, pilot go-ahead). Non-blocking for the GUS-014 pilot but required before GUS-029 (corroboration) is implemented. ADR D4a established that the claims anchor to dishes.short_description (populated for all 3 pilot dishes; long_description empty for all 3 and for 100 of 122 catalog dishes) and that coverage is therefore measurable rather than null. But the scope was decided ad hoc for the pilot and is not yet a policy. The scope must be: BOTH short_description AND long_description contribute factual sentences (long_description becomes populated as the 200-400-word content workstream proceeds, and its sentences must be anchorable and counted), and ONLY the canonical-language text is measured - translated text in dish_translations (language column) is not counted toward coverage, because a translation is a rendering of the canonical prose rather than an independent assertion. Decide and record whether per-language coverage is reported as a separate informational metric."

  - id: GUS-227
    title: "Fix the literal backslash in preparation_methods.name"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P2
    phase: 1
    status: done
    depends_on: []
    approval: false
    acceptance:
      - "No preparation_methods.name contains a literal backslash before an ampersand"
      - "The affected names render as 'Fried & topped', 'Stew & braise', 'Grilled & skewered', 'Bread & dough', 'Small plates & preserves', 'Steamed & custard', 'Sweets & custard', 'Boiled & cured', 'Omelettes & scrambles'"
      - "The change is logged in edit_history and the affected dishes' updated_at is bumped"
      - "The API and web surfaces that render the preparation name show a clean ampersand"
    evidence:
      - "APPLIED 2026-10-26 under standard discipline (snapshot -> dry-run on copy -> live -> verify), no review needed. Migration: db/migrations/gus-227-preparation-method-names.sql. The fix replaces the two-character sequence backslash-ampersand with a plain ampersand, using replace(name, chr(92), '') so no SQL escaping question arises."

      - "SCOPE: 9 preparation_methods rows affected (8 in use by 79 dish_preparations rows; Omelettes & scrambles is unused). Verified with position(chr(92) in name) - a LIKE pattern with a raw backslash is interpreted as an escape by LIKE itself and silently matches nothing, which is why a first check reported 0. The literal backslash appears ONLY in preparation_methods.name: categories, dishes, ingredients, sources and tags are all clean (0 each)."

      - "SLUGS WERE NEVER AFFECTED: the slugs were already correct (boiled-and-cured, bread, fried-and-topped, kebab, omelettes-and-scrambles, salad, steamed-and-custard, stew, dessert), so the API's pm.slug technique filters never broke - only the DISPLAYED name was wrong."

      - "PROVENANCE: 79 edit_history rows with comment GUS-227 preparation method name cleanup, one per affected dish, and updated_at bumped on all 79. Idempotent: a second run selects 0 rows and updates 0. I15 across the window: 119 unchanged, 0 unexplained."

      - "WEB REBUILD: the change was not visible on the pages until the web containers were rebuilt - the web serves a baked SSG snapshot, so the DB fix alone left the old strings on the page. The gustale-rebuild-web content-change detector FIRED correctly (it tracks the newest dish updated_at, which the fix bumped) and detected the change. The rebuild then hit two environment problems: the build dir /home/deploy/gustale-build has 77 root-owned files under .git and is not writable, so git fetch failed with 'insufficient permission for adding an object'; and /tmp/gustale-web-live-tag.env is root-owned so the script's rm failed and aborted before the deploy step. Worked around by cloning to a writable dir (/home/gustale/gustale-build) and running the script with GUSTALE_BUILD_DIR pointed at it, then running the deploy step directly. Both web containers redeployed from live-data-5854406 and are running healthy. VERIFIED: 0 occurrences of the backslash on the live pages, and the clean name renders (Grilled &amp; skewered)."

      - "RAISED 2026-10-26 (Alejandro, during the 118-dish mapping review). The live preparation_methods.name values contain a LITERAL backslash before the ampersand: 'Fried \\& topped', 'Stew \\& braise', 'Grilled \\& skewered', 'Bread \\& dough', 'Small plates \\& preserves', 'Steamed \\& custard', 'Sweets \\& custard', 'Boiled \\& cured', 'Omelettes \\& scrambles'. This is a data-entry artifact from an earlier migration, not an escaped ampersand. It affects 8 of the 15 methods in use and is visible wherever the preparation name is rendered."
      - "IMPACT: the 118-dish mapping had to normalise both spellings to resolve the preparation methods. It does not block the mapping (the mapper handles it) but the underlying data should be corrected rather than worked around."
      - "NOT YET APPLIED - this is a separate task because it changes user-visible content and is independent of the dimension migration."

  - id: GUS-228
    title: "Fix root-owned files that break the gustale-rebuild-web script"
    epic: "EPIC 17 — Operations, reliability, and incident response"
    priority: P1
    phase: 0
    status: todo
    depends_on: []
    approval: false
    acceptance:
      - "/home/deploy/gustale-build and everything under its .git are owned by gustale, so git fetch works without sudo"
      - "/tmp/gustale-web-live-tag.env no longer blocks a rebuild run (removed, or replaced by the mktemp change in GUS-229)"
      - "A gustale-rebuild-web run completes end to end with exit code 0, including its own cleanup"
      - "The deployed web containers still come from the correct live-data tag and the content-change detector still fires"
    evidence:
      - "RAISED 2026-10-26 (Alejandro, during the GUS-227 rebuild). TWO root-owned permission problems block the unattended rebuild timer, and neither can be fixed from the gustale user (no sudo). Alejandro will chown them."
      - "ISSUE 1 - /home/deploy/gustale-build: 77 files and directories under .git are owned by root while the rest is gustale. The directory itself is mode 755 and not writable by gustale. Result: 'git fetch --no-tags --depth=50 origin main' fails with 'error: insufficient permission for adding an object to repository database .git/objects' and 'fatal: unpack-objects failed', so the rebuild aborts before building. Workaround used on 2026-10-26: clone to /home/gustale/gustale-build and run the script with GUSTALE_BUILD_DIR pointed at it."
      - "ISSUE 2 - /tmp/gustale-web-live-tag.env is owned by root with mode 644. The rebuild script writes it, sources it, then removes it at the end; the rm fails with 'Operation not permitted' and, because the script runs under set -e, the failure ABORTS THE SCRIPT BEFORE THE DEPLOY STEP - even though both docker images built successfully. Workaround used on 2026-10-26: run the deploy_container step directly. NOTE GUS-229 changes the script to use mktemp, which removes this failure mode, but the stale root-owned file should still be removed so it stops confusing things."
      - "IMPACT: an unattended gustale-rebuild-web.timer run cannot rebuild. The content-change detector itself works correctly - it fired and detected the change - so the failure is purely in the fetch and teardown steps."
      - "WHY IT MATTERS: the web serves a BAKED SSG snapshot, so a DB-only fix is invisible on the pages until the web containers are rebuilt. This is not theoretical - it is exactly what happened with the GUS-227 backslash fix."
  - id: GUS-229
    title: "Change the rebuild script to use mktemp instead of a fixed /tmp path"
    epic: "EPIC 17 — Operations, reliability, and incident response"
    priority: P2
    phase: 0
    status: todo
    depends_on: []
    approval: false
    acceptance:
      - "The rebuild script creates its tag file with mktemp instead of a fixed /tmp/gustale-web-live-tag.env"
      - "The tag file is removed on exit via a trap, so a failed run never leaves a stale file that blocks the next one"
      - "A rebuild run completes end to end with exit code 0 and leaves no tag file behind"
      - "The build-web-live.sh script that WRITES the tag file is updated to write to the path the caller supplies"
    evidence:
      - "RAISED 2026-10-26 (Alejandro). The fixed path /tmp/gustale-web-live-tag.env is a single point of failure: two concurrent runs collide, and a leftover file owned by another user makes the rm fail and aborts the script under set -e BEFORE the deploy step (seen on 2026-10-26 with GUS-227). A mktemp path plus a cleanup trap removes both failure modes."

  - id: GUS-230
    title: "Split martabak into martabak-manis (sweet pancake) and martabak-telur (savoury filled pastry)"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P2
    phase: 1
    status: todo
    depends_on: []
    approval: true
    acceptance:
      - "A martabak-manis dish row exists with its own slug, description, cover and source citation"
      - "A martabak-telur dish row exists with its own slug, description, cover and source citation"
      - "The current combined 'martabak' row is either removed or becomes a disambiguation entry pointing at both"
      - "martabak-manis has dish_family = pancake; martabak-telur has dish_family = filled-pastry"
      - "Each new dish is logged in edit_history with updated_at bumped, and its URL is verified live"
    evidence:
      - "RAISED 2026-10-26 (Alejandro, during the broader-family review). The catalog has ONE dish row, 'martabak', whose own description covers both forms: 'An Indonesian stuffed pancake with savory egg, meat, and scallion fillings OR a thick sweet version layered with chocolate, peanuts, cheese, or condensed milk.' There are no martabak-manis and no martabak-telur rows."
      - "THE LABELS ARE: manis = the SWEET version, which is a PANCAKE; telur = the SAVOURY EGG version, which is a FILLED PASTRY. An earlier draft of the review had these inverted and was corrected."
      - "WHY THIS IS A CONTENT TASK AND NOT A DIMENSION ASSIGNMENT: dish_family is single-valued, so one dish row can only carry one family. Giving the combined row 'pancake' would mislabel the savoury half; giving it 'filled-pastry' would mislabel the sweet half. Splitting the dish into two rows is the only way for both halves to carry the right family - and that means new dish records, new slugs, new covers, new citations and a changed URL."
      - "DEFERRED for now: the combined 'martabak' row was left with NO family (dish_family unset) in the 2026-10-26 migration rather than being given a family that would be wrong for one of its two halves. The 'pancake' family keeps 4 other members (dosa, idli, masala-dosa, okonomiyaki) and 'filled-pastry' keeps 5, so neither is affected."
      - "ALSO UNSET (for a different reason each, so they are not interchangeable): bubur-ayam (a porridge; 'porridge' is not in the controlled vocabulary), soba and udon (noodle dishes served dry; there is no 'noodle' family in the vocabulary), bandeja-paisa (a platter, not a rice dish), lechon (a whole-roasted pig - a roast, not a family), asado (only 1 fitting 'barbecue' member, below the 2-member rule), lomo saltado (a stir-fry - technique, not a family), poutine (fried potatoes under cheese curds)."

  - id: GUS-231
    title: "Exclude test fixtures from public views and all metrics, then archive them"
    epic: "EPIC 02 — Redesign the culinary knowledge model"
    priority: P2
    phase: 1
    status: todo
    depends_on: []
    approval: false
    acceptance:
      - "No test fixture appears in any public API response, page, list, count or metric"
      - "Every metric denominator is computed over published dishes only"
      - "The fixture rows are archived out of the active catalog"
      - "A regression check fails if a non-published dish enters a metric population"
      - "The 121 published dishes are unaffected - the counts before and after are identical"
    evidence:
      - "RAISED 2026-10-26 (Alejandro). There is exactly ONE fixture in the catalog: 'test-dish-7c' (canonical_name 'Test Dish 7c', description 'Updated via PATCH - phase 7c is alive'), created 2026-06-17."
      - "IT IS ALREADY EXCLUDED FROM EVERY PUBLIC VIEW: dishes.status is 'archived', and the API returns 404 for /api/dishes/test-dish-7c and the web page /dishes/test-dish-7c returns 404. All 121 published dishes are real."
      - "THE EXPOSURE WAS ONLY IN THE METRICS: my own denominators counted all 122 dish rows, so coverage read as '114 of 119' when the real population is 118 (121 published minus the 3 pilot dishes) and the real figure is 114 of 118. The fixture has ZERO dimension rows - it only ever inflated the denominator, which is exactly the kind of silent error that is invisible in the output and obvious in the arithmetic."
      - "FIXED 2026-10-26: the mapper and the mapper regression test now compute their population from dishes.status='published'. The corrected population is 122 rows = 121 published (3 of them the pilot) + 1 archived fixture; the mapper's 118 = published minus the 3 pilot dishes; technique coverage 114 of 118."
      - "REMAINING WORK: mark the fixture explicitly (a slug prefix, a flag column, or a fixture table) rather than relying on it being archived; archive it out of the active catalog; and add a standing check that no non-published dish can enter a metric population."
