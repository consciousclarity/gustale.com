  - id: GUS-239
    title: "Archive the superseded dish_translations table (the pre-ADR-003 whole-description translation model)"
    epic: "EPIC 04 — Multilingual content"
    priority: P1
    phase: 0
    status: todo
    depends_on: []
    approval: true
    notes: >
      ADR-003 replaced the old model. dish_translations held ONE row per dish
      with a whole-description `name` and `description` in a single language —
      English only, 121 rows. ADR-003 layer 3b replaced it with
      description_sentences (the English source, split per sentence, 313 rows)
      and description_sentence_translations (the per-sentence translation, with
      a source hash, an explicit status and a stale flag). ADR-003's own text
      says the prose layer must "reuse dish_translations (after GUS-239
      archive) or add description_sentence_translations" — the decision was
      taken to ADD the new table, so dish_translations is now superseded and
      must be ARCHIVED so the two cannot both be read as the truth.
      This task was MISSING from this backlog while ADR-003 referenced it —
      found and added 2026-10-29.
      Why ARCHIVE and not DELETE: the table is the record of the previous
      model, and the project's standing rule is that removal of published
      content needs Alejandro's approval — hence approval: true.
      Do this AFTER the sentence-level layer is verified, and only once the
      API no longer reads dish_translations. The API still reads it at
      apps/api/src/routes/dishes.ts:429 for the legacy name/description
      fallback, so this task is NOT yet actionable.
    acceptance:
      - "dish_translations is archived — renamed or moved out of the read path — and no API route reads it"
      - "The rename or move is a forward migration; no history rewrite"
      - "The ADR-003 report and the API reference the sentence-level model"
    evidence: []
