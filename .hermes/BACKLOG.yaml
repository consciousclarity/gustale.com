      - "Live proof 2026-10-24T15:27:51Z: gustale-api, gustale-web-recipes and gustale-web-geo all running CI-published images on commit 5044617."
      - "The VPS rebuild path sets GUSTALE_NO_PUSH=1 (scripts/hermes/build-web-live.sh), so it builds the :live-data-<short-sha> tag locally and never pushes. A local `docker push` with the repo-scoped token fails with `permission_denied: The token provided does not match expected scopes` because that token lacks `write:packages` — but nothing in the rebuild flow needs the push."
      - "No token rotation needed. Only if a VPS-side push is ever required does the token need `write:packages` added."
