packages:
  - "apps/*"
  - "packages/*"
onlyBuiltDependencies:
  - esbuild
  - sharp
allowBuilds:
  esbuild: true
  sharp: true
# pnpm 11 no longer reads the `pnpm` field in package.json — overrides
# live here (see https://pnpm.io/settings).
#
# GUS-006.b — production dependency advisories, in clusters. Each entry
# is a patch/minor bump INSIDE the range its parent already declares,
# so no parent package needs a major bump and no API surface changes.
#
# Cluster 1 — Fastify chain (merged in #107):
#   fast-uri         3.1.2 -> 3.1.9    (host confusion, SSRF, authority injection)
#   find-my-way      9.6.0 -> 9.10.0   (HTTP/2 DoS)
#   @fastify/busboy  3.2.0 -> 3.2.4    (multipart DoS)
#
# Cluster 2 — Astro chain: handled by bumping @astrojs/react itself
# (5.0.7 -> 7.1.1) rather than by overriding its transitives. That
# bump brings vite 8.3.x, devalue 6.0.3 and a newer
# @astrojs/internal-helpers in one go, and drops js-yaml and
# browserslist out of the tree entirely. Overriding vite to 7.3.7
# instead BREAKS the Astro build: astro 7.4.2 needs vite's
# transformWithOxc export, which only exists in vite 8.x.
overrides:
  # cluster 1 — Fastify chain
  fast-uri: 3.1.9
  find-my-way: 9.10.0
  "@fastify/busboy": 3.2.4

  # cluster 3 — the MinIO chain (2026-10-29)
  #
  # GHSA-qr28-fpjm-wq7f — HIGH — decode-uri-component is vulnerable to
  # a denial of service via quadratic replacement of percent-encoded
  # runs. A single unauthenticated 224 KB request can block the
  # Node.js event loop for about 20 seconds. Published 2026-10-29.
  #
  # There is a second advisory on the same package (a MODERATE,
  # exponential blow-up, patched in 0.4.3), so the tree carries both.
  #
  # WHY THE OVERRIDE AND NOT AN AUDIT EXCEPTION
  #
  # The whole chain is ONE package:
  #
  #     minio@8.0.7 -> query-string@7.1.3 -> decode-uri-component@0.2.2
  #
  # minio@8.0.7 is the newest release and pins query-string@^7.1.3
  # forever, so there is no upstream bump to take. Every PATCHED
  # decode-uri-component (0.4.0 and later) is ESM-only, while
  # query-string@7 is CommonJS and does:
  #
  #     const decodeComponent = require('decode-uri-component');
  #     ...
  #     return decodeComponent(value);
  #
  # Under Node's CJS/ESM interop, require() of an ESM module returns a
  # NAMESPACE OBJECT, not the function — so the call throws
  # "TypeError: decodeComponent is not a function". The override was
  # verified in a clean install: stringify() works, parse() throws.
  #
  # WHY THAT IS SAFE HERE
  #
  # The vulnerable decodeUriComponent() is reachable ONLY through
  # query-string's parse(), through its internal decode() helper.
  # MinIO calls query-string's STRINGIFY() and nothing else — all
  # five call sites in minio@8.0.7 (helpers.js:132,
  # internal/client.js:840, 935, 973, 1490, 2605) are stringify().
  # The parse path is unreachable from this codebase.
  #
  # The override is SCOPED to query-string rather than applied
  # globally, so if another package ever needs the CommonJS
  # decode-uri-component it keeps the unpatched-but-working one
  # rather than inheriting a broken ESM/CJS mismatch.
  #
  # VERIFIED: a clean install with this override resolves
  # decode-uri-component@0.5.1; query-string.stringify() produces the
  # correct output; minio's presignedGetObject() signs correctly and
  # reaches S3 (it fails only on deliberately fake credentials, which
  # is the expected outcome); and the live signed-URL path serves
  # images with HTTP 200.
  "query-string>decode-uri-component": 0.5.1