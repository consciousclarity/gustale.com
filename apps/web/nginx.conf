# Gustale Web — nginx config
#
# Serves the Astro static build on port 4001.
# Upstream Caddy terminates TLS and forwards here.

server {
    listen 4001;
    listen [::]:4001;
    server_name _;

    # We're behind Caddy, which terminates TLS and forwards on :4001.
    # Without these two directives, nginx's auto-redirect (e.g. /dishes
    # → /dishes/) generates a Location URL that includes ":4001" because
    # the listen port is non-standard. That breaks the user experience:
    # their browser follows a redirect to gustale.com:4001/... which
    # is a wrong port and wrong scheme (http://).
    #
    # absolute_redirect off  → use relative Location: /dishes/
    # port_in_redirect off   → even if absolute, omit the port
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Serve Astro's generated 404.html for every missing route while
    # preserving HTTP status 404. Do NOT use `=200` here — that would
    # return the custom page with a success status.
    error_page 404 /404.html;

    # Security headers (mirror Caddy's per-host config so the policy is
    # consistent whether the request hits Caddy directly or skips it)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Hashed asset bundles get a long cache; everything else is revalidated.
    location /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Favicons / static public files — moderate cache
    location ~* ^/(favicon\.(svg|ico|png|webp)|robots\.txt|sitemap.*\.xml|.*\.(png|jpg|jpeg|webp|svg|ico|woff2?))$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML pages — never cache (Astro emits per-request content; API data
    # can be inside the SSR'd HTML)
    location / {
        add_header Cache-Control "no-cache, must-revalidate";

        # Try: exact file → dir/index.html → trigger error_page 404.
        #
        # We use `$uri/index.html` (not `$uri/`) so that directory
        # requests for dirs without an index.html fall through to the
        # 404 handler. With `$uri/`, nginx's `index` directive tries
        # to serve /<dir>/index.html and 403s when missing.
        #
        # Ending in `=404` (not `/404.html`) is required so nginx keeps
        # status 404 and lets `error_page` supply the custom body.
        # Ending in `/404.html` would serve the page with status 200.
        #
        # The geo post-build additionally flattens
        # dist/dishes/<slug>/index.html → dist/dishes/<slug>.html, and
        # the rewrite below (`location ~ ^/dishes/([^/]+)$`) handles
        # both `/dishes/<slug>` and `/dishes/<slug>/` URLs.
        try_files $uri $uri/index.html =404;
    }

    # Geo-domain rewrite: serve /dishes/<slug>(/) from the flat
    # /dishes/<slug>.html file produced by post-build.mjs. The recipes
    # domain keeps the original nested structure
    # (dist/dishes/<slug>/index.html) and is unaffected by this rewrite
    # because the geo dist never contains <slug>/index.html files.
    #
    # Missing dish routes return =404 and share the same error_page
    # handler (custom /404.html body, status 404).
    #
    # Trailing-slash variant listed first so it matches before the
    # no-slash regex.
    location ~ ^/dishes/([^/.]+)/$ {
        try_files /dishes/$1.html $uri/index.html =404;
    }
    location ~ ^/dishes/([^/.]+)$ {
        try_files /dishes/$1.html $uri.html $uri/index.html =404;
    }

    # Internal target for `error_page 404 /404.html`.
    # Serves the static file body; nginx keeps the original 404 status.
    # `internal` prevents clients from requesting /404.html directly as
    # a 200 document — they still get the page via the error handler.
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # gzip on text-ish content (Caddy already encodes, but defense in depth)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
