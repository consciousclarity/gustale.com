# Gustale Web — nginx config
#
# Serves the Astro static build on port 4001.
# Upstream Caddy terminates TLS and forwards here.

server {
    listen 4001;
    listen [::]:4001;
    server_name _;

    # We're behind Caddy, which terminates TLS and forwards on :4001.
    # Without these two directives, nginx's auto-redirect (e.g. /dishes
    # → /dishes/) generates a Location URL that includes ":4001" because
    # the listen port is non-standard. That breaks the user experience:
    # their browser follows a redirect to gustale.com:4001/... which
    # is a wrong port and wrong scheme (http://).
    #
    # absolute_redirect off  → use relative Location: /dishes/
    # port_in_redirect off   → even if absolute, omit the port
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Serve Astro's generated 404.html for every missing route while
    # preserving HTTP status 404. Do NOT use `=200` here — that would
    # return the custom page with a success status.
    error_page 404 /404.html;

    # Security headers (mirror Caddy's per-host config so the policy is
    # consistent whether the request hits Caddy directly or skips it)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Hashed asset bundles get a long cache; everything else is revalidated.
    location /_astro/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # MapLibre's worker is emitted as an ES module (.mjs). nginx's
    # bundled mime.types has no .mjs entry, so the worker was served as
    # application/octet-stream and the browser refused to execute it
    # ("Worker failed to load. Check that the worker URL is correct.").
    # That broke every map on the site: MapLibre could not parse the
    # vector tiles, so the basemap never rendered at all.
    #
    # nginx checks regex locations before falling back to a plain prefix
    # match, so this wins over the /_astro/ block above even though the
    # .mjs files live under /_astro/.
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Favicons / static public files — moderate cache
    location ~* ^/(favicon\.(svg|ico|png|webp)|robots\.txt|sitemap.*\.xml|.*\.(png|jpg|jpeg|webp|svg|ico|woff2?))$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ─── THE OLD-TO-NEW PATHS ──────────────────────────────────────
    # Generated by apps/web/scripts/generate-redirect-rules.mjs from
    # apps/web/src/lib/redirects.ts. Do not hand-edit: the map is the
    # source of truth, and this script is what writes it out.
    #
    # HELD: the target does not exist yet, and a 301 to a 404 is
    # worse than no redirect at all.
    #   /lineages -> /history   (WP-C4)
    #   /family -> /families   (WP-C1)
    #   /place -> /places   (WP-C3)
    #   /regions -> /places   (WP-C3)
    #   /map -> /atlas   (WP-C1)

    # (no redirect is active on this build yet)

    # HTML pages — never cache (Astro emits per-request content; API data
    # can be inside the SSR'd HTML)
    location / {
        add_header Cache-Control "no-cache, must-revalidate";

        # Try: exact file → dir/index.html → trigger error_page 404.
        #
        # We use `$uri/index.html` (not `$uri/`) so that directory
        # requests for dirs without an index.html fall through to the
        # 404 handler. With `$uri/`, nginx's `index` directive tries
        # to serve /<dir>/index.html and 403s when missing.
        #
        # Ending in `=404` (not `/404.html`) is required so nginx keeps
        # status 404 and lets `error_page` supply the custom body.
        # Ending in `/404.html` would serve the page with status 200.
        #
        # The single build keeps Astro's nested layout
        # (dist/dishes/<slug>/index.html), which is what
        # `$uri/index.html` serves. The geo build's flat
        # dist/dishes/<slug>.html and the rewrite blocks that went with
        # it are gone -- see the note at the rewrite blocks below.
        try_files $uri $uri/index.html =404;
    }

    # THE DISH REWRITES ARE GONE.
    #
    # They used to be:
    #
    #     location ~ ^/dishes/([^/.]+)/$ { try_files /dishes/$1.html $uri/index.html =404; }
    #     location ~ ^/dishes/([^/.]+)$  { try_files /dishes/$1.html $uri.html $uri/index.html =404; }
    #
    # and they existed ONLY for the geo build's FLATTENED dist, where
    # dist/dishes/<slug>/index.html had been collapsed into
    # dist/dishes/<slug>.html so that the stripped /edit/ subdirectory
    # would not stop the directory from being a single file.
    #
    # With one build nothing is stripped, Astro's nested layout is
    # what is on disk, and `try_files $uri $uri/index.html` serves it.
    #
    # Leaving the rewrites in place would NOT break anything -- the
    # flat file would be missing, and nginx would fall through to
    # `$uri/index.html`, which is the right answer. But it would cost
    # a regex match on every dish request to arrive at the same place,
    # and it would keep a description of a layout that no longer
    # exists.
    #
    # Missing dish routes still return =404 and share the same
    # error_page handler (custom /404.html body, status 404).

    # Internal target for `error_page 404 /404.html`.
    # Serves the static file body; nginx keeps the original 404 status.
    # `internal` prevents clients from requesting /404.html directly as
    # a 200 document — they still get the page via the error handler.
    #
    # Repeat security headers with `always`: nginx clears inherited
    # add_header from the parent server{} when any add_header is set
    # in this location (error_page responses would otherwise lose them).
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # gzip on text-ish content (Caddy already encodes, but defense in depth)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
