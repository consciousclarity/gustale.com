name: CI

on:
  push:
    branches: [main]
    # Docs-only changes (markdown + .hermes/) don't change the API, web, or db
    # code — skip the entire pipeline so they don't burn CI minutes on a
    # no-op build + redeploy. The `git add -f` trick for .hermes/* keeps
    # those files committed, so `**/*.md` is the matcher that covers them.
    paths-ignore:
      - '.hermes/**'
      - '**/*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.hermes/**'
      - '**/*.md'

# Grant the GITHUB_TOKEN permissions to write to ghcr.io
permissions:
  contents: read
  packages: write

# Cancel in-progress runs for the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin pnpm via Corepack (matches packageManager field in package.json).
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  # Test against the real DATABASE_URL the app uses; the service container
  # below provides postgis/postgis:16-3.4 on 127.0.0.1:5432.
  DATABASE_URL: postgres://gustale:gustale@127.0.0.1:5432/gustale
  SESSION_SECRET: ci-session-secret-do-not-use-anywhere-real
  AUTH_SECRET: ci-auth-secret-do-not-use-anywhere-real
  # These must be set so env.ts's Zod schema passes — even though the
  # vitest integration test doesn't touch MinIO or better-auth, the
  # server boots through env validation before tests run.
  # Safe because CI never talks to a real MinIO or auth provider.
  # The .invalid TLD is RFC-2606-reserved so it can never resolve.
  MINIO_ENDPOINT: http://ci-minio.placeholder.invalid:9000
  MINIO_PORT: 9000
  MINIO_ACCESS_KEY: ci-minio-access-key-do-not-use-anywhere-real
  MINIO_SECRET_KEY: ci-minio-secret-key-do-not-use-anywhere-real
  BETTER_AUTH_SECRET: ci-better-auth-secret-do-not-use-anywhere-real
  NODE_ENV: test

jobs:
  # ─── Job 1: Lint + typecheck ───────────────────────────────────────
  lint:
    name: Lint + typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # PINNED, not floating. Astro 7.4.2 requires node >=22.23.4
          # and refuses to build otherwise:
          #   "Node.js v22.23.1 is not supported by Astro!"
          # A floating "22" drifts: the runner may resolve a 22.x
          # below the floor and the build fails on a dependency's
          # requirement rather than on anything in this repo. The
          # same version is in .nvmrc and in package.json#engines.
          node-version: "22.23.4"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (api + db)
        run: |
          pnpm --filter @gustale/db run typecheck
          pnpm --filter @gustale/api run typecheck

      # Seed-data content gate (no DB). SEED_ALLOW_ORPHANS=1 until the
      # dangling DISH_RELATIONS / DISH_LINEAGES cleanup pass — remove the
      # env once SHARED_STATE orphans are fixed so orphan refs fail PRs.
      - name: Validate seed data
        run: SEED_ALLOW_ORPHANS=1 pnpm --filter @gustale/db run validate

      - name: Lint
        run: pnpm lint
        # Root `pnpm lint` runs `biome check .` (@biomejs/biome pinned in
        # package.json). Known debt rules are parked at "warn" in
        # biome.json with a TODO to ratchet them back to "error".
        # DO NOT add `continue-on-error: true` here; that flag is what
        # made the previous stub gate silently invisible for months.

      # The migration list is written down twice — once in this workflow
      # and once in scripts/ci-migration-chain.sh — and the Nightly runs
      # the script. Two copies of one thing drift, and they HAD drifted:
      # 0034 was in the script and missing here, and 0035 was in
      # neither. A migration that is not applied is a schema that does
      # not exist, and the route that reads it returns 500.
      #
      # This check makes the two lists agree, so the next migration
      # cannot be added to one and forgotten in the other.
      - name: Validate the CI migration chain
        run: python3 scripts/validate-ci-migration-chain.py

      - name: Validate BACKLOG.yaml (strict, rejects duplicate keys)
        # The backlog lives on the private/state branch, NOT on main —
        # .hermes/ was untracked from main on 2026-10-29 because it
        # holds agent-shared state and the operations notes, and a
        # public repository is not the place for it. So on main the file
        # is usually ABSENT from the checkout, and this check has
        # nothing to validate.
        #
        # It must not fail when the file is missing: a missing file is
        # the normal state, not a broken backlog. It must still fail
        # when the file IS present and malformed, because that is the
        # bug this check exists to catch.
        run: |
          if [ -f .hermes/BACKLOG.yaml ]; then
            python3 scripts/validate-backlog.py .hermes/BACKLOG.yaml
          else
            echo "::notice::.hermes/BACKLOG.yaml is not in this checkout (it lives on private/state) — nothing to validate"
          fi
        # PyYAML silently keeps the last value when a key is duplicated at
        # the same indentation. That bit us 2026-10-17: `status: todo` from
        # the original template survived behind a later `status: done`,
        # so the file *looked* done but the YAML read back as todo.
        # This check uses a SafeLoader subclass that raises on duplicate
        # keys at any mapping. Run as a separate step so a YAML error
        # shows up as its own check failure with a clean message.

  # ─── Job 2: Tests with ephemeral Postgres ──────────────────────────
  test:
    name: Tests (vitest + postgis)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gustale
          POSTGRES_PASSWORD: gustale
          POSTGRES_DB: gustale
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data:rw,size=2g

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build db package
        run: pnpm --filter @gustale/db run build

      # GUS-006.b: the dependency audit gate. Promoted to BLOCKING at
      # `high` once pnpm audit --prod reached 0 critical / 0 high
      # (#107 closed the Fastify cluster, #108 the Astro cluster).
      # Critical was already 0 since #85/#87, so `--audit-level=high`
      # now holds BOTH severities to zero.
      #
      # `pnpm audit` (no --prod flag) is used deliberately: it covers the
      # whole tree, dev deps included, so a new HIGH in a build-time
      # package fails the PR too. The 6 moderate + 1 low that remain
      # are all below this threshold.
      #
      # To relax the gate later (e.g. while working GUS-006.c on the
      # remaining majors), set `continue-on-error: true` here and
      # update this comment -- but do not leave it silently disabled.
      - name: pnpm audit (blocking at high)
        if: always()
        run: pnpm audit --audit-level=high

      - name: Apply schema to ephemeral DB
        run: |
          # Apply the full *committed* migration chain (not a hardcoded prefix).
          # Source from `git ls-files`, NOT a filesystem glob and NOT the
          # drizzle journal — same pattern as nightly (PR #39). The journal is
          # drifted (orphans / dual 0005 / missing 0007); journal-only apply
          # would skip tables CI tests need (e.g. dish_journey_beats).
          #
          # TWO chains, and they are INTERLEAVED:
          #
          #   packages/db/drizzle/*.sql — the drizzle-kit chain. 0000 creates
          #     the base 33 tables and 0004 creates `dish_relations`.
          #   db/migrations/*.sql       — the GUS-xxx chain. These CREATE the
          #     vocabulary tables that 0000 does NOT create (dish_families,
          #     dish_cuisines, dish_traditions, dish_techniques,
          #     dish_contexts), add the `definition`/`source` columns to
          #     dish_traditions, and seed the GUS-242 reference data.
          #
          # Neither chain alone works, and a fixed alphabetical order does
          # not either: gus-014-pilot-dimensions needs `dishes` (from 0000)
          # AND `dish_relations` (from 0004).
          #
          # The order below was found empirically by
          # scripts/find_migration_order.py, which applies the files to a
          # fresh database and reports any that cannot be placed.
          set -euo pipefail
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS postgis;" \
            -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"

          mapfile -t drizzle_files < <(git ls-files 'packages/db/drizzle/*.sql' | LC_ALL=C sort)
          if [ "${#drizzle_files[@]}" -eq 0 ]; then
            echo "No committed packages/db/drizzle/*.sql migrations found" >&2
            exit 1
          fi
          for f in "${drizzle_files[@]}"; do
            echo "Applying $f"
            PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 -f "$f"
          done

          # The GUS-xxx chain, in dependency order. See the list in
          # scripts/find_migration_order.py — it is the same order.
          #
          # The GUS-242 data migrations (0015-0019) run AFTER the seed
          # steps below, because they act on the seeded catalog.
          gus_files=(
            db/migrations/gus-014-pilot-dimensions.sql
            db/migrations/gus-014-technique-fallback.sql
            db/migrations/gus-224-relations-option-b.sql
            db/migrations/gus-227-preparation-method-names.sql
            db/migrations/gus-242-seed-countries.sql
            db/migrations/gus-242-seed-country-names.sql
            db/migrations/gus-242-seed-cuisines.sql
            db/migrations/gus-242-seed-regions.sql
            db/migrations/gus-014-118-dimensions.sql
            db/migrations/gus-014-broadened-families.sql
            db/migrations/gus-014-broadened-family-corrections.sql
          )
          for f in "${gus_files[@]}"; do
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "Missing committed migration $f" >&2
              exit 1
            fi
            echo "Applying $f"
            PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Apply seed
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -f packages/db/seed-moussaka.sql \
            -f packages/db/seed-journey.sql
          # The FOUR REFERENCE DISHES are seeded in a LATER step, after
          # the GUS-242 data migrations. The reason is
          # `dish_dish_cuisines.provenance`: that column is added by
          # db/migrations/gus-242-schema-prep.sql, so a seed that writes
          # it runs BEFORE the schema has it and fails with
          #
          #     ERROR: column "provenance" of relation "dish_dish_cuisines" does not exist
          #
          # The seed file is one transaction, so that error discards the
          # dishes it had already inserted — and the failure is SILENT.
          # See the "the atlas reference dishes" step below.

      - name: Apply the GUS-242 data migrations
        run: |
          # These act on the seeded catalog, so they run AFTER the seed.
          # Each one guards itself on the presence of the data it acts on
          # and skips cleanly when that data is absent — which is the
          # case for the smaller ephemeral seed CI builds. See the CI
          # GUARD block at the top of each file.
          #
          # gus-241 and gus-242-schema-prep come first here: 241 adds the
          # `provenance` column that schema-prep's check reads, and
          # schema-prep adds the `definition`/`source` columns on
          # dish_traditions that the 0016 and 0019 migrations write.
          set -euo pipefail
          data_migrations=(
            db/migrations/gus-241-taxonomy-and-unset-dimensions.sql
            db/migrations/gus-242-schema-prep.sql
            db/migrations/0015_gus242_resync.sql
            db/migrations/0016_gus242_cuisines.sql
            db/migrations/0017_gus242_cuisine_corrections.sql
            db/migrations/0018_gus242_vocab_1f.sql
            db/migrations/0019_gus242_traditions_1e.sql
            db/migrations/0020_gus242_ingredient_categories.sql
            db/migrations/0021_adr003_vocabulary_labels.sql
            db/migrations/0022_adr003_vocabulary_labels.sql
            db/migrations/0023_adr003_dish_names.sql
            db/migrations/0024_adr003_dish_names_data.sql
            db/migrations/0025_adr002_description_sentences.sql
            db/migrations/0026_adr003_sentence_translations.sql
            db/migrations/0027_adr002_claims_model.sql
            db/migrations/0028_adr003_translation_cleanup.sql
            db/migrations/0029_adr003_cjk_script_cleanup.sql
            db/migrations/0030_adr003_clear_test_residue.sql
            db/migrations/0031_pool_a_review_sample.sql
          )
          # 0032 is NOT in this list. It asserts that every published
          # dish has a 'short' description sentence, which is only true
          # once the sentences exist — so it runs after the sentence
          # population below. In the list it failed with "3 published
          # dishes have no short description sentence": correct
          # behaviour, wrong moment.
          for f in "${data_migrations[@]}"; do
            if ! git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "Missing committed migration $f" >&2
              exit 1
            fi
            echo "Applying $f"
            PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 -f "$f"
          done

      # The API imports the schema tables from @gustale/db, which
      # resolves to packages/db/dist — the BUILT output, not the
      # source. A schema addition is therefore not complete until the
      # db package is rebuilt: the tests read a stale dist and every
      # route that touches a new table fails with
      #
      #   TypeError: Cannot read properties of undefined
      #   (reading 'Symbol(drizzle:Columns)')
      #
      # The lint job typechecks the db package, but `tsc --noEmit` does
      # not EMIT — so it does not refresh the dist the tests read.
      - name: Build db package
        run: pnpm --filter @gustale/db run build

      # The GUS-239 archive.
      #
      # It is run here, after the sentence population, because it
      # asserts the sentence coverage the API now depends on. The
      # population is idempotent-by-assertion: it refuses to append to
      # a table that already holds rows, so this is safe to re-run.
      - name: Populate the description sentences
        working-directory: .
        run: |
          python3 scripts/populate_description_sentences.py --apply --db gustale

      - name: Apply the GUS-239 archive
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -f db/migrations/0032_gus239_archive_dish_translations.sql

      # The English name for every dish that lacks one in dish_names.
      # It must run after the archive: the archive's assertion is about
      # the coverage the API now depends on, and the English name is
      # part of that coverage.
      - name: Apply the GUS-239 English names
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -f db/migrations/0033_gus239_english_names.sql

      # The FOUR REFERENCE DISHES — rendang, chicken-tikka-masala,
      # tacos-al-pastor and falafel — with the EXACT legacy shape they
      # have on live.
      #
      # This seed is what makes the backfill testable. Without it the CI
      # database holds three dishes and the backfill produces five
      # associations, so `ATLAS_BACKFILL_OK=1` proves only that
      # migration 0037 EXECUTES on a nearly-empty database — a backfill
      # that produced ZERO associations would have passed the same
      # gate.
      #
      # WHERE IT RUNS, AND WHY
      #
      # It runs HERE — after the GUS-242 data migrations, after the
      # sentence population, and after 0032 and 0033 — for two reasons,
      # each of which cost a build:
      #
      #   1. `dish_dish_cuisines.provenance` is added by
      #      db/migrations/gus-242-schema-prep.sql. Seeded before it, the
      #      seed fails with "column provenance of relation
      #      dish_dish_cuisines does not exist", and — being one
      #      transaction — that discards the four dishes it had already
      #      inserted. The failure is SILENT.
      #
      #   2. 0032 asserts that every PUBLISHED dish has a `dish_names`
      #      row and a 'short' description sentence. Seeded before 0032,
      #      the four new published dishes break that assertion and 0032
      #      fails.
      #
      # The per-dish assertions caught every one of these misorderings.
      # That is what they are for.
      - name: Apply the atlas reference dishes
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -f packages/db/seed-atlas-references.sql

      # 0034 fixes the one corrupted row in the 1e traditions load — a row
      # whose Wikidata Q-id is for Algerian cuisine but which carried
      # Tunisian text. It is a rename, so it must run AFTER the traditions
      # exist (0019), which they do by this point in the chain.
      #
      # It was missing here too, which is the same drift class this PR is
      # about: the workflow's migration list and the chain script's list
      # are two copies of the same thing, and they had already diverged.
      - name: Apply the corrupted-tradition fix
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -f db/migrations/0034_gus242_fix_corrupted_tradition.sql

      # `categories.kind` — the column that was in the LIVE database since
      # 2026-06-25 but in no committed migration (it was authored on the
      # archived branch `feat-taxonomy-foundation` and applied to live
      # from there).
      #
      # WITHOUT THIS STEP THE CI DATABASE HAS NO SUCH COLUMN, and
      # `GET /api/dishes` returns 500 — because the query reads
      # `c.kind`:
      #
      #     ERROR: column c.kind does not exist
      #
      # The live site works only because the live database has the
      # column; every freshly built environment was broken. The
      # regression test is apps/api/test/dishes-list.test.ts, and
      # scripts/ci-migration-chain.sh applies the same migration.
      #
      # It is idempotent (ADD COLUMN IF NOT EXISTS), so this is safe on
      # live too, where it is a no-op.
      - name: Apply the categories.kind column
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -f db/migrations/0035_categories_kind.sql

      # 0036 is ADR-004's additive schema: the three evidence axes on
      # `statements`, `claim_dates`, `dish_place_associations`, the
      # relation_types vocabulary, the normalized-pair index, the cycle
      # triggers, and the two identity tables.
      #
      # It is additive — nothing is dropped, renamed or retyped — and
      # idempotent, so it is safe on live (where it creates only what does
      # not exist) and safe to re-run.
      #
      # The constraint tests come immediately after, because a schema that
      # exists but does not hold is worse than no schema.
      - name: Apply the ADR-004 atlas schema
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -f db/migrations/0036_atlas_schema.sql

      - name: Test the ADR-004 atlas constraints
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -f scripts/test_atlas_schema.sql

      # 0037 is the P2 backfill: the legacy places & traditions data moves
      # into dish_place_associations, and what cannot be decided goes to
      # the editorial queue rather than being guessed.
      #
      # It is RESTARTABLE (every insert is ON CONFLICT DO NOTHING) and
      # REVERSIBLE (every row it creates carries a legacy provenance, so
      # one DELETE removes exactly what it created).
      #
      # The migration asserts its own outcome — every count against the
      # legacy tables — and refuses to be trusted if the numbers differ.
      - name: Apply the ADR-004 atlas backfill
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -f db/migrations/0037_atlas_backfill.sql

      # 0038 is the publish credential. The `verified` and `published`
      # transitions used to be guarded by a NAME check — an actor
      # matching `%agent%` or `%hermes%` was refused — which passes
      # every other name. The rule is now positive: the actor must HOLD
      # a verified `publish_credential` row, and the default is deny.
      #
      # Additive and idempotent: one table, one function.
      - name: Apply the publish credential
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -f db/migrations/0038_publish_credential.sql

      # The constraint tests AGAIN, now with the D9 publish-credential
      # cases: an unknown actor is refused, a NULL actor is refused, an
      # unverified credential is refused, a credential for an account
      # that does not exist is refused, an editor may verify but not
      # publish, a publisher may publish, and the machine's own
      # transitions need no credential.
      - name: Test the publish credential constraints
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -f scripts/test_atlas_schema.sql

      # 0039 queues the journey places that produced NO association.
      #
      # The backfill read the legacy origin, cuisine and tradition
      # fields. It did not read `dish_journey_beats` — so a place named
      # only in a dish's journey produced no association and was
      # SILENTLY DROPPED. On live that is 30 of 35 journey beats across
      # all 12 dishes that have them.
      #
      # 0039 puts every one of them in the editorial queue, where a
      # reviewer decides. It creates no association and decides nothing.
      - name: Apply the journey place queue
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -f db/migrations/0039_journey_place_queue.sql

      # The PER-DISH backfill assertions. LAST, because they assert the
      # state the whole chain produces: the reference dishes'
      # association rows AND the journey places in the editorial queue.
      #
      # 0037 asserts its outcome in AGGREGATE: the counts against the
      # legacy tables. Both sides of that comparison come from the same
      # tables, so a mapping that is wrong in the same way on both sides
      # PASSES. On a database with three dishes it proved only that the
      # migration executes.
      #
      # This asserts the EXACT association rows the four reference
      # dishes must have — the relationship type, the entity kind, the
      # entity and the provenance — plus the count-snapshot guard with
      # NON-ZERO baselines. A backfill that produced nothing fails it.
      - name: Assert the atlas backfill per dish
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 \
            -f scripts/test_atlas_backfill.sql

      - name: Run vitest
        working-directory: apps/api
        run: pnpm test -- --reporter=verbose

  # ─── Job 3: Docker build smoke test ────────────────────────────────
  build:
    name: Docker build (gustale-api)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test]  # only build once code passes
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"



      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: We deliberately do NOT wait for the live API here. GHA runner
      # IPs are firewall-blocked from the VPS, so api.gustale.recipes is not
      # reachable from CI (see apps/web/Dockerfile for the same reason the web
      # build uses a local mock). Building the API image does not depend on the
      # live API at all, so gating the build on its reachability only added
      # flaky failures that skipped deploy. Removed.
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: ghcr.io/${{ github.repository }}/gustale-api:latest,ghcr.io/${{ github.repository }}/gustale-api:${{ github.sha }}
          push: true
          # GHA layer cache. The Dockerfile splits COPY so the install
          # layer's cache key depends only on pnpm-lock.yaml + the
          # workspace package.json files (not on every source file).
          # On a typical PR where only source changes, the install +
          # node_modules layers reuse the previous push's cache.
          # mode=max caches every layer (not just the final one);
          # gustale's three images are well under the 10GB/repo quota.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ─── Job 3b+3c: Docker build for both web domains ─────────────────
  # recipes variant → gustale-web-recipes (serves gustale.recipes)
  # geo variant     → gustale-web-geo     (serves gustale.com)
  # Both use the same Dockerfile; only PUBLIC_DOMAIN and the image
  # tag differ. Matrix runs both legs in parallel; failure of one leg
  # does not block the other.
  build-web:
    name: Docker build (gustale-web-${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint, test]  # only build once code passes
    strategy:
      fail-fast: false  # let the other domain's build finish even if one fails
      matrix:
        include:
          - domain: recipes
            image:  recipes
          - domain: geo
            image:  geo
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }} variant
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            PUBLIC_DOMAIN=${{ matrix.domain }}
            PUBLIC_API_BASE=https://api.gustale.recipes
            PUBLIC_CARTO_API_KEY=${{ secrets.CARTO_BASEMAP_API_KEY }}
          tags: >-
            ghcr.io/${{ github.repository }}/gustale-web-${{ matrix.image }}:latest,
            ghcr.io/${{ github.repository }}/gustale-web-${{ matrix.image }}:${{ github.sha }}
          push: true
          # GHA layer cache (see the api job above for the rationale).
          # The web Dockerfile uses the same COPY-split pattern.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ─── Job 4: Deploy to Hostinger VPS ────────────────────────────────
  deploy:
      name: Deploy to Hostinger
      runs-on: ubuntu-24.04
      # The web build bakes a static page per published dish and fetches
      # each from the API. That was under a minute at 31 dishes and is
      # over nine minutes at 621, which does not fit in 15 alongside the
      # image pulls, the API swap and the verification. The job was
      # being killed with the API swapped and the web containers still
      # on the old build.
      timeout-minutes: 45
      needs: [build, build-web]  # api + both web variants must be built and pushed first
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      # The workflow-level concurrency uses cancel-in-progress: true, which
      # is right for the build/test jobs — a cancelled run costs nothing.
      #
      # It is WRONG for the deploy. Cancelling the GitHub job does NOT stop
      # the VPS-side script: appleboy/ssh-action has already handed the
      # script to a remote shell, and that shell keeps going. So a cancelled
      # deploy leaves the VPS mid-swap — API replaced, web containers not —
      # while the NEXT run starts a second, concurrent deploy against the
      # same three containers.
      #
      # The two interleaved swaps are what "Real verify" check 2 catches
      # (a container left on the previous SHA). The deploy log comment in
      # this file already warned about the same hazard for the shared
      # /tmp log.
      #
      # So: the deploy gets its OWN concurrency group, with
      # cancel-in-progress: false. A new push QUEUES behind the running
      # deploy rather than cancelling it. The deploy is idempotent and
      # quick, and a queued deploy is strictly better than two interleaved
      # ones.
      concurrency:
        group: deploy-hostinger
        cancel-in-progress: false
      env:
        # Define on the runner so the action can read them. The action's
        # `envs:` (under `with:`) is the allow-list forwarded to the remote
        # script via SSH.
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        # HOME for the deploy SSH user. The appleboy/ssh-action's
        # drone-ssh binary does not always forward HOME correctly, so
        # we set it explicitly. Default /home/hermes, override via the
        # GUSTALE_SSH_HOME repo variable.
        HOME: ${{ vars.GUSTALE_SSH_HOME || '/home/hermes' }}
      steps:
        # Always notify (success or failure). The notify step is wrapped
        # in `if: always()` and runs regardless of deploy outcome.
        - name: Deploy via SSH
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.HOSTINGER_HOST }}
            username: ${{ secrets.HOSTINGER_USER }}
            key: ${{ secrets.HOSTINGER_SSH_KEY }}
            # The web build bakes a static page for EVERY published dish,
            # and it fetches each one from the API. At 31 dishes that took
            # well under a minute; at 621 it takes over nine, and the
            # build was being killed by the timeout with the API already
            # swapped and the web containers still on the old build.
            #
            # 30 minutes leaves room for the page count to grow again.
            # The build is idempotent, so a re-run is cheap.
            command_timeout: 30m
            # Forward the env vars declared in `env:` to the remote script.
            envs: GITHUB_TOKEN,GITHUB_ACTOR,GITHUB_RUN_ID,HOME
            script: |
              set -euo pipefail
              REPO="ghcr.io/${{ github.repository }}"
              API_IMAGE="$REPO/gustale-api:${{ github.sha }}"
              BUILD_DIR="${{ vars.GUSTALE_BUILD_DIR || '/home/deploy/gustale-build' }}"
              SHA="${{ github.sha }}"
              SHORT_SHA="${SHA:0:7}"
              TAG="live-data-${SHORT_SHA}"
              # The tag file MUST be a per-run mktemp path, and it MUST be
              # passed to build-web-live.sh via GUSTALE_WEB_LIVE_TAG_FILE.
              #
              # GUS-229 (commit e454a7f) changed build-web-live.sh to make
              # its own mktemp tag file, because the fixed path was a
              # single point of failure (a root-owned leftover made the
              # final 'rm -f' fail under 'set -e' and aborted the deploy
              # before the swap). But the deploy here still pointed at the
              # OLD FIXED PATH and never handed the path to the script.
              #
              # So the script wrote the correct tag to its own mktemp
              # file, and the deploy then 'source'd the stale fixed path —
              # a leftover from 2026-10-26. The deploy then looked for an
              # image tagged with that stale SHA, which does not exist,
              # and aborted with "Image ... not present locally" BEFORE
              # swapping any container. The site stayed on the 2026-10-26
              # images ever since.
              #
              # Per-run mktemp + explicitly passing the path keeps both
              # properties: no fixed path to collide on, and the deploy
              # reads exactly what the script wrote.
              TAG_FILE="$(mktemp /tmp/gustale-web-live-tag.XXXXXX.env)"
              export GUSTALE_WEB_LIVE_TAG_FILE="$TAG_FILE"
              # Per-run log file: include the run ID so concurrent deploys
              # (rare but possible) don't trample each other, and so a
              # failed run's log is preserved for the verify step. NEVER
              # use a shared /tmp/gustale-deploy.log — it gets clobbered
              # by overlapping runs and stale state.
              DEPLOY_LOG="/tmp/gustale-deploy-${GITHUB_RUN_ID}.log"
              : > "$DEPLOY_LOG"
              _DEPLOY_EXIT=0
              trap '_LAST_CMD=${BASH_COMMAND}; rc=$?; if [ $rc -ne 0 ] && [ "$_DEPLOY_EXIT" = "0" ]; then _DEPLOY_EXIT=$rc; echo "DEPLOY_FAILED_AT=${_LAST_CMD} (rc=$rc)" >> "$DEPLOY_LOG"; fi' ERR
              trap 'echo "DEPLOY_EXIT_CODE=${_DEPLOY_EXIT}" >> "$DEPLOY_LOG"; exit "$_DEPLOY_EXIT"' EXIT

              # --- Deploy lock ------------------------------------------------
              # A VPS-side lock, so that two deploys can never interleave
              # their container swaps.
              #
              # The GitHub-side concurrency group (deploy-hostinger,
              # cancel-in-progress: false) prevents a new run from
              # starting while another is queued — but it CANNOT stop a
              # deploy whose GitHub job was already cancelled, because
              # appleboy/ssh-action hands the script to a remote shell
              # that keeps running after the job is killed.
              #
              # Two interleaved deploys are exactly what breaks the
              # "Real verify" image check: one run swaps the API, the
              # other swaps the web containers, and each run then finds
              # a container on the OTHER run's SHA.
              #
              # flock with a timeout: a deploy waits up to 15 minutes for
              # the previous one to finish, and fails loudly rather than
              # proceeding into a concurrent swap.
              DEPLOY_LOCK="/tmp/gustale-deploy.lock"
              exec 9>"$DEPLOY_LOCK"
              echo "--- Acquiring the deploy lock ($DEPLOY_LOCK) ---"
              if ! flock -w 900 9; then
                echo "::error::Could not acquire the deploy lock in 900s - another deploy is still running. Aborting without touching the containers."
                echo "DEPLOY_FAILED_AT=deploy lock timeout" >> "$DEPLOY_LOG"
                exit 1
              fi
              echo "--- Deploy lock acquired ---"

              # deploy_container must be DEFINED BEFORE FIRST USE.
              # PR #79's script called it at "Step 3" ~80 lines before the
              # definition, so the deploy died with
              # `bash: line 84: deploy_container: command not found` and the
              # API was never swapped (caught by Real verify). Keep the
              # definition here, immediately after the traps.
              deploy_container() {
                local NAME="$1"
                local IMAGE="$2"
                local HOST_PORT="$3"
                local CONTAINER_PORT="${4:-$3}"
                local EXTRA_ARGS="${5:-}"
                echo "--- Deploying $NAME from $IMAGE on ${HOST_PORT}:${CONTAINER_PORT} ---"
                docker stop "$NAME" 2>/dev/null || true
                docker rm   "$NAME" 2>/dev/null || true
                # shellcheck disable=SC2086
                docker run -d --name "$NAME" --restart unless-stopped \
                  -p "${HOST_PORT}:${CONTAINER_PORT}" $EXTRA_ARGS \
                  "$IMAGE"
              }

              # gustale-api needs /root/.env for DB / MinIO / auth secrets.
              # gustale-web-{recipes,geo} are pure static; no env-file needed.
              #
              # IMPORTANT: gustale-api runs with --network host because
              # shared-postgres and shared-minio are bound to 127.0.0.1
              # on the VPS host. From inside a container on the default
              # bridge, 127.0.0.1 is the container's own loopback — NOT
              # the host. --network host puts the container in the host's
              # network namespace so 127.0.0.1 resolves correctly.
              #
              # Port mapping:
              #   gustale-api           → host:4000 → container:4000
              #   gustale-web-recipes   → host:4001 → container:4001
              #   gustale-web-geo       → host:4002 → container:4001
              # Both web containers listen on the same internal port (4001);
              # the host-side port differs so they don't collide. Caddy
              # routes gustale.recipes → :4001 and gustale.com → :4002.

              echo "=== Gustale deploy run $GITHUB_RUN_ID at SHA=$SHORT_SHA ==="
              echo "    run_id:    $GITHUB_RUN_ID"
              echo "    api_image: $API_IMAGE"
              echo "    build_dir: $BUILD_DIR"
              echo "    log_file:  $DEPLOY_LOG"

              # --- Login to ghcr.io using the GHA-issued token ---
              # The workflow has top-level `permissions: contents: read,
              # packages: write`, so the auto-issued $GITHUB_TOKEN is
              # sufficient to push/pull from consciousclarity/gustale.com/*.
              if [ -n "$GITHUB_TOKEN" ]; then
                echo "--- Logging into ghcr.io with GITHUB_TOKEN (auto-issued workflow token) ---"
                echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR:-consciousclarity}" --password-stdin
              else
                echo "::error::GITHUB_TOKEN is not set — deploy cannot authenticate to ghcr.io"
                echo "DEPLOY_FAILED_AT=auth missing" >> "$DEPLOY_LOG"
                exit 1
              fi

              # --- Step 1: pull the API image (GHA-built, data-only) ---
              echo "--- Pulling API image: $API_IMAGE ---"
              docker pull "$API_IMAGE"

              # --- Step 2: ensure the VPS build checkout is on the deploy SHA ---
              # The build dir is /home/deploy/gustale-build/ — a persistent
              # clone dedicated to the deploy, NEVER the working folder.
              # This keeps the build context isolated from any in-progress
              # work and avoids surprises when /home/hermes/projects/gustale.com
              # has uncommitted changes.

              # The dir is owned by root (chown to the deploy user) so the
              # deploy can do `git fetch` and `git checkout` without sudo.
              echo "--- Updating build checkout $BUILD_DIR to $SHA ---"
              if [ ! -d "$BUILD_DIR/.git" ]; then
                echo "::error::Build dir $BUILD_DIR is not a git checkout. Initialise it:  cd $BUILD_DIR && git init && git remote add origin github-gustale:consciousclarity/gustale.com.git && git fetch --depth=50 origin main && git checkout origin/main"
                echo "DEPLOY_FAILED_AT=build_dir missing" >> "$DEPLOY_LOG"
                exit 1
              fi
              # git safe.directory: only needed if the build dir is owned
              # by a user other than the deploy SSH user. With chown root,
              # this is a no-op; we set it defensively for setup variants.
              git config --global --add safe.directory "$BUILD_DIR" 2>/dev/null || true
              git -C "$BUILD_DIR" fetch --no-tags --depth=50 origin "$SHA"
              git -C "$BUILD_DIR" checkout --quiet --force "$SHA"
              git -C "$BUILD_DIR" log -1 --format="%H %s" HEAD

              # --- Step 3: deploy the new API image FIRST + healthcheck ---
              # Order matters: the web build that follows fetches from the
              # live API at http://127.0.0.1:4000, so the new API must be
              # serving before we build. We build the web images AFTER
              # the API is up, not in parallel.
              #
              # The GHA `build-web` job (separate, runs in parallel with
              # `build`) still produces the web images, but with the *live
              # API at GHA build time* — which is the previous API on the
              # VPS. We re-do the build locally against the freshly-deployed
              # API and use the local images for the web swap. The GHA-built
              # images are kept in the registry as a smoke-test artifact
              # (build still succeeds end-to-end) but not pulled here.
              echo "--- Deploying new API first so the web build can use it ---"
              deploy_container "gustale-api" "$API_IMAGE" "4000" "4000" "--network host --env-file /root/.env"

              # Wait for the new API to pass its healthcheck before building
              # the web images against it. The container has a `HEALTHCHECK
              # CMD wget -q --spider http://localhost:4000/health || exit 1`
              # baked into the image; we poll up to 60s.
              echo "--- Waiting for gustale-api to be healthy ---"
              for i in $(seq 1 30); do
                STATUS=$(docker inspect --format='{{.State.Health.Status}}' gustale-api 2>/dev/null || echo "missing")
                if [ "$STATUS" = "healthy" ]; then
                  echo "  gustale-api is healthy after ${i} polls (~$((i * 2))s)"
                  break
                fi
                sleep 2
              done
              if [ "$STATUS" != "healthy" ]; then
                echo "::error::gustale-api did not become healthy within 60s. Last 30 log lines:"
                docker logs --tail 30 gustale-api 2>&1 || true
                echo "DEPLOY_FAILED_AT=api unhealthy" >> "$DEPLOY_LOG"
                exit 1
              fi

              # Smoke-test the live API one more time at the public hostname
              # (the healthcheck above only confirms the local port; the
              # hostname hop exercises the Caddy route too).
              echo "--- Confirming https://api.gustale.com/health ---"
              if ! curl -fsS --max-time 10 "https://api.gustale.com/health" >/dev/null; then
                echo "::error::api.gustale.com/health did not return 200; aborting before web build"
                echo "DEPLOY_FAILED_AT=api health public" >> "$DEPLOY_LOG"
                exit 1
              fi

              # --- Step 4: build the web images with the NEW API live ---
              # `build-web-live.sh` does `BUILD_DATA_SOURCE=live` and
              # fetches from http://127.0.0.1:4000, which is now the
              # newly-deployed API. The build bakes the new publicUrl /
              # variantsUrls / variants shape into the static HTML.
              #
              # `GUSTALE_NO_PUSH=1` is required: the deploy SSH step is
              # not authorised to push to ghcr (the `packages:write` scope
              # isn't on the workflow token, and pushing from the VPS has
              # been failing with `permission_denied` since the token
              # scope audit). The local image is what the deploy
              # actually uses; we just tag it with the live-data-* name
              # so the verify step's `docker image inspect` resolves.
              echo "--- Running build-web-live.sh at SHA=$SHA from $BUILD_DIR (against new API, no push) ---"
              ( cd "$BUILD_DIR" && GUSTALE_NO_PUSH=1 GUSTALE_WEB_LIVE_TAG_FILE="$TAG_FILE" ./scripts/hermes/build-web-live.sh "$SHA" ) || {
                echo "::error::build-web-live.sh failed; gustale-api already swapped (rollback path needed) — see DEPLOY_LOG"
                echo "DEPLOY_FAILED_AT=build-web-live" >> "$DEPLOY_LOG"
                exit 1
              }

              # The script writes TAG / IMAGE_RECIPES / IMAGE_GEO to $TAG_FILE.
              # shellcheck disable=SC1090
              source "$TAG_FILE"
              : "${IMAGE_RECIPES:?build-web-live.sh did not write IMAGE_RECIPES}"
              : "${IMAGE_GEO:?build-web-live.sh did not write IMAGE_GEO}"

              # The tag the script wrote MUST be the tag this run asked
              # for. A mismatch means the deploy read a stale file, which
              # is exactly the failure this whole change exists to
              # prevent — so fail loudly rather than swapping containers
              # against the wrong image.
              if [ "${TAG:-}" != "live-data-${SHORT_SHA}" ]; then
                echo "::error::Tag mismatch: build-web-live.sh wrote TAG='${TAG:-}' but this run expected 'live-data-${SHORT_SHA}'. Aborting before any container swap."
                echo "DEPLOY_FAILED_AT=tag mismatch (got '${TAG:-}', expected 'live-data-${SHORT_SHA}')" >> "$DEPLOY_LOG"
                exit 1
              fi
              echo "--- Tag confirmed: $TAG ---"
              WEB_RECIPES_IMAGE="$IMAGE_RECIPES"
              WEB_GEO_IMAGE="$IMAGE_GEO"

              # The local rebuild just produced the images and pushed them
              # nowhere (GUSTALE_NO_PUSH=1 default). Tag them as :latest
              # locally so `docker image inspect` resolves the same way
              # the live data was built for.
              echo "--- Tagging local web images as live-data ---"
              docker tag "$WEB_RECIPES_IMAGE" "gustale-web-recipes:live-data-$SHORT_SHA" 2>/dev/null || true
              docker tag "$WEB_GEO_IMAGE"     "gustale-web-geo:live-data-$SHORT_SHA"      2>/dev/null || true

              # Verify ALL THREE images are present locally before destroying
              # any running container.
              echo "--- Verifying all images are present locally ---"
              for IMG in "$API_IMAGE" "$WEB_RECIPES_IMAGE" "$WEB_GEO_IMAGE"; do
                if ! docker image inspect "$IMG" >/dev/null 2>&1; then
                  echo "::error::Image $IMG not present locally — aborting deploy to keep old containers running"
                  echo "DEPLOY_FAILED_AT=image missing: $IMG" >> "$DEPLOY_LOG"
                  exit 1
                fi
              done

              # --- Step 5: swap the WEB containers only ---
              # The API was already deployed + health-checked at Step 3 —
              # do NOT redeploy it here (a second stop/start would be a
              # needless API outage mid-deploy). deploy_container() is
              # defined at the top of this script, before first use.
              deploy_container "gustale-web-recipes" "$WEB_RECIPES_IMAGE" "4001" "4001"
              deploy_container "gustale-web-geo"     "$WEB_GEO_IMAGE"     "4002" "4001"

              echo "--- Waiting 10s for containers to boot + healthcheck ---"
              sleep 10

              echo "--- Verifying ALL containers are Up + healthy ---"
              FAILED=0
              for NAME in gustale-api gustale-web-recipes gustale-web-geo; do
                STATUS=$(docker inspect --format='{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' "$NAME" 2>/dev/null || echo "MISSING")
                echo "  $NAME status: $STATUS"
                if [ "$STATUS" != "running healthy" ] && [ "$STATUS" != "running  healthy" ]; then
                  echo "::error::$NAME is not running+healthy. Last 30 log lines:"
                  docker logs --tail 30 "$NAME" 2>&1 || true
                  echo "DEPLOY_FAILED_AT=$NAME status=$STATUS" >> "$DEPLOY_LOG"
                  FAILED=1
                fi
              done
              if [ "$FAILED" = "1" ]; then
                exit 1
              fi

              echo "--- Pruning old images ---"
              docker image prune -f

              echo "--- Deploy OK ---"
              echo 0 > /tmp/deploy_exit

        # ── Real verify ──────────────────────────────────────────────
        # The appleboy/ssh-action has a known issue where the inner
        # script's exit code does not always propagate to the step's
        # outcome (it can report success on a script that failed).
        # We work around that with a real, multi-check verify step:

        #   1. Read /tmp/gustale-deploy-${GITHUB_RUN_ID}.log and
        #      require DEPLOY_EXIT_CODE=0 + no DEPLOY_FAILED_AT line.
        #   2. SSH in again, `docker inspect` all 3 running containers
        #      and require their Image references match the deploy SHA.
        #      If a container is still on the previous SHA, the deploy
        #      was partial.
        #   3. curl https://gustale.com/dishes/bakso/ and require that
        #      the rendered longDescription contains a known phrase
        #      (a fixed substring of the live API's content). If it's
        #      null/empty/placeholder, the live data didn't make it.

        # Any of those failing fails the job.
        - name: Real verify
          if: always()
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.HOSTINGER_HOST }}
            username: ${{ secrets.HOSTINGER_USER }}
            key: ${{ secrets.HOSTINGER_SSH_KEY }}
            command_timeout: 2m
            envs: GITHUB_RUN_ID,HOME
            script: |
              set -euo pipefail
              export HOME="${{ vars.GUSTALE_SSH_HOME || '/home/hermes' }}"

              DEPLOY_LOG="/tmp/gustale-deploy-${GITHUB_RUN_ID}.log"
              SHA="${{ github.sha }}"
              SHORT_SHA="${SHA:0:7}"
              FAILED=0
              echo "--- Check 1: deploy log ---"
              if [ ! -f "$DEPLOY_LOG" ]; then
                echo "::error::Deploy log $DEPLOY_LOG not found. The deploy step did not write a log file."
                FAILED=1
              else
                echo "--- $DEPLOY_LOG ---"
                cat "$DEPLOY_LOG"
                echo "--- end ---"
                if grep -qE "^DEPLOY_FAILED_AT=" "$DEPLOY_LOG"; then
                  FAILED_AT=$(grep -E "^DEPLOY_FAILED_AT=" "$DEPLOY_LOG" | head -1)
                  echo "::error::Deploy reported failure: $FAILED_AT"
                  FAILED=1
                fi
                if ! grep -qE "^DEPLOY_EXIT_CODE=0$" "$DEPLOY_LOG"; then
                  echo "::error::Deploy did not report DEPLOY_EXIT_CODE=0"
                  FAILED=1
                fi
              fi

              # --- Check 2: docker inspect — all 3 containers on the deploy SHA ---
              # The deploy uses tag-based pulls. The API image is tagged
              # with the FULL SHA (per `API_IMAGE="$REPO/gustale-api:${{ github.sha }}"`
              # above); the web images are tagged with `live-data-<short-sha>`.
              # We match on the trailing short tag in the image reference,
              # and for the API image we additionally require the full SHA
              # substring as a safety check.
              echo ""
              echo "--- Check 2: docker inspect SHA ---"
              EXPECTED_API="gustale-api:${SHA}"  # full SHA
              EXPECTED_RECIPES="gustale-web-recipes:live-data-${SHORT_SHA}"
              EXPECTED_GEO="gustale-web-geo:live-data-${SHORT_SHA}"

              # Diagnostic dump first: if a container is on the wrong SHA,
              # the operator needs to see WHAT it is actually running and
              # what else is on the box, not just a mismatch line. This is
              # the difference between a 30-second diagnosis and a
              # 30-minute guess.
              echo "--- container/image inventory ---"
              docker ps -a --format '  {{.Names}}\t{{.Image}}\t{{.Status}}' 2>&1 || true
              echo "--- gustale-* images present locally ---"
              docker images --format '  {{.Repository}}:{{.Tag}}\t{{.CreatedSince}}' 2>&1 \
                | grep -E 'gustale-(api|web)' || echo "  (none)"

              for ENTRY in "gustale-api:${EXPECTED_API}" "gustale-web-recipes:${EXPECTED_RECIPES}" "gustale-web-geo:${EXPECTED_GEO}"; do
                NAME="${ENTRY%%:*}"
                EXPECT_SUFFIX="${ENTRY#*:}"
                if ! docker inspect "$NAME" >/dev/null 2>&1; then
                  echo "::error::Container $NAME is missing"
                  FAILED=1
                  continue
                fi
                IMAGE=$(docker inspect --format='{{.Config.Image}}' "$NAME" 2>/dev/null)
                case "$IMAGE" in
                  *"$EXPECT_SUFFIX")
                    echo "  $NAME: image=$IMAGE  OK"
                    ;;
                  *)
                    echo "::error::$NAME: image=$IMAGE  expected suffix '$EXPECT_SUFFIX'"
                    echo "::error::$NAME expected tag: $EXPECT_SUFFIX"
                    echo "::error::$NAME actual   tag: ${IMAGE##*:}"
                    echo "::error::$NAME actual  image: $IMAGE"
                    FAILED=1
                    ;;
                esac
              done

              # --- Check 3: live page renders the longDescription ---
              # The phrase is a fixed substring of the bakso long
              # description as it exists in the live API. If the
              # static page is on the mock-data build, the longDescription
              # field is null/empty and the substring won't appear.
              echo ""
              echo "--- Check 3: live page phrase ---"
              PHRASE="Indonesian meatball"  # from the bakso longDescription
              PAGE=$(curl -fsS --max-time 10 "https://gustale.com/dishes/bakso/" 2>&1) || {
                echo "::error::curl https://gustale.com/dishes/bakso/ failed"
                FAILED=1
              }
              if [ -n "${PAGE:-}" ] && echo "$PAGE" | grep -qF "$PHRASE"; then
                echo "  gustale.com/dishes/bakso/ contains '$PHRASE'  OK"
              else
                echo "::error::gustale.com/dishes/bakso/ does not contain '$PHRASE' (live data not on the page)"
                FAILED=1
              fi

              if [ "$FAILED" = "1" ]; then
                echo ""
                echo "::error::Real verify FAILED for run $GITHUB_RUN_ID at SHA $SHORT_SHA"
                exit 1
              fi
              echo ""
              echo "=== Real verify OK for run $GITHUB_RUN_ID at SHA $SHORT_SHA ==="

        # ── Post-deploy notification ──────────────────────────────────
        # Runs always (success + failure) and posts a Telegram message.
        # Silently no-ops if TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is unset.
        - name: Notify Telegram (deploy outcome)
          if: always()
          run: |
            SHORT_SHA="${GITHUB_SHA::8}"
            REPO_NAME="${{ github.repository }}"
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ "${{ job.status }}" = "success" ]; then
              EMOJI="✅"
              HEAD="Deploy OK"
            else
              EMOJI="❌"
              HEAD="Deploy FAILED"
            fi
            # Single-line message. Multi-line YAML strings end up as
            # one bash line via `\<newline>` line continuation, which
            # breaks the `MSG="..."` literal (the closing `"` is far
            # from the opening `"`, the `<spaces>` from YAML indentation
            # end up after the closing `"`, and the `if` on the next
            # line gets joined as a continuation). All of that produces
            # 'unexpected EOF while looking for matching `"' and the
            # whole step exits 2. Keep the message one line.
            MSG="${EMOJI} *${HEAD}* Repo: \`${REPO_NAME}\` Commit: \`${SHORT_SHA}\` Branch: \`${{ github.ref_name }}\` Author: ${{ github.actor }} View run: ${RUN_URL}"

            if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
              echo "::notice::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set — skipping Telegram notification (deploy ${{ job.status }})"
              echo "To enable: add both secrets in GitHub repo Settings → Secrets and variables → Actions"
              exit 0
            fi

            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \\
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \\
              -d parse_mode="Markdown" \\
              -d disable_web_page_preview=true \\
              --data-urlencode "text=${MSG}" \\
              --max-time 10 || echo "::warning::Telegram notification failed (non-fatal)"
