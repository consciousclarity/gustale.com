name: Live approval

# The live-approval gate: a PR that touches the live database may merge
# only with the approved-live label, applied by the owner.
#
# It runs on pull_request_target, so the workflow AND the gate script
# come from the BASE branch: a PR cannot weaken the gate that judges it.
# The label events are included so applying or removing approved-live
# re-runs the gate. No paths-ignore: a required check that does not run
# would leave the PR waiting forever.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: live-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # A PR that touches the live database's schema or data may not be
  # merged until Alejandro has explicitly approved that PR for live.
  #
  # It must be a REQUIRED status check, so it is its own job. It has no
  # database and no build: it reads the diff and the PR's label
  # timeline, and that is all.
  live-approval:
    name: Live approval gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # THIS JOB MUST RUN FROM THE BASE BRANCH.
    #
    # It used to run on `pull_request`, which checks out the PR's OWN
    # code. That made the gate self-defeating: the gate script lives in
    # the repo, so a PR that touches db/migrations/ could also edit
    # scripts/check-live-approval.sh in the same diff, and CI would run
    # the PR's weakened gate against the PR. The check that decides
    # whether a migration may be merged was, in that case, written by
    # the thing it was checking.
    #
    # `pull_request_target` runs the workflow from the BASE branch and
    # gives the base's copy of the script, so the PR cannot weaken the
    # gate that judges it.
    #
    # The token for `pull_request_target` is a powerful one, so this
    # job deliberately does NOT check out the PR's code and does NOT run
    # anything from the PR. It only runs the base branch's own gate
    # script against the PR's metadata.
    #
    # It lives in its OWN workflow file, not in ci.yml. In ci.yml it had
    # to be skipped on `pull_request` runs, and GitHub reports a skipped
    # job as SUCCESS -- which satisfies a required status check of the
    # same name. Every PR would have carried a passing "Live approval
    # gate" without the gate ever running. Here, nothing but
    # pull_request_target ever produces a check with this name.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The BASE branch's code — explicitly NOT the PR's head.
          # `ref: ${{ github.event.pull_request.base.sha }}` pins the
          # checkout to the base commit, so even a misconfigured
          # default branch cannot pull the PR's code in.
          ref: ${{ github.event.pull_request.base.sha }}
          # The gate diffs the base against the head, so it needs the
          # merge base's history, not a shallow clone.
          fetch-depth: 0

      - name: Check the live-approval gate
        env:
          # The gate reads the label timeline through the gh CLI.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          bash scripts/check-live-approval.sh \
            "${{ github.event.pull_request.number }}" "$BASE_SHA" "$HEAD_SHA"

      - name: The gate's own tests
        run: bash scripts/test-live-approval-gate.sh

      - name: The gate runs from the base branch
        # A PR must not be able to weaken the gate that judges it.
        # This asserts the workflow structure that makes that true.
        run: bash scripts/test-base-branch-approval-gate.sh
