name: Nightly

on:
  schedule:
    - cron: "0 14 * * *"  # 14:00 UTC = 22:00 Bali (Asia/Makassar) — runs after you finish work
  workflow_dispatch:       # allow manual trigger from the Actions tab

concurrency:
  group: nightly
  cancel-in-progress: false   # never cancel nightly mid-run; let it finish

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  DATABASE_URL: postgres://gustale:gustale@127.0.0.1:5432/gustale
  SESSION_SECRET: nightly-session-secret-do-not-use-anywhere-real
  AUTH_SECRET: nightly-auth-secret-do-not-use-anywhere-real
  # Mirror the same env-validator-required dummies as ci.yml.
  MINIO_ENDPOINT: http://ci-minio.placeholder.invalid:9000
  MINIO_PORT: 9000
  MINIO_ACCESS_KEY: ci-minio-access-key-do-not-use-anywhere-real
  MINIO_SECRET_KEY: ci-minio-secret-key-do-not-use-anywhere-real
  BETTER_AUTH_SECRET: ci-better-auth-secret-do-not-use-anywhere-real
  NODE_ENV: test

jobs:
  # ─── Full integration: regenerate schema, reseed, run all tests ────
  integration:
    name: Full integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gustale
          POSTGRES_PASSWORD: gustale
          POSTGRES_DB: gustale
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --tmpfs /var/lib/postgresql/data:rw,size=2g

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # PINNED, not floating. Astro 7.4.2 requires node >=22.23.4
          # and refuses to build otherwise:
          #   "Node.js v22.23.1 is not supported by Astro!"
          # A floating "22" drifts: the runner may resolve a 22.x
          # below the floor and the build fails on a dependency's
          # requirement rather than on anything in this repo. The
          # same version is in .nvmrc and in package.json#engines.
          node-version: "22.23.4"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drop the existing schema to prove migrations are reproducible
      # from a clean slate every night.
      - name: Reset database
        run: |
          PGPASSWORD=gustale psql -h 127.0.0.1 -U gustale -d gustale -v ON_ERROR_STOP=1 <<'SQL'
            DROP SCHEMA IF EXISTS public CASCADE;
            CREATE SCHEMA public;
            GRANT ALL ON SCHEMA public TO gustale;
            CREATE EXTENSION IF NOT EXISTS postgis;
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          SQL

      - name: Regenerate schema (catches drizzle schema drift)
        run: pnpm --filter @gustale/db run generate
        continue-on-error: true   # generation is informational; the SQL file is committed

      # ── The FULL migration chain ────────────────────────────────────
      #
      # WHY THIS IS NOW A SCRIPT AND NOT A STEP
      #
      # Until 2026-10-31 the Nightly applied ONLY the drizzle chain:
      #
      #     git ls-files 'packages/db/drizzle/*.sql'
      #
      # and then the seed. It never applied the 33 `db/migrations/*.sql`
      # GUS migrations that `ci.yml` applies. The code needs them:
      # `description_sentences`, `dish_names`, `statements` and
      # `categories.kind` are all created there, so the Nightly's
      # database was missing them and the suite failed with, among
      # others:
      #
      #     relation "description_sentences" does not exist
      #
      # Two Nightly runs failed this way (2026-10-31 06:44 and 09:56
      # WITA) — the job that exists to CATCH drift was itself blind to
      # the drift.
      #
      # The fix is NOT new migration logic. `scripts/ci-migration-chain.sh`
      # already lists the exact chain the CI applies, in the order the
      # CI applies it, including the steps that must run in a specific
      # sequence (the description-sentence population before 0032, 0032
      # before 0033). The Nightly now runs that script, so the two
      # workflows cannot drift apart again.
      #
      # `CHAIN_MODE=ci` tells the script to use the Postgres SERVICE
      # container at 127.0.0.1 instead of `docker exec`-ing the
      # `shared-postgres` container — a GitHub runner has the former
      # and not the latter.
      #
      # The chain builds its own throwaway database (`gustale_nightly`)
      # so it can apply the migrations in order without fighting the
      # service database's pre-existing objects.
      - name: Apply the full migration chain
        env:
          CHAIN_MODE: ci
          PGPASSWORD: gustale
        run: bash scripts/ci-migration-chain.sh gustale_nightly

      # The chain builds `gustale_nightly`; the tests below need
      # DATABASE_URL to point at it. The chain's own database is the
      # one that has the full schema and the seed.
      - name: Point the tests at the chain's database
        run: |
          echo "DATABASE_URL=postgres://gustale:gustale@127.0.0.1:5432/gustale_nightly" >> "$GITHUB_ENV"

      - name: Build db package
        run: pnpm --filter @gustale/db run build

      - name: Run full test suite
        working-directory: apps/api
        run: pnpm test -- --reporter=verbose --coverage
        env:
          # coverage thresholds fail the build if they drop
          COVERAGE_THRESHOLD: 70

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-nightly
          path: apps/api/coverage/
          retention-days: 30

  # ─── Re-translate the stale translations ─────────────────────────────
  #
  # ADR-003 layer 3b: "store the source hash → stale + auto-retranslate
  # on change". The DATABASE marks a translation stale when its English
  # source sentence changes. This job does the re-translation.
  #
  # It runs on the VPS, over SSH, because that is where the live
  # database is. The script is in the VPS's git checkout, so the job
  # updates the checkout and runs it there.
  #
  # The MiniMax OAuth token is a repository secret. It is NOT put on
  # the VPS permanently — it is passed for this one command and the
  # remote shell unsets it.
  retranslate-stale:
    name: Re-translate stale sentences
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # A failure here is NOT a failure of the nightly — a stale
    # translation is a content issue, not a broken build. The job
    # reports and the nightly continues.
    continue-on-error: true

    steps:
      - name: Re-translate on the VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          command_timeout: 40m
          envs: GUSTALE_DB_PASSWORD,MINIMAX_OAUTH_MAX_TOKEN
          script: |
            set -euo pipefail
            BUILD_DIR="${{ vars.GUSTALE_BUILD_DIR || '/home/deploy/gustale-build' }}"
            SHA="${{ github.sha }}"

            if [ ! -d "$BUILD_DIR/.git" ]; then
              echo "::error::no git checkout at $BUILD_DIR"
              exit 1
            fi

            git config --global --add safe.directory "$BUILD_DIR" 2>/dev/null || true
            git -C "$BUILD_DIR" fetch --no-tags --depth=50 origin "$SHA"
            git -C "$BUILD_DIR" checkout --quiet --force "$SHA"

            cd "$BUILD_DIR"

            # The password file may not be readable by this user; the
            # secret is in the environment, and dbq.sh prefers it.
            export GUSTALE_DB_PASSWORD

            python3 scripts/retranslate_stale.py

            unset MINIMAX_OAUTH_MAX_TOKEN

      - name: Report
        if: always()
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "::notice::Telegram secrets not set — skipping the notification"
            exit 0
          fi
          MSG="Nightly re-translation — ${{ job.status }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \\
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \\
            -d parse_mode="Markdown" \\
            -d disable_web_page_preview=true \\
            --data-urlencode "text=${MSG}" \\
            --max-time 10 || echo "::warning::Telegram notification failed (non-fatal)"

  # ─── Production image build verification ────────────────────────────
  build-prod:
    name: Build production image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: integration
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (prod sim)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: |
            gustale-api:nightly-${{ github.run_id }}
            gustale-api:nightly
          load: true
          # No GHA cache — see ci.yml for rationale.
          provenance: false
          # Pass a minimal env so the build doesn't fail on missing .env
          build-args: |
            NODE_ENV=production
